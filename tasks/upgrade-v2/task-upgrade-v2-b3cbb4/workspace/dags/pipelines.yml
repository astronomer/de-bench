weekly_settlement:
  default_args:
    start_date: 2024-03-01
    owner: payments
  timetable:
    callable: airflow.timetables.trigger.CronTriggerTimetable
    params:
      cron: "0 2 * * 1"
      timezone: UTC
  catchup: false
  tasks:
    gather_ledgers:
      operator: airflow.operators.bash.BashOperator
      bash_command: echo gather_ledgers
    reconcile:
      operator: airflow.operators.bash.BashOperator
      bash_command: echo reconcile
      dependencies: [gather_ledgers]

invoice_dispatch:
  default_args:
    start_date: 2024-03-01
    owner: payments
  schedule: '@daily'
  catchup: false
  sla_miss_callback: dags.alerts.invoice_alerts.page_on_delay
  tasks:
    render_invoices:
      operator: airflow.operators.bash.BashOperator
      bash_command: echo render_invoices
    deliver_invoices:
      operator: airflow.operators.bash.BashOperator
      bash_command: echo deliver_invoices
      dependencies: [render_invoices]
