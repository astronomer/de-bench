campaign_ingest:
  default_args:
    start_date: 2024-06-01
    retries: 2
  schedule: '@daily'
  catchup: false
  tasks:
    fetch_campaigns:
      operator: airflow.providers.standard.operators.bash.BashOperator
      bash_command: echo fetch_campaigns
    normalize_campaigns:
      operator: airflow.providers.standard.operators.bash.BashOperator
      bash_command: echo normalize_campaigns
      dependencies: [fetch_campaigns]

contact_dedupe:
  default_args:
    start_date: 2024-06-01
  schedule: '0 */6 * * *'
  catchup: false
  tasks:
    dedupe:
      operator: airflow.providers.standard.operators.bash.BashOperator
      bash_command: echo dedupe
