# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The three lines seller-ops asked for. Patterns are matched case-insensitively

    with re.search and are written loose on purpose: each pins a named thing or a

    direction, never a phrasing, and a table row satisfies them as readily as a

    sentence.

    Line one: what the fourth line type is, and which way it moves what Copperline

    kept. The name on its own is not an answer — the shipped model names it too

    and still adds it — so the second pattern wants the direction, which is the

    whole of the finding.'
  groups:
  - any_of:
    - The fourth line type is a refund (credit note / credit memo) line.
    - Answer identifies the fourth line as a refund line item.
    - A refund/credit-note row appears in the answer's table or list of line types.
  - any_of:
    - A refund reduces the commission Copperline keeps (the take is netted off / lowered).
    - The refund reverses part of the fee Copperline held back — the commission comes off
      / is credited back.
    - Copperline hands back a portion of its take when a refund is issued; the amount kept
      goes down.
    - The refund line subtracts from the commission/fee retained rather than adding to it.
  convicts:
  - States that a refund increases or adds to the commission Copperline keeps.
  - States that the refund leaves Copperline's take unchanged / commission is retained in
    full on refunds.
  - Only names the refund line without saying which direction it moves the retained commission.
- seq: 1
  background: 'Line two: how far out. The credit was added where it should have come off,
    so

    the held-back figure is over by two credits and not by one. A reply that says

    "we are out by the refund" has read half of it.'
  groups:
  - any_of:
    - States the withheld/held-back amount is off by twice the credit (two credits), not one,
      because the credit was added instead of subtracted
    - Says the refund/credit was applied in the wrong direction (added rather than deducted),
      so the error is double the credit amount
    - Explains the discrepancy equals 2 × the refund/credit value due to the sign being flipped
  convicts:
  - Says the figure is over by exactly one credit/refund (off by the refund amount)
  - Claims the credit was simply omitted or missing rather than added with the wrong sign
  - Says the held-back figure is understated/too low rather than too high
- seq: 2
  background: 'Line three: which week a credit lands in, and why a week that has already gone

    out still moves. The summary is cut on the week the order was placed, and the

    credit arrives with a payout run three weeks after the one that carried the

    commission — so it restates a week that closed a month earlier, and the mart

    is rebuilt whole every night. Either half of the "why" is an answer.'
  groups:
  - any_of:
    - The credit is attributed to (lands in / is counted in / is booked in) the week the order
      was originally placed — i.e., the mart is cut on the order date, not the week the payout
      run posted
    - States that the refund/credit belongs to the order's own week (the week the sale was
      placed/sold/taken), in any wording or with markup around the words
  - any_of:
    - The credit arrives with a payout run three weeks (~21 days) after the run that carried
      the original commission
    - Describes the credit as arriving in a later/different/next payout run, or roughly a
      month (e.g. 25-36 days) after the order
    - Explains that the mart is rebuilt/republished in full every night (nightly full rebuild
      of the whole table), so an already-published week restates
  convicts:
  - Says the credit lands in the week the payout run posted (the payout week) rather than
    the order week
  - Claims already-published weeks are frozen/immutable and never restate
  - Claims the mart is incrementally appended or only new weeks are written, rather than rebuilt
    whole each night
