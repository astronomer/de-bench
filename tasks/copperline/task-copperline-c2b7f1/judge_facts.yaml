# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The four lines for the DQ-77 thread. Patterns are matched case-insensitively

    with re.search and are written loose on purpose: each pins a fact or a name,

    never a phrasing, and a table row satisfies them as readily as a sentence.

    Lines one and two, which are one finding: the flag says "both books hold this"

    and says nothing about a date, so it is true of the whole quarter; and the

    money underneath it is the same payment added to itself. The first pattern

    wants the flag''s real reading named, the second the arithmetic. A reply that

    says "the shadow quarter is expected" and stops has not made the argument.'
  groups:
  - any_of:
    - States that the is_shadow_quarter flag means the order/payment is present in both processor
      books (both feeds hold it), i.e. it is an overlap/dual-book condition rather than a
      date test.
    - Explains that the flag is true whenever both processors (Meridian and Halcyon) carry
      the record, so it selected the entire overlap period.
    - Names the flag's real reading as 'seen by both books / both processors' rather than
      'the shadow quarter has ended'.
  - any_of:
    - Explains that the model adds Meridian's captured amount to Halcyon's settled amount,
      so the same payment is counted twice / added to itself, and the reported variance is
      really the order's own total.
    - States that the variance is a double count (the two feeds agree on the shared payments),
      not a real money discrepancy.
    - Says the two amounts are summed together for records held by both books, producing a
      doubled figure rather than a disagreement.
  convicts:
  - Claims the only problem is that the shadow quarter is expected or already known, without identifying either the flag's dual-book meaning or the double counting.
  - Asserts the two processor feeds disagree about the payment amounts, i.e. the variance reflects a genuine money discrepancy.
  - Claims the fix is simply to change or extend the hardcoded end date (e.g. 2025-09-30) with no mention of the flag's meaning or the doubling.
- seq: 1
  background: 'That the test flags the whole quarter and not a tail of it. The ticket says
    the

    test cannot separate the two, so a reply that reaches the cause has this; what

    it convicts is a reply that reports a subset and calls the rest fine.'
  groups:
  - any_of:
    - The test flags the entire quarter, not just a tail or subset of it
    - Every record in the quarter trips the check, so the whole period is implicated
    - All of the overlapping orders/payments are flagged, not a portion of them
    - The check cannot separate the affected rows from the rest — the whole quarter fails
      uniformly
  convicts:
  - Only a subset of the quarter (e.g. the final weeks or a tail of records) is affected,
    and the remaining records are fine
  - The earlier portion of the quarter passes the check while only the later records fail
  - Reports a specific narrow range of flagged rows and declares the rest of the quarter clean
- seq: 2
  background: 'Line three: the record, and what it says. The two dates are the sentence the

    whole ticket turns on — the boundary is in the middle of the overlap and not at

    the end of it — and the second pattern wants the other half of the reading: it

    applies to a settlement row on the row''s own date. Neither is in the ticket.'
  groups:
  - any_of:
    - Cites the processor window/authority table (e.g. raw.pay_processor_windows) as the source
      that defines which book is authoritative when
    - References a processor-window reference table naming the authoritative payment book
      per date range
  - any_of:
    - States the authority boundary is 31 August 2025 / 1 September 2025 — the earlier book
      is authoritative through 31 Aug 2025 and the later book from 1 Sep 2025
    - Gives the cutover date as 2025-09-01 (equivalently, the prior book's authority ends
      2025-08-31), and notes this falls mid-overlap rather than at the overlap's end (e.g.
      not 2025-09-30)
  - any_of:
    - Says the window/authority rule is applied per settlement row using that row's own date,
      rather than assigning a whole order by a single order-level date
    - Explains each row is attributed to the book whose window contains that row's date, so
      a payment captured in August and settled in September is split between the two books,
      each authoritative on its own date
  convicts:
  - Claims the authority boundary or cutover is 2025-09-30 (the end of the overlap / when
    the second feed stopped) rather than 2025-09-01
  - Claims the shadow-quarter flag already encodes a date or an end-of-quarter condition,
    rather than merely meaning both books hold the order
  - Claims the two payment feeds disagree on amounts, i.e. that the reported variance reflects
    a real money discrepancy rather than the same payment being counted twice
  - Claims the window rule should be applied at the order level using a single order date,
    so each order belongs wholly to one book
  - Claims the GL/ledger models (e.g. int_gl_postings_unified, marts.fct_gl_postings, marts.cash_recon_daily)
    are fixed or already correctly de-duplicate the overlap quarter's cash
- seq: 3
  background: 'Line four: how far the same reading reaches. Two answers are wanted and they

    sit in different teams'' trees: the commerce marts that publish the netted money

    off this model, and the ledger, where `int_gl_postings_unified` posts both card

    books whole and `marts.cash_recon_daily` says in its own header that it can

    report the overlap and not resolve it. Neither is named in the ticket, and an

    agent that fixed the model without asking who reads it cannot answer this.'
  groups:
  - any_of:
    - The answer names fct_payments (any prefix).
    - The answer names recon_exceptions (any prefix).
    - The answer names an fct_order* mart (any prefix).
  - any_of:
    - The answer names cash_recon_daily (any prefix).
    - The answer names a gl_postings mart (any prefix).
  convicts: []
