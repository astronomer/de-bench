# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The footnote the pack asked for. Three facts, each pinning a figure or a

    named thing rather than a phrasing; matched case-insensitively with

    re.search.'
  groups:
  - any_of:
    - States that guest / accountless orders make up a share in the 14–18% range (e.g. 16.3%)
      of the week's orders
    - Gives a guest-order count and total order count whose ratio is a percentage between
      14% and 18% (e.g. 4,184 of 25,617)
  - any_of:
    - Mentions the member_orders column in any capacity — e.g. as the denominator of repeat_order_share_bps,
      or as the orders attributed to loyalty members
  - any_of:
    - Says a guest order is counted in the guest_orders column
  - any_of:
    - Says a guest order is counted in the order_count column
  convicts:
  - Claims guest orders are counted in member_orders, distinct_members, or the repeat/new
    member columns
  - Claims repeat_order_share_bps is computed against the day's total orders rather than member
    orders
  - Gives a guest-order share outside the 14–18% range
