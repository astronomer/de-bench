replay: []

checks:

# The substance: both net-sales columns against the returns the customer had
# actually asked for, the three columns the ticket says do not move, the
# population and the grain — on five days across two run dates. The verifier
# stands the warehouse up itself, from raw; see verifier/test_outputs.py and
# the note above on why no prepare step does it. The timeout is headroom for
# the retries, not the measured cost: a healthy run is about a minute.
- kind: pytest_verifier
  file: test_outputs.py
  timeout: 1200

# The three lines the modelling team asked for. Patterns are matched
# case-insensitively with re.search and are written loose on purpose: each pins
# a named thing or a direction, never a phrasing, and a table row satisfies them
# as readily as a sentence.

# Line one: what the row was carrying. Naming returns is not enough on its own —
# the model names them too, through a column whose definition includes them — so
# the second pattern wants the timing, which is the whole of the finding.
- kind: file_contains
  path: RESPONSE.md
  matches:
  - '(refund|return|credit note|\brma\b)'
  - '(had ?n.?t (yet )?(happened|been|arrived|asked|occurred)|not yet (happened|asked|arrived|known|initiated)|after (the|that|its own|the row.s) (row|day|date|ds)|initiated after|arrived after|in the future|from the future|later return|returns? (that|which) (came|arrived|happened|were initiated) later|since the (day|run)|had not happened)'

# Line two: which other column carries the same thing, and which do not. The
# bare `net_sales_cents` is the other one — the word boundary keeps
# `net_sales_cents_30d` from satisfying it — and the counts and the booked money
# are the ones that were already right.
- kind: file_contains
  path: RESPONSE.md
  matches:
  - '\bnet_sales_cents\b'
  - '(booked_cents|orders_7d|orders_30d|orders_90d|the counts?|order counts?)'

# Line three: what the kept files are worth and whether rebuilding helps. The
# answer is the one that reads backwards: a file written the morning after its
# day carries almost none of the leak, and rebuilding it now is what puts the
# leak in. A reply that says "re-run the history and it will be right" has it
# the wrong way round.
- kind: file_contains
  path: RESPONSE.md
  matches:
  - '((old|original|kept|existing|previous|earlier|on.disk|already)[^\n]{0,60}(file|parquet|export|cop(y|ies))|files? (already )?on disk|written (at the time|on the day|the (next|following) (morning|day)))'
  # The flipped polarity joined after a trace audit: "a rebuild is only ever
  # lower" and "the days the retrain rebuilt do not hold what was true" state
  # the same finding from the other side.
  # The bare "did not"/"do not" alternates were withdrawn: "rebuilding did not
  # change anything, so the retrain was safe" is the opposite finding and
  # matched them. A negation only counts bound to a verb that carries the
  # claim, and the bare "wrong" in the reverse arm went the same way —
  # "nothing is wrong ... rebuilt" matched it.
  - '((re-?built?|re-?run|re-?ran|rebuild|backfill|regenerat)[^\n]{0,120}(worse|leak|does ?n.?t help|doesn.t help|no help|not help|would ?n.?t help|wrong|reintroduc|same problem|adds?|pulls? in|brings? in|nets? in|only ever lower|understate|(do|does|did|would|will|can)\s?n.?t\s+(help|fix|match|agree|hold|carry|reproduce|recover|give|return|know))|(worse|leaks?|leaking|leaked)[^\n]{0,120}(re-?built?|re-?run|rebuild|backfill|regenerat))'
