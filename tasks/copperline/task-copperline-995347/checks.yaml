# DEFENSIBLE ALTERNATIVES THAT PASS, and should:
#
#   * The bound taken off `int_net_sales_lines.first_return_date` or
#     `last_return_date` rather than off `stg_sales__returns`. No line in this
#     world carries two returns at all, let alone two on different dates — 0 of
#     the 154,341 measured — so the two land the same figures. It is a thinner
#     reading and it is not wrong here. Run and measured.
#   * `source_id_shape = 'current'` dropped as well, so the acquired book gets
#     rows. The ticket puts it out of scope and an answer that leaves it alone
#     is right; an answer that also fixes it is not convicted, because the
#     population test asks for a superset and no Northwave account has an order
#     in `raw.orders` for the money tests to grade.
#   * Any shape at all: a `lines` CTE, a second model under
#     `models/customer/`, a window function. Nothing here reads the model's
#     structure, only the rows it lands.
#   * A wider table. The verifier selects the five graded columns by name and
#     ignores the rest.
#   * The cap against the line dropped — `discounted_line - refunds` with no
#     `least`. A refund carries the tax back and can exceed the tax-exclusive
#     line, and `int_net_sales_lines` caps it for that reason, but no line
#     inside the five graded windows has a refund larger than the line it came
#     off (measured: 0 of them), so the uncapped rebuild lands the same figures.
#     It is thinner than the world's own rule and it is not convicted here.
#   * An order-grain rebuild that reaches the same discounted value —
#     `gross_line_cents` less the order's own header discount — and takes the
