# The defect is one line of
# `dbt/copperline_analytics/models/customer/feature_customer_daily.sql`:
#
#     coalesce(sum(o.net_sales_cents) filter (where o.order_date <= s.ds), 0)
#
# `o` is `int_orders_enriched` and `net_sales_cents` there is gross less REV-13
# discounts less EVERY return ever matched to the order, whenever the customer
# asked for it. `docs/semantic-definitions.md` defines it that way on purpose
# and four teams read it that way. Summing it into a row dated before the
# customer asked puts a refund into a feature that could not have been known on
# the row's date — which is `contracts/feature-store.md` §FS-1, and the only
# thing this table exists to avoid. The world ships it that way; nothing here
# is planted.
#
# It is silent by construction. The grain holds, `check_contract` passes, and
# `tie_feature_table_has_no_future` guards the ORDER date and only the order
# date, so it stays green over rows whose money knows the future. The model's
# own docstring claims the table is "point-in-time by construction ... with no
# column that could only be known later", which is the claim the ticket
# disproves.
#
# WHY IT ONLY SHOWS ON A REBUILD. The mart is a table with a fifteen-day spine
# and `cus_features_daily` writes one parquet a run, the morning after the day
# it covers, so a shipped file carries at most a few hours of returns it should
# not. Re-running that day now nets against everything that has arrived since.
# Return lag on the orders that name an account runs to a median of 14 days, a
# 90th of 38 and a maximum of 60, measured on `raw.returns` against
# `raw.orders`, so a day rebuilt today is off by weeks. The modelling team
# rebuilt eighteen months of
# it into a training set, which is why the model scored beautifully offline and
# did nothing live.
#
# THE FIGURE IN THE TICKET. "A few dozen accounts" is measured on the shipped
# world: accounts with an order in the thirty days to `ds` carrying a return
# initiated after `ds` number 33 to 49 a day across the five graded days, and 40
# to 57 a day on the running column's wider window. The ticket names no count,
# no cent and no date.
#
# NOTHING HERE HOLDS AN AUTHORED VALUE. The verifier computes the counts and
# `booked_cents_30d` from `raw.orders` in the same session, with the two filters
# staging applies, and the money from `int.int_net_sales_lines` (the line's
# discounted value, a largest-remainder allocation nobody should copy to grade
# a date bound) and `stg.stg_sales__returns` (the refund and the day the
# customer asked). Both live under `dbt/copperline_analytics/models/shared/`,
# which `do_not_modify` holds shut, so no answer can move what it is measured
# against.
#
# WHY DBT RUNS, AND WHY THERE IS NO PREPARE STEP. The world ships the landed
# half of the warehouse only (`AGENTS.md`, "The warehouse"), so the mart does
# not exist until dbt has made it. The verifier builds the leaf and its
# upstream itself — twenty models, about fifteen seconds — and then rebuilds
# the leaf once per run date. It is not a `prepare:` command, because a prepare
# failure is tolerated: the first combined run of this task lost its build to
# container pressure, the step was tolerated, and every test then graded
# relations that were never made. A starved build is a build failure and has to
# read as one. The verifier retries it, the later goes on the profile's larger
# `memory_limit`, and reports dbt's own words if it still will not go.
#
# No DAG replays: `cus_features_daily`'s own steps read `marts.dim_customer`
# for columns the dbt dimension does not carry, so the DAG cannot run in this
# world and the ticket is not about the DAG.
#
# THE FIVE GRADED DAYS, and none of them in the ticket:
#
#   built at 2026-05-12   graded on 2026-05-12, 2026-05-04, 2026-04-28
#   built at 2026-03-04   graded on 2026-03-04, 2026-02-22
#
# Three of the five are days the run did not run on. That is the sharpest edge
# here: a fix that bounds the refunds at `{{ ds() }}` — the run's date — gets
# the top row of the spine right and every row under it wrong. The second run
# date is ten weeks earlier and says the fix is not cut to a window. All five
# sit outside the reserved windows (2026-06-01..09 and 2025-08-31..2025-10-04)
# and outside the never-grade tail (2026-06-10..14).
#
# THE WRONG ANSWERS, and what convicts each:
#
#   nothing delivered, or a note and no model change   verifier: the five money
#                                                      tests
#   the refunds bounded at the run's date rather       verifier: 2026-05-04,
#     than the row's                                   2026-04-28, 2026-02-22
#   the refunds bounded on `received_date`             verifier: money. 139,122
#                                                      of the world's 154,341
#                                                      returns are received on a
#                                                      different day from the
#                                                      one they were asked on,
#                                                      and 38 to 49 accounts a
#                                                      graded day move on it
#   the netting dropped, so the column becomes gross   verifier: money
#   `returned_cents` added back whole                  verifier: money
#   an order-grain rebuild that takes                  verifier: money. That
#     `int_orders_enriched.discount_cents` for the     column is the line
#     line's discounted value                          promotion plus the
#                                                      allocated header
#                                                      discount, and the line
#                                                      promotion is already
#                                                      inside `gross_line_cents`
#   the running column left leaking, only the          verifier: money grades
#     thirty-day one fixed                             both columns
#   the running column's window narrowed to ninety     verifier: money. The
#     days to agree with `projects/customer/lib/       ticket says no window
