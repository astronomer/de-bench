# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The three lines the modelling team asked for. Patterns are matched

    case-insensitively with re.search and are written loose on purpose: each pins

    a named thing or a direction, never a phrasing, and a table row satisfies them

    as readily as a sentence.

    Line one: what the row was carrying. Naming returns is not enough on its own —

    the model names them too, through a column whose definition includes them — so

    the second pattern wants the timing, which is the whole of the finding.'
  groups:
  - any_of:
    - The answer says the row/table carried returns (or refunds / credit notes / RMAs) in
      its figures.
    - The answer mentions returns or refunds being netted out of the sales figure.
    - The answer refers to the net-sales column subtracting returns/refunds.
  - any_of:
    - The answer says the returns netted into a row had not yet occurred, been initiated,
      or been requested as of that row's date.
    - The answer says returns initiated after the row's date (its ds / snapshot day) were
      subtracted from it.
    - The answer describes the row containing later-arriving returns, i.e. information from
      the future relative to the row's own date.
    - The answer says a rebuilt row picks up returns that arrived since the original day,
      whereas the original file could not have known them.
    - The answer states the netting happens against return initiation dates that fall after
      the row's date, and the fix bounds them by the row's own date.
  convicts:
  - The answer concludes there is no leakage or that the figures were correct as built.
  - The answer says the files written on disk are the leaky/bad copies and the rebuilt rows are correct.
  - The answer blames only the rolling order-count windows (orders_30d/90d/7d) or booked_cents_30d as the leaking columns.
  - The answer attributes the leak solely to account attributes or slowly-changing dimension overwrites rather than returns netting.
  - The answer recommends rebuilding history as the remedy without fixing the return-date bound.
- seq: 1
  background: 'Line two: which other column carries the same thing, and which do not. The

    bare `net_sales_cents` is the other one — the word boundary keeps

    `net_sales_cents_30d` from satisfying it — and the counts and the booked money

    are the ones that were already right.'
  groups:
  - any_of:
    - The other column carrying the same (mis-scaled / affected) value is the bare `net_sales_cents`
    - '`net_sales_cents` (word-boundary exact, not `net_sales_cents_30d`) is the other affected
      column'
    - Identifies `net_sales_cents` as the second column with the same problem
  - any_of:
    - '`booked_cents` was already correct and is not affected'
    - The order counts (`orders_7d`, `orders_30d`, `orders_90d`) were already right
    - The counts and the booked money columns are unaffected
  convicts:
  - Claims `net_sales_cents_30d` is the other column carrying the same thing
  - Claims `booked_cents` is also wrong / mis-scaled
  - Claims the order count columns (`orders_7d`/`orders_30d`/`orders_90d`) are affected too
  - States that no other column carries the same value
- seq: 2
  background: 'Line three: what the kept files are worth and whether rebuilding helps. The

    answer is the one that reads backwards: a file written the morning after its

    day carries almost none of the leak, and rebuilding it now is what puts the

    leak in. A reply that says "re-run the history and it will be right" has it

    the wrong way round.'
  groups:
  - any_of:
    - States that the already-written/on-disk daily files (the historical exports, the copies
      produced at the time) are the trustworthy or clean ones
    - Says a day's file was written shortly after that day ended (e.g. the next morning),
      so it captured almost none of the later-arriving returns
    - Characterizes the existing/original snapshot files as carrying essentially no leakage,
      in contrast to freshly regenerated ones
    - The reply tells the reader to keep the existing/original files because they are the
      correct ones — they hold what was true at the time.
  - any_of:
    - States that rebuilding or re-running a historical day now is what introduces the leakage
      / makes things worse
    - Says a backfill or regeneration of past days does not help, does not fix the problem,
      or would reintroduce the future information
    - Explains that a regenerated day nets in returns that arrived after the fact, so the
      rebuilt output is the corrupted one rather than the reference
    - The reply states that before the fix, rebuilding a day did not reproduce what was true
      (the rebuilt day pulled in later-arriving returns) — even if it adds that after the
      shipped fix a rebuild now comes out clean.
  convicts:
  - Claims that re-running or backfilling the history WITH THE PIPELINE AS IT STOOD (before
    any fix) would reproduce the correct historical values.
  - Claims the files sitting on disk are the corrupted ones and a pre-fix rebuild is the clean
    reference.
  - Recommends a rebuild as the remedy WITHOUT a fix that stops later-arriving returns from
    leaking in.
