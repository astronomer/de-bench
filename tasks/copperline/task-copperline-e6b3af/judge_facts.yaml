# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The two lines the meeting asked for. Patterns are matched case-insensitively

    with re.search and are written loose on purpose: each pins a named thing,

    never a phrasing, and none pins a figure — the figures are the verifier''s

    job.'
  groups:
  - any_of:
    - The answer covers the legacy population — the first of the two groups sitting between
      the pack and the close.
    - It names the legacy accounts/customers/contracts explicitly as one of the two populations
      addressed.
  - any_of:
    - The answer covers the credit population — credit memos, credits, or credit notes — as
      the second of the two groups between the pack and the close.
    - It names credit memos (or credits / credit notes) explicitly.
  - any_of:
    - The answer states that the booked column does not move when a refund is issued — the
      refund leaves booked unchanged.
    - It says booked stands / holds / is untouched / is not affected by the refund, naming
      booked as the column that stays put.
    - It explicitly identifies booked as the one figure a refund never touches, not merely
      listing the columns.
  convicts:
  - The answer lists the columns (e.g. booked, billed, recognized) without saying which one
    a refund leaves unchanged.
  - The answer claims a refund reduces or otherwise changes the booked figure.
  - The answer omits the legacy population entirely.
  - The answer omits credit memos / credits entirely.
  - The answer says the refund moves all three columns, or is vague about which column holds
    still.
