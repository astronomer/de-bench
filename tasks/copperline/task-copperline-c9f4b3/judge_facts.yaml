# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The record the ticket asks for. Patterns are matched case-insensitively with

    re.search and are written loose: each pins a name or a fact, never a phrasing,

    and a table row satisfies them as readily as a sentence.'
  groups:
  - any_of:
    - Names the missing column deletion_pending, the field growth's segment query filtered
      on
    - Refers to the deletion_pending flag as the column absent from the audience mart
  - any_of:
    - Names marts.consent_daily as the table that actually carries the flag
    - Refers to the consent mart / consent_daily as where deletion_pending lives, one row
      per account per channel per day
  - any_of:
    - Describes the underlying fact as a deletion or erasure request that is in flight / pending
      in the request queue
    - Cites the retention policy rule RET-4 or the audience-sync clause AS-3 that bars customers
      with a pending deletion request from segment files
  - any_of:
    - Names the downstream destinations Beacon Ads, Tessera Social and Halyard
    - States that all three audience destinations were affected / would have received the
      data
  convicts:
  - Claims the audience mart does have a deletion_pending column and the failure was something
    else (e.g. a typo, permissions, or an empty result set)
  - Recommends adding deletion_pending to marts.audience_segments as the fix
  - Recommends dropping or bypassing the deletion_pending filter so the sync can run
  - Claims the query failed at runtime after reading rows, or that some rows were successfully
    pushed to a destination
