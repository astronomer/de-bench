# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The answer. 3,960 active accounts on Copperline''s book plus 1,380 on the

    acquired book, less the 300 pairs that are the same business twice, is 5,040.

    The number has to sit against the claim it answers, not merely appear

    somewhere in the file, so a reply that lands on 5,092 and mentions 5,040 in

    passing fails.'
  groups:
  - any_of:
    - The answer states that the combined number of active accounts is 5,040.
    - The response concludes 5,040 active accounts (3,960 + 1,380 - 300 overlap).
    - The final count given for active accounts is 5,040.
  convicts:
  - The answer gives a total other than 5,040 (e.g., 5,092 or 5,340) as its conclusion, mentioning
    5,040 only incidentally.
  - The answer fails to subtract the 300 duplicate accounts counted on both books.
  - The answer presents 5,040 without tying it to the number of active accounts.
- seq: 1
  background: 'The split. It has to add to the count, which is the arithmetic the headline

    hides: 3,960 accounts on Copperline''s book, and 1,080 on the acquired book

    once the 300 merged ones are on the Copperline side. An agent that counted

    the acquired book''s 20 inactive accounts, or that dropped the acquired book

    altogether, cannot produce both figures.'
  groups:
  - any_of:
    - Copperline's book holds 3,960 accounts
    - States 3,960 as the account count on the Copperline side (including the 300 merged accounts)
    - Reports 3,960 accounts for Copperline
  - any_of:
    - The acquired book holds 1,080 accounts
    - States 1,080 as the account count on the acquired book after the 300 merged accounts
      move to Copperline
    - Reports 1,080 accounts for the acquired book
  convicts:
  - Counts the acquired book's 20 inactive accounts toward its total (e.g., reports 1,100
    instead of 1,080)
  - Drops the acquired book entirely and reports only a single combined total
  - Leaves the 300 merged accounts on the acquired book's side rather than the Copperline
    side
  - Reports a Copperline count other than 3,960 (e.g., 3,660)
  - Reports an acquired-book count other than 1,080
- seq: 2
  background: 'The overlap. 300 is the whole difference between a defensible number and the

    board pack''s, so a method that never states it is not a method.'
  groups:
  - any_of:
    - The answer identifies the 300 as the overlap between the two books (i.e., accounts appearing
      in both), and says so explicitly.
    - The answer states that 300 records are duplicates/double-counted across the two sources
      and must be netted out once.
    - The answer explains the 300 as the paired/matched/merged records shared by both lists,
      naming the number and the reason together.
    - The answer ties the figure 300 to a de-duplication or reconciliation step that reconciles
      the defensible number with the board pack's number.
  convicts:
  - The answer never mentions the number 300 at all.
  - The answer mentions 300 but never connects it to overlap, duplication, matching, merging,
    or presence in both books.
  - The answer asserts the two sources have no overlap or that no de-duplication is needed.
  - The answer simply adopts the board pack's figure without explaining the 300 difference.
- seq: 3
  background: 'Where the pairing came from. The reviewed decisions are the source of record

    and a re-derived match is not, so the reply has to name the review rather than

    a matching rule of its own.'
  groups:
  - any_of:
    - The answer states that the pairing of accounts across the two books comes from the human-reviewed
      merge decisions (e.g. the ops.merge_candidates table of ~300 reviewed pairs), naming
      that reviewed decision set as the source of the pairs.
    - The answer says the pairs used for deduplication are the ones decided/adjudicated by
      people during the integration review, not pairs re-derived by a matching rule.
    - The answer identifies the reviewed merge-decision table as the source of record for
      which accounts are the same business, and says a re-derived match is not.
  convicts:
  - The answer derives the overlap itself from a matching rule (such as shared e-mail domain,
    name, or city) and presents that derived match as the authoritative basis for the final
    count, rather than using the reviewed merge decisions.
  - The answer treats the CRM's domain-matched pairing (or any other re-derived match) as
    an acceptable substitute for the reviewed merge decisions.
- seq: 4
  background: 'Both numbers in circulation are accounted for, and the board pack''s is

    explained as the two books added with nothing merged. The ticket asks for

    this in as many words; a reply that gives a number and says nothing about the

    two that finance and the customer team already hold has not settled anything.'
  groups:
  - any_of:
    - The answer states the figure 5,340 (any formatting).
  - any_of:
    - The answer states the figure 5,092 (any formatting).
  - any_of:
    - The answer states that 5,340 is the two account books added together without any merge/dedup
      applied (double-counting the shared accounts), in any wording — 'both books', 'no merge
      applied', 'neither deduplicated' all count.
  convicts: []
- seq: 5
  background: 'What the CRM subtracted. 5,092 is the two books less the 248 pairs a matcher

    collapsed on shared e-mail domain — 205 real merges and 43 separate

    businesses on a shared provider. The ticket asks what the number is

    counting, and the answer is the rule and the count it removes together; a

    reply that calls 5,092 a mystery, or guesses at the rule without the 248

    that pins it to the data, has not answered. The first run proved this check

    is needed: an agent passed the other five while writing "the CRM''s 5,092 is

    unclear". The final run proved the first version of this check too loose:

    an agent passed it with 248 as bare arithmetic (5,340 - 5,092) plus the

    word "domain" from an unrelated sentence, while calling the rule "an

    inference, not a documented method". The 248 must now sit within a

    160-character window of the domain rule, and the reply must carry one half

    of the 205/43 split that only a query yields. A wrapped line between the

    figure and the rule still matches; the window crosses newlines on purpose.'
  groups:
  - any_of:
    - The reply ties the 248 collapsed pairs to the shared e-mail domain rule within the same
      breath — e.g. "248 pairs collapsed on a shared e-mail domain" — with the figure and
      the rule no more than ~120 characters apart and not split by a sentence boundary.
    - The reply states the domain rule first and then the count, e.g. "the matcher merged
      on e-mail domain, collapsing 248 pairs", keeping the two inside one sentence.
  - any_of:
    - The reply reports 205 as the count of real/true merges or matched pairs (any attribution
      — the domain matcher or ops.merge_candidates' tax-id method both count).
    - The reply reports 43 as the count of pairs/businesses that are NOT the same business
      (separate companies sharing a provider or domain).
    - The reply attaches either figure (205 or 43) to its noun — pairs, merges, businesses,
      companies — in either order.
  convicts:
  - The reply calls the CRM's 5,092 unclear, unexplained, a mystery, or otherwise says it
    cannot account for the gap.
  - The reply presents the e-mail domain rule as a guess, an inference, or not a documented
    method, rather than as a fact established by querying the data.
  - The reply gives 248 only as bare arithmetic (5,340 minus 5,092) without connecting it
    to the shared e-mail domain matching rule.
  - The reply cites 43 or 205 in an unrelated context (e.g. a percentage, a different total,
    or a list position) rather than as the count of merges or separate businesses.
