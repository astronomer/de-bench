# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: The note. Three facts, each pinning a figure or a named thing.
  groups:
  - any_of:
    - There are nine guest buckets — one per market that has ever taken an order naming nobody
      (US, GB, DE, CA, IE from the first day of the feed, plus BR, MX, ID, PL from 2026-02-01).
    - States 9 rows/markets/guest buckets, with the number sitting next to the thing it counts.
  - any_of:
    - Those buckets carry 515,617 orders (count(*) over the same query).
    - Writes the figure as 515617 or 515 617 — the comma or space is optional.
  - any_of:
    - dim_customer is one of the five models that read this int model.
  - any_of:
    - agg_customer_rfm is one of the five readers.
  - any_of:
    - agg_cohort_retention is one of the five readers.
  - any_of:
    - churn_scores_weekly is one of the five readers.
  - any_of:
    - audience_segments — the fifth reader, owned by growth (models/growth/), not the customer
      team; an agent scoped only to the ticket-owning team lists just four.
  - any_of:
    - 'None of the five readers'' numbers move: each filters to party_kind = ''trade'' or
      joins party_key to a resolved customer_key, which a GUEST- key never matches, so no
      guest row has ever reached a published mart.'
    - Says nothing changes with the negator against the noun it negates ('no numbers move'),
      or as an answer form ('Do its numbers move? No'), or the one-word verdict 'unmoved',
      or a No in the moves column of a table.
  - any_of:
    - Mentions the 180-day threshold adjacent to the thing it measures (e.g. '180 days').
  convicts:
  - Claims the guest buckets do reach published marts, or that the five aggregates will move
    / that no reader filters the buckets out today.
  - Lists only four readers, omitting the growth-owned audience_segments.
  - Gives a guest bucket count other than nine, or an order count other than 515,617.
