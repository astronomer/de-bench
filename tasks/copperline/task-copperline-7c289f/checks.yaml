# The defect is one line of
# `dbt/copperline_analytics/models/customer/feature_customer_daily.sql`:
#
#     where source_id_shape = 'current'
#
# `source_id_shape` on `marts.dim_customer` says which format an account's id
# arrived in — `current` for a `C-######`, `legacy` for a pre-cutover
# `CUST####`, `northwave` for an `NWA-#####`. It is not a version. The
# dimension is not versioned either: it carries no `valid_from`, no `valid_to`,
# and one row per account. So the line drops the acquired book — every account
# that came over at the acquisition and that no merge decision folds onto a
# Copperline account. The world ships it that way; nothing here is planted.
#
# WHY IT IS THE TRAP IT IS. The line reads exactly like the current-version cut
# `contracts/feature-store.md` §FS-1 forbids, and three files in the world say
# so in as many words — FS-1's own Notes, the DAG's `doc_md`, and the module
# docstring of `projects/customer/lib/features.py` all warn that "filtering the
# dimension to its current version is the shortest way to a full table and is
# what FS-1 forbids". A reader who takes the line at that reading has two ways
# to go wrong and both are live:
#
#   * treat the filter as load-bearing — FS-1 compliance that must not be
#     touched — and put the acquired half back through a second source. Every
#     obvious second source is `raw.nwv_accounts` or its staging view, which
#     carries all 1,400 acquired accounts including the 300 a person has
#     already decided are Copperline customers. That is the FY2025 double
#     count the dimension's own docstring is about.
#   * take the filter as the FS-1 breach itself and replace it with an as-of
#     join through a validity window. `marts.dim_customer` has no validity
#     window, so the model does not build.
#
# It is silent by construction. FS-2's grain holds over a smaller population,
# `check_contract` passes over a smaller population, and `check_as_of` compares
# the rows it finds against the dimension and never asks which rows are absent.
#
# THE SHAPE OF THE ANSWER. The dimension already resolves both books to one row
# an account: a decided merge folds the Northwave account onto the Copperline
# key and the Copperline row survives, so the `northwave` rows left over are
# exactly the accounts nobody has decided are somebody else. Reading the
# dimension whole is the population and keeps the grain by construction.
#
# THE FIGURES IN THE TICKET. "About four thousand rows" and the 5,040 from
# NW-214 are both measured on the shipped world. `raw.customers` holds 4,000
# accounts of which 20 carry a `deleted_at` and staging drops them, so the
# master's Copperline half is 3,980 and the shipped file lands 3,980 rows a
# day — measured, on a world built at the small profile, which keeps every
# entity and scales only the fact volumes, and whose build asserts the two
# account books to the row at either profile. `raw.nwv_accounts` holds 1,400 and
# `ops.merge_candidates` holds 300 pairs, every one of them decided by a named
# reviewer, so the acquired half the master keeps is 1,100 and the whole book
# is 5,080. NW-214 (`task-copperline-9eabaf`) counts the *active* half of the
# same two books and lands 5,040; this ticket cites that number as the one
# planning is using and grades nothing against it. The ticket names no other
# count and no date.
#
# NOTHING HERE HOLDS AN AUTHORED VALUE. The verifier reads the account book off
# `marts.dim_customer` in the same session and checks it against
# `raw.customers`, `raw.nwv_accounts` and `ops.merge_candidates` before it
# grades anything. The counts and the booked money come from `raw.orders` with
# the two filters staging applies. The acquired half's trailing windows are not
# asserted to be zero on an author's say-so: a guard reads the order book for
# those ids first and the substance test only claims what the guard found.
# `marts.dim_customer` and everything under
# `dbt/copperline_analytics/models/shared/` are held shut, so no answer can
# move what it is measured against.
#
# HOW THIS COMPOSES WITH CUS-509 (`task-copperline-995347`), which is open on
# the same model file. That ticket owns the date a refund comes off a line —
# `net_sales_cents` and `net_sales_cents_30d` on an account that has traded.
# This one owns which accounts are on the file. The split is enforced on both
# sides: nothing here reads either money column on a trading account, and the
# only rows where this file does read them are the acquired accounts, whose
# money is zero under either reading because they have no order in
# `raw.orders`. The two are one line apart in the same CTE.
#
# Run and measured, on a world built at the small profile:
#
#   this solution                against 995347's verifier   21 pass, the five
#                                                            money tests fail
#                                                            — it does not fix
#                                                            the netting and is
#                                                            not meant to
#   995347's solution            against this verifier       18 pass, the four
#                                                            population tests
#                                                            fail — same, the
#                                                            other way round
#   both fixes in one model      against this verifier       22 of 22 pass
