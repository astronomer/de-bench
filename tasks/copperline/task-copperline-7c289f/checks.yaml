#                                                            needs a day where
#                                                            some account's
#                                                            money moves and
#                                                            does not get one
#                                                            at a twentieth of
#                                                            the return volume
#
# So a tree that fixes both passes both, which is the property that matters.
#
# WHY DBT RUNS, AND WHY THERE IS NO PREPARE STEP. The world ships the landed
# half of the warehouse only (`AGENTS.md`, "The warehouse"), so the mart does
# not exist until dbt has made it. The verifier builds the leaf and its
# upstream itself and then rebuilds the leaf once per run date. It is not a
# `prepare:` command, because a prepare failure is tolerated: a build starved
# of the single DuckDB writer would leave every test grading relations that
# were never made, and read as a wrong answer. The verifier retries it, the
# later goes on the profile's larger `memory_limit`, and it reports dbt's own
# words if it still will not go.
#
# No DAG replays: `cus_features_daily`'s own steps read `marts.dim_customer`
# for a validity window the dbt dimension does not carry, so the DAG cannot run
# in this world and the ticket is not about the DAG.
