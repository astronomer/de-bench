# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The find, in writing. Two patterns: the file the wait looks for, named, and

    the fact that nothing produces it. Matching is case-insensitive and loose on

    purpose — what is pinned is the claim, never a phrasing.'
  groups:
  - any_of:
    - The answer names the awaited file/glob pattern, e.g. sell_through_<date>, sell_through_*,
      sell_through_{...}, or SELL_THROUGH_GLOB, as the artifact the wait/sensor is looking
      for.
    - It identifies the sell_through_ prefixed path/glob (any bracket or wildcard form) as
      the sensor's target file.
  - any_of:
    - The answer states that nothing in the pipeline writes, produces, creates, exports, lands,
      or generates that file.
    - It says no DAG, job, model, script, export, producer, task, step, writer, or file ever
      writes/produces/creates that artifact.
    - It says there is no producer or no writer for the awaited path.
    - It says the file doesn't exist, never lands, or never arrives.
  convicts:
  - Claims some existing DAG, job, or script does write the sell_through file (i.e., that
    a producer exists).
  - Attributes the failure solely to a permissions, credentials, or network issue rather than
    the missing producer.
  - Claims the file is produced but merely arrives late, is delayed, or is written to a different
    path by an existing producer.
  - Concludes the wait/sensor configuration (timeout, poke interval, schedule) is the root
    cause rather than the absent producer.
- seq: 1
  background: 'The second fault, which is the half that separates reading the query from

    making the DAG move. `marts.dim_product` carries `supplier_id`; the share

    filters `supplier_name`, which is not a column of it and is not a column of

    anything else in the warehouse either. A reply that names all three has read

    the dimension.'
  groups:
  - any_of:
    - The answer identifies `supplier_name` as the column the share filters on.
    - The answer notes the filter/predicate references `supplier_name`.
    - The answer states `supplier_name` does not exist in `marts.dim_product` (or anywhere
      in the warehouse).
  - any_of:
    - The answer identifies `supplier_id` as the column that `marts.dim_product` actually
      carries.
    - The answer contrasts the available `supplier_id` with the requested `supplier_name`.
  - any_of:
    - The answer names `marts.dim_product` (or `dim_product`) as the dimension table involved.
    - The answer refers to the product dimension `dim_product` when describing the second
      fault.
  convicts:
  - The answer claims `supplier_name` is a column of `marts.dim_product`.
  - The answer claims `supplier_name` exists somewhere else in the warehouse and can simply
    be joined in.
  - The answer says the second fault is only a query/reading issue and does not require changing
    the DAG or the dimension model.
  - The answer confuses `supplier_id` and `supplier_name`, treating them as interchangeable.
- seq: 2
  background: 'And who settles it. Deliberately shallow — it asks whether the reply hands
    the

    open question to somebody rather than leaving it hanging, which is the third

    thing the ticket asks for in as many words.'
  groups:
  - any_of:
    - the reply names who resolves the open scope question — e.g. it asks the supply/merch
      team (or the Kestrel vendor contact / supplier_id owner) to confirm or settle which
      SKUs are in scope
    - the reply routes the unresolved SKU-list / supplier_id scope question to a named owner
      or team for a decision, rather than leaving it unassigned
    - the reply states that supply, merch, or the vendor owns the call on scope and must confirm
      or state the SKU list
  convicts:
  - the reply raises the scope/SKU-list ambiguity but leaves it hanging with no person or
    team responsible for resolving it
  - the reply resolves the scope question by its own assumption without deferring to or naming
    any owner
  - the reply does not mention the scope / SKU list / supplier_id question at all
