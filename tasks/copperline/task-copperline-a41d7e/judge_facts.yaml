# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'THE MONTH, AND THE BOUNDARY INSIDE IT. September 2025 is FY2025 P8, which

    runs 2025-08-31 to 2025-10-04 on the 4-5-4 calendar. Meridian becomes

    authoritative on 2025-09-01, so the month''s first day belongs to Halcyon and

    the other thirty-four to Meridian.


    calendar September   loses 2025-08-31 and the four October days. The

    Meridian part alone comes out at 74,095 payments

    rather than 84,933.

    2025-07-01           the day Meridian''s feed appeared, which the runbook

    says twice is not the day it became authoritative.'
  groups:
  - any_of:
    - Identifies the period as FY2025 P8 (fiscal period 8 of FY2025)
    - States September 2025 corresponds to FY2025 P8 on the 4-5-4 retail calendar
    - Refers to FY2025 P08 / FY-2025-P8 as the relevant reporting period
  - any_of:
    - States the period begins 2025-08-31 (first day of FY2025 P8)
    - Notes 2025-08-31 belongs to the period but is attributed to Halcyon, not Meridian
    - Includes 2025-08-31 as part of the 35-day P8 window
  - any_of:
    - States the period ends 2025-10-04 (last day of FY2025 P8)
    - Notes the four October days through 2025-10-04 fall inside P8
    - Includes 2025-10-04 as the closing boundary of the 35-day window
  - any_of:
    - States Meridian becomes authoritative on 2025-09-01
    - Attributes the 34 days from 2025-09-01 through 2025-10-04 to Meridian
    - Uses 2025-09-01, not 2025-07-01, as the Meridian cutover/authoritative date
  convicts:
  - Uses the calendar month of September (2025-09-01 to 2025-09-30) as the period, omitting
    2025-08-31 and the October days
  - Reports the Meridian-only figure as 84,933 payments instead of 74,095
  - Treats 2025-07-01 (the date Meridian's feed appeared) as the date Meridian became authoritative
  - Attributes 2025-08-31 to Meridian rather than Halcyon
- seq: 1
  background: 'THE COUNT. 87,475 payments — 2,542 on the Halcyon day and 84,933 on the

    Meridian days. Both figures are required, because the month''s total alone

    does not show that the boundary was applied: the reply has to say how much of

    the month the old processor still owns.


    134,421   both feeds added across the whole month. PRM-1 and B-8 both warn

    about it in as many words, and it is half again the month.

    88,923   the corrections counted as payments of their own on top of the

    originals they restate.

    169,866   the `authorized` events counted as well. B-1 says an

    authorization is the issuer holding funds and is not money.

    74,095   calendar September, Meridian only.


    A reply that works the whole month off Meridian, ignoring the windows table,

    lands 87,475 as well: the two feeds carry the same 2,542 payments on

    2025-08-31, to the cent and per currency, because that is what the shadow

    quarter was for. It cannot produce check 4, which is Halcyon''s alone.'
  groups:
  - any_of:
    - States the total payment count for the month as 87,475
    - Gives 87,475 as the number of payments across the boundary (Halcyon plus Meridian)
    - Reports 87475 payments total
  - any_of:
    - States that 2,542 payments fall on the Halcyon day (2025-08-31)
    - Gives 2,542 as the Halcyon-owned portion of the month
    - Reports 2542 payments from the Halcyon feed
  convicts:
  - Reports the month's total as 134,421 (both feeds added together across the whole month)
  - Reports the total as 88,923 by counting corrections as separate payments on top of the
    originals they restate
  - Reports the total as 169,866 by counting `authorized` events as payments
  - Reports the total as 74,095 (calendar September, Meridian only), omitting the Halcyon
    boundary day
  - Gives only the month total without stating the Halcyon-day (2,542) and Meridian-day (84,933)
    split
  - Treats an `authorized` event as money received rather than the issuer holding funds
- seq: 2
  background: 'THE MONEY, PER CURRENCY. USD 3,100,537,937, GBP 771,950,330, EUR 952,225,300,

    in integer cents, in the currency each payment was taken in. Adding the three

    is meaningless and the ticket says not to, so no total is graded.


    3,116,971,586 / 763,984,167 / 943,757,814   Halcyon''s blank currency read

    as USD. 849 of the boundary day''s 2,542 rows arrive blank and the

    merchant account is what fills them in.

    3,075,719,892 / 763,984,167 / 943,757,814   the blank-currency rows dropped

    instead.

    3,089,931,630 / 769,847,879 / 949,400,659   the soft-deleted rows dropped,

    against R-6.

    1,210,706.14   the Halcyon day summed as a number rather than parsed to

    cents: dollars, and a float, for the one money column in the

    world that arrives as text.'
  groups:
  - any_of:
    - States the USD total as 3,100,537,937 (integer cents), e.g. "USD 3,100,537,937" or "3100537937"
      cents
    - Reports USD 3,100,537,937 cents as the per-currency USD figure
  - any_of:
    - States the GBP total as 771,950,330 (integer cents), e.g. "GBP 771,950,330" or "771950330"
      cents
    - Reports GBP 771,950,330 cents as the per-currency GBP figure
  - any_of:
    - States the EUR total as 952,225,300 (integer cents), e.g. "EUR 952,225,300" or "952225300"
      cents
    - Reports EUR 952,225,300 cents as the per-currency EUR figure
  convicts:
  - Reports USD as 3,116,971,586 cents (Halcyon's blank-currency rows read as USD)
  - Reports USD as 3,075,719,892 cents (blank-currency rows dropped instead of being filled
    from the merchant account)
  - Reports USD as 3,089,931,630, GBP as 769,847,879, or EUR as 949,400,659 cents (soft-deleted
    rows dropped, against R-6)
  - Reports GBP as 763,984,167 or EUR as 943,757,814 cents
  - Reports the Halcyon day as 1,210,706.14 (summed as a float in dollars rather than parsed
    to integer cents)
  - Sums the three currencies into a single combined total
- seq: 3
  background: 'THE LEGACY FEED WAS ACTUALLY OPENED. 849 of the boundary day''s rows carry
    no

    currency, and Halcyon is the only feed in the world with that column, so this

    figure cannot be reached from Meridian. It is what separates a reply that

    read the windows table and then worked both feeds from one that took Meridian

    for the whole month and got the right total by the wrong route.


    The count is tied to what it counts, so a stray 849 elsewhere in the file

    does not satisfy it.'
  groups:
  - any_of:
    - The answer reports 849 rows on the boundary day as having no currency value (e.g., blank/empty/null/missing/unset
      currency), tying the number 849 directly to the currency column.
    - The answer states that the currency field is blank/null/missing for 849 of the boundary
      day's rows in the Halcyon legacy feed.
  convicts:
  - The answer mentions 849 without connecting it to the currency column being blank/empty/null/missing
    (e.g., a stray 849 used for some unrelated count).
  - The answer claims the boundary day was handled entirely from the Meridian feed, or that
    the legacy Halcyon feed was not needed/opened.
  - The answer attributes the currency column to Meridian rather than to the Halcyon legacy
    feed.
- seq: 4
  background: 'WHAT WAS LEFT OUT. 46,946 payments sit inside the month and are not counted:

    44,404 Halcyon rows dated 2025-09-01 to 2025-09-30, and the 2,542 Meridian

    shadow copies of the boundary day the count reads off Halcyon. (This label

    has flipped twice. A bare count cannot settle it — both feeds carry 2,542

    payments on 2025-08-31 by design, so counting either feed prints the same

    number. The discriminating query is the join: every one of Halcyon''s 2,542

    boundary-day rows has a Meridian `captured` event on the shared reference —

    2,542 of 2,542 on `merchant_ref = order_ref` — and since check 2 counts the

    day from Halcyon, the copy left out is Meridian''s. Meridian''s raw event

    count that day is 2,608; the 66 extra are restatement events B-7 folds into

    their originals, which is why the excluded side is 2,542 at the payment

    grain.) Both halves are required — the boundary cuts in two directions on

    the same month and a reply that only drops the old feed has seen one of

    them.


    44,404   only Halcyon''s month-after rows dropped, with Meridian''s shadow

    day left in. That is the reading that puts the switchover on the

    day the second feed appeared.

    0   both feeds added, so nothing was left out at all.'
  groups:
  - any_of:
    - States that 46,946 payments inside the month are excluded from the count
    - Gives 46,946 as the total number of uncounted in-month payments
    - Writes the excluded total as 46946 / 46,946
  - any_of:
    - Identifies 44,404 Halcyon rows dated 2025-09-01 to 2025-09-30 as part of the excluded
      set
    - Breaks the 46,946 into 44,404 Halcyon month-after rows plus 2,542 Meridian boundary-day
      shadow copies
    - Writes 44,404 as the Halcyon September component
  convicts:
  - Says 44,404 is the complete answer, with the Meridian boundary-day copies left in the
    count
  - Says nothing was left out / the excluded count is 0 because both feeds were added
  - Claims the 2,542 boundary-day rows excluded are Halcyon's rather than Meridian's
  - Claims a bare count of either feed can settle which side is excluded
  - States the excluded boundary-day figure as 2,608 at the payment grain instead of 2,542
- seq: 5
  background: 'THE CORRECTIONS. 1,455 of the month''s payments are restated by a later event.

    R-5 dates a correction to the day it restates, not the day it arrives, and

    B-7 says to take the highest revision of an event.


    1,448   the corrections that LAND in the month, which belong to earlier

    months. That is the same fact read off the wrong date, and it is

    the number a reply gets by filtering on the correction''s own

    `event_time_utc`.

    0   `restates_event_id` never looked at.'
  groups:
  - any_of:
    - States that 1,455 payments of the month are restated/corrected by a later event, i.e.
      the correction count is dated to the payment day being restated (via restates_event_id)
      rather than to the day the correction arrived
    - Gives 1,455 as the number of in-month payments that have a later restatement, distinguishing
      it from the 1,448 corrections whose own timestamp falls in the month but which restate
      earlier months
  convicts:
  - Reports 1,448 (or any figure other than 1,455) as the number of the month's payments that
    are restated by a later correction, i.e. dates corrections by their own event_time_utc
    instead of the restated event's date
  - Reports 0 corrections, or otherwise ignores restates_event_id / omits any correction handling
- seq: 6
  background: 'THE DELETES, AND THE ORDERS. 261 of the month''s Meridian rows carry a

    `deleted_at` and stay in, per R-6, which says a deleted row is neither

    filtered out nor treated as missing. 80,225 orders sit behind the month''s

    87,475 payments — 77,904 on the Meridian side and 2,321 on the Halcyon day —

    and either the whole-month figure or the Meridian one satisfies the second

    pattern, because a reply may reasonably scope the order question to the side

    where the bridge answers it exactly.


    0     the deleted rows filtered out at the top of the query, which also

    moves all three currency figures in check 3.

    87,475   payments counted as orders. 7,029 orders in the month paid with

    two card payments.

    1,269,154 orders reached by joining `order_ref` to `raw.orders` with no

    date window. Seven digits cannot hold an order key that runs past

    180 million, so one reference names about three orders across the

    estate.


    The reference plus a date is the only join to `raw.orders` there is, and it

    is exact here: the reference and the attempt''s own date match every one of

    the month''s payments to one order and leave none over, at any window from

    three days to thirty. `raw.payment_intents.order_id` carries the processor''s

    own order number, does not resolve against `ORD-########` and will not join;

    counted rather than joined it gives the same 77,904, which is why both

    figures are the same and either route is honest.'
  groups:
  - any_of:
    - Says 261 of the month's Meridian rows carry a `deleted_at` (are deleted/removed) and
      are still included, per R-6
    - Mentions 261 deleted rows that are neither filtered out nor treated as missing
  - any_of:
    - Reports 80,225 orders behind the month's payments
    - Reports 77,904 orders on the Meridian side
  convicts:
  - States that 0 rows were deleted or that the deleted rows were filtered out at the top
    of the query
  - Reports 87,475 as the order count (payments counted as orders)
  - Reports 1,269,154 orders from joining `order_ref` to `raw.orders` with no date window
  - Claims the join to `raw.orders` is ambiguous or that one reference names about three orders
  - Claims `raw.payment_intents.order_id` joins/resolves against `ORD-########` order keys
