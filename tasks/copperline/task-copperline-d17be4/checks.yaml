replay: []

checks:

# The job still imports and the bag is clean.
- kind: dag_parses
  dag_id: fin_invoice_dispute_daily

# The four steps stay. The ticket says the mart rebuild, the cents check and the
# publish belong to another ticket, and an exact task-id set is also what stops
