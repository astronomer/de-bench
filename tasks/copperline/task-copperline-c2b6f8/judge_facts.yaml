# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The three lines the review pack asked for. Patterns are matched

    case-insensitively with re.search and are written loose on purpose — each

    pins a named thing or a direction, never a phrasing.'
  groups:
  - any_of:
    - 'Names the model the short number comes from: int_promo_exposure'
    - Names dim_promotion as the model involved
    - Names agg_promo_performance as the model involved
    - Refers to promo_exposure as the model where the number originates
  - any_of:
    - Points to eligibility as the starting point of the model's logic
    - Refers to the eligible set / eligibility criteria driving the count
    - Mentions the promotion window as the eligibility condition
    - Mentions market as an eligibility condition
    - Mentions min_order / minimum order value as the eligibility condition
  - any_of:
    - Says the loss happens in a join
    - Says the loss happens in a filter or WHERE restriction
    - Says rows are dropped
    - Says rows are excluded or discarded
    - Says redemptions are lost or never reach the model
    - Says records are left out or restricted out
  - any_of:
    - States the number is short
    - States the number is understated / too low / low by some amount
    - States the model misses or is missing redemptions
  - any_of:
    - States the dropped discounts were real money
    - States the discount actually went out / was actually given to customers
    - States the redemptions genuinely happened or were recorded
    - Affirms the missing cents are genuine spend, not an artifact
  convicts:
  - Attributes the discrepancy to rounding of cents rather than a join or filter
  - Attributes the discrepancy to a date/day window offset or timezone shift in reporting
    rather than eligibility-based row loss
  - Claims the number is too high / overstated rather than short
  - Hedges on whether the dropped discounts represent real money, e.g. suggests they may be
    duplicates, test rows, or otherwise not genuine spend
  - Claims the totals actually reconcile and there is no shortfall
