# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The note retention asked for. Four decisions, and the headline — that there

    are two scores — is one of them rather than all of them. Patterns are matched

    case-insensitively with re.search and are written loose on purpose: each pins

    a figure or a named thing, never a phrasing.'
  groups:
  - any_of:
    - names the shared table churn_scores_weekly
    - refers to marts.churn_scores_weekly as the table all the jobs write
    - mentions the churn scores weekly table by name
  - any_of:
    - identifies the nightly dbt model as one of the writers
    - refers to models/customer/churn_scores_weekly.sql
    - mentions the nightly build / dbt model / manifest / 04:00 rebuild
    - mentions plat_dbt_analytics_daily
  - any_of:
    - identifies the Northwave backfill/replay job as a third writer
    - mentions cus_northwave_backfill or backfill.replay
    - refers to the replay out of the frozen Northwave copy
  - any_of:
    - states the dbt model's rule-based score runs on a 0-100 scale
    - says the model scores out of a hundred / on a 100-point scale
    - describes points out of one hundred
  - any_of:
    - states this job's weighted score runs on a 0-1 scale
    - says the score is between nought and one / zero and one
    - describes a fractional score bounded by one
  - any_of:
    - says this job is the only writer that publishes a CSV file
    - mentions churn.publish writing include/data/marts/churn_scores_<ds>.csv
    - identifies the published file as the source retention reads
  - any_of:
    - says recency could go negative / below zero
    - says the recency component had no lower bound
    - says recency fell out of range, subtracting its weight instead of adding
  - any_of:
    - identifies the failing component as recency
    - refers to days since the last order
    - refers to the gap from an account's last order to the week scored
  convicts:
  - claims the 0-100 and 0-1 scores coexisted in the same table at the same time, or in the
    same rows/columns
  - claims retention was reading the dbt model's 0-100 score
  - claims the fix is to rescale or multiply the job's score to 0-100, or to change the retention
    team's 70 threshold to match
  - claims only one job writes the table, or that there is no naming collision
  - claims the rebuild failure was caused by a schema mismatch, a duplicate key, a permissions
    error, or the delete-insert itself rather than an out-of-range recency value
  - claims the published CSV is written by the dbt model or by the Northwave backfill
