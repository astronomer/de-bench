# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The write-up. Patterns are matched case-insensitively under re.DOTALL and are

    written loose: each pins a name or a stated fact, never a phrasing.

    The diagnosis. Naming the parameter is not enough — a reply that says it was

    set has not said why nothing arrived. The negation is what separates reading

    the runtime from restating the file. Both readings of the mechanism pass:

    "the runtime drops the key" and "there is nothing configured to send it" end

    in the same place, which is that the alert does not exist.'
  groups:
  - any_of:
    - The answer names the email-related alerting settings (e.g. email / email_on_failure
      / email_on_retry) as what the DAG was relying on.
    - The answer refers to email notification parameters or an email alert path in the DAG's
      default_args.
  - any_of:
    - The answer states that these email parameters had no effect on this deployment — e.g.
      they were ignored, dropped, discarded, inert, silently unused, or never acted on.
    - The answer states that no email or notification was ever sent, that nothing was delivered,
      or that the alert never reached anyone.
    - The answer states there is no SMTP/mail path configured or supported in this runtime,
      so nothing could send the alert.
    - The answer explains that the runtime does not apply these keys (they are not operator
      parameters), so the requested alert does not exist.
  convicts:
  - The answer claims the email alert was delivered but went to the wrong or stale address,
    i.e. mail was actually sent.
  - The answer claims the fix is to correct the email addresses or SMTP configuration rather
    than to use the callback-based notification helper.
  - The answer only states that the email parameters were set/present in the DAG without saying
    why no alert arrived.
- seq: 1
  background: 'What was delivered. The house helper, on the failure callback, addressed to

    the rotation that owns the DAG.'
  groups:
  - any_of:
    - The answer specifies the on_failure_callback (failure callback) on the DAG.
    - The answer wires up a callback that fires when the DAG/task fails.
    - The answer references on_failure_callback as the delivery mechanism.
  - any_of:
    - The answer sends a notification/alert when the failure occurs.
    - The answer notifies the owning on-call rotation about the failure.
    - The answer describes notifying the team that owns the DAG.
  - any_of:
    - The answer names the internal house/platform helper used to send the notification.
    - The answer routes the notification through the platform's notification helper rather
      than a raw integration.
    - The answer identifies the platform-provided notifier as the delivery path.
  convicts:
  - The answer claims no failure notification was implemented or delivered.
  - The answer states the notification was sent to someone other than the on-call rotation
    that owns the DAG (e.g., a generic catch-all channel) as the intended recipient.
  - The answer uses a success callback or a retry callback instead of the failure callback.
- seq: 2
  background: 'The runbook, and what happens to it. The ticket names the runbook, so naming

    it back is free; the second pattern is the earned half. It asks the reply to

    resolve the conflict the way the house resolves it — CM-3, CM-4, the review

    date, or the statement that the runbook no longer describes the code — rather

    than by asserting the runbook is wrong because the fix was copied from a

    neighbouring file.'
  groups:
  - any_of:
    - names the runbook file alerting.md
    - refers to the alerting.md runbook by name
  - any_of:
    - resolves the runbook/code conflict via the house's change-management process (CM-3 or
      CM-4)
    - points to the runbook's review date (e.g. 2025-06-30) or the 180-day review interval
      as the reason it can't be trusted as-is
    - states the runbook is out of date / stale / outdated / superseded and no longer describes
      the code
    - notes the runbook predates the change (e.g. predates Airflow 2) or is advisory rather
      than canonical
  convicts:
  - claims the runbook is wrong because the fix was copied from a neighbouring file
  - justifies deviating from the runbook solely by pointing to what a neighbouring file does
