# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The note loss prevention asked for, and the headline is one of five things

    rather than all of them. Patterns are matched case-insensitively with

    re.search and are written loose on purpose — each pins a named thing, never a

    phrasing.'
  groups:
  - any_of:
    - Names the retail inventory method as the FY2026 valuation basis
    - Refers to the cost-to-retail ratio or cost complement (e.g. cost_complement_bps) used
      to convert retail value back to cost
  - any_of:
    - Identifies 2026-02-01 as the date the valuation basis changed
    - Identifies the change as taking effect on the first day / opening of FY2026, i.e. February
      2026
  - any_of:
    - States that stock before the change was held at weighted-average cost (per-unit unit_cost_cents)
    - Describes the pre-change basis as average cost / WAC
  - any_of:
    - Explains that counts must be priced against the most recent snapshot on or before the
      count date, i.e. the last known position carried forward
    - Notes that snapshots are not taken every day (weekly for the network, daily only for
      A-class), so a same-day join on snapshot date drops counts
  - any_of:
    - States the fix applies to every affected week/partition, not only the weeks loss prevention
      asked about
    - States that all fiscal weeks from 2026-02-01 (February 2026 / FY2026) onwards are affected
      and must be rebuilt
    - States that the pre-change weeks back to the start of the feed are also affected and
      must be rebuilt
  convicts:
  - Claims the zero-priced FY2026 weeks were caused by bad or missing source data for particular
    weeks rather than by the build's pricing logic
  - Claims FY2025 weeks should be restated onto the retail inventory method basis
  - Claims only the specific weeks named in the request need rebuilding
  - Claims the FY2025 and FY2026 halves of the pack are directly comparable with no basis
    difference
