# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: '1. The default. `mode` is "append" unless the call says otherwise, and the

    load has no key check and no dedup, so the same file twice is the rows twice.'
  groups:
  - any_of:
    - States that the loader's mode parameter is "append" when not specified, i.e. append
      is the default
    - Says the default value of mode is append, so a call that omits mode appends
    - Indicates that omitting mode results in an append load (append being the default), which
      has no key or dedup check, so re-reading a file duplicates rows
  convicts:
  - Claims mode defaults to "replace" (or anything other than append) when unspecified
  - Claims the loader deduplicates or checks keys on append, so loading the same file twice
    cannot duplicate rows
  - Claims an append load errors or is rejected when the same file is loaded a second time
- seq: 1
  background: '2. The quieter one, and the whole point of the ticket''s second sentence:

    `mode="replace"` with no `partition_col` is accepted, logged at INFO and

    loaded as an append. A reply that stops at the default has found half of it.'
  groups:
  - any_of:
    - The answer refers to `partition_col` (the partition column argument) somewhere in its
      discussion.
  - any_of:
    - The answer connects `mode="replace"` with a missing/absent `partition_col`, describing
      the case where replace mode is requested without specifying a partition column.
    - The answer states that `partition_col` is what `mode="replace"` requires, and notes
      the combination of replace mode plus no `partition_col` is accepted rather than rejected.
  - any_of:
    - The answer says that `mode="replace"` without `partition_col` is silently/quietly loaded,
      treated, written, or behaves as an append instead of a replace.
    - The answer says the code falls back to append (or appends anyway / appends instead)
      when replace is requested without a partition column, only logging at INFO.
    - The answer explicitly notes that the resulting load is not a replace at all despite
      the caller asking for replace.
  convicts:
  - The answer claims that `mode="replace"` without `partition_col` raises an error, is rejected,
    or fails validation.
  - The answer claims the replace-without-partition_col case is logged as a warning or error
    rather than at INFO level.
  - The answer claims that replace mode without a partition column correctly performs a full
    replace/overwrite of the table.
- seq: 2
  background: '3. The job. The carrier invoice intake is the feed the incident was about and

    the one the two arguments cannot save.'
  groups:
  - any_of:
    - The carrier invoice intake is the feed the incident concerned
    - The incident was about the carrier invoice intake feed
    - The carrier invoice intake feed is the one at issue in the incident
    - The two arguments cannot save the carrier invoice intake feed
    - The carrier invoice intake is the job/feed that the two arguments fail to rescue
  convicts:
  - Claims the incident involved a different feed or job than the carrier invoice intake
  - Claims the two arguments successfully save or justify keeping the carrier invoice intake
    feed
  - Fails to identify the carrier invoice intake as the feed in question
- seq: 3
  background: '4. Why it cannot be saved, with the figure that shows it. Each carrier''s

    `invoices.csv` is keyed by carrier rather than by date and carries every

    period still in retention — twenty invoices on twenty invoice dates — while a

    `replace` deletes ONE `partition_value`. So nineteen of the twenty come back

    on top of rows that are already there. The number has to sit against the

    thing it counts, not merely appear.'
  groups:
  - any_of:
    - the answer states that each carrier's invoices.csv contains about twenty invoices (or
      twenty invoice dates / periods / months), i.e. it attaches the figure 20 to the invoices,
      periods, or dates it counts
    - the answer says the file holds twenty periods' worth of invoice rows still within retention
    - the answer says nineteen of the twenty invoices (all but the one replaced partition)
      are re-loaded as duplicates, tying the number 20 to invoices/dates
  - any_of:
    - the answer says the invoices.csv file is keyed by carrier rather than by date (not dated
      / undated / no date partition)
    - the answer says the file contains every period (all periods, the whole file, every invoice
      date) still in retention, not just the one being replaced
    - the answer says the file spans many/twenty invoice dates, i.e. more than one date
    - the answer says a replace deletes only ONE partition_value while the file carries rows
      for many dates, so the rest land on top of existing rows
  convicts:
  - the answer claims the invoices.csv is partitioned or keyed by date (so a single replace
    would cleanly cover it)
  - the answer claims the replace is safe / idempotent / no duplicates result
  - the answer says the file contains only one invoice date or only the current period's invoices
  - the answer states a replace deletes all partitions or the whole table, so duplicates cannot
    occur
- seq: 4
  background: '5. The appends that are right to append. Two idioms, and the reply has to give

    the reason for at least one of them or it has not distinguished a safe append

    from an unsafe one: a stage the run empties before it fills, and a change-feed

    inbox whose merge keys on the id and keeps the newest row.'
  groups:
  - any_of:
    - The answer names the staging table (or staging load/stage) as one of the places where
      append is the right choice
    - The answer names the change-feed inbox (or inbox table) as one of the places where append
      is the right choice
  - any_of:
    - The answer explains that the staging table is emptied/reset/truncated/dropped/cleared
      before each load, so appending cannot accumulate duplicates
    - The answer explains that the inbox is merged downstream on the row id, keeping the newest/latest
      version, so duplicate appended rows are collapsed
    - The answer gives the reason that the merge keys on the id and keeps the newest row,
      making the append safe
  convicts:
  - The answer claims append is unsafe for the staging table or the change-feed inbox
  - The answer gives no reason for why either append is safe, merely listing them
  - The answer recommends a different write mode (e.g., overwrite, upsert, delete-then-insert)
    in place of append for the staging table or the inbox
