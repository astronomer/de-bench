# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The write-up. Patterns are matched case-insensitively and written loose: what

    each pins is a number, a name or a fact, never a phrasing. A table row satisfies

    them as readily as a sentence.

    The split, as two numbers. Nine stale and three real of the ticket''s twelve

    is the answer; either number alone is available by guessing and both

    together are not. Four also counts as the real half: a trial found

    `tie_carrier_invoice_to_packages` red as well (draft invoices in the

    invoiced sum — BRFR/PLPC/MWLG, FY2026-P05) and reported "9 stale, 4 real".

    The ticket names twelve, so it could not have named the thirteenth; a reply

    that found it has read the suite, not miscounted it, and the three named

    ties are graded by the checks below either way.'
  groups:
  - any_of:
    - Nine of the twelve failing ties are stale — they were superseded, re-derived, or replaced
      (memo-level fixtures), not real defects
    - 9 of the 12 failures are stale fixtures/expectations needing retirement or re-derivation
    - Nine stale (obsolete/superseded) checks are identified among the twelve
  - any_of:
    - Three of the twelve are real, genuine defects (true disagreements)
    - Four are real defects — counting tie_carrier_invoice_to_packages (draft invoices BRFR/PLPC/MWLG,
      FY2026-P05) as a thirteenth/additional genuine failure
    - The real-defect count is stated as three (or four) failing ties
  convicts:
  - States that all twelve failing ties are real defects
  - States that all twelve failures are stale with no real defects
  - Gives a stale count other than nine (e.g. eight or ten stale)
  - Gives a real-defect count other than three or four (e.g. two, five, or six real)
  - Claims the number of real defects is unknown or cannot be determined
- seq: 1
  background: 'The three real ones, named. The ticket asks for all twelve by test name, so
    a

    reply that reaches the right split has these three in it.'
  groups:
  - any_of:
    - names tie_channel_daily_store_pos as one of the real (genuine) failures
    - identifies tie_channel_daily_store_pos among the true/legitimate failing tests
    - lists tie_channel_daily_store_pos in the set of real failures
  - any_of:
    - names tie_settlement_processor_overlap as one of the real (genuine) failures
    - identifies tie_settlement_processor_overlap among the true/legitimate failing tests
    - lists tie_settlement_processor_overlap in the set of real failures
  - any_of:
    - names tie_gmv_settlement_reconstructs_order as one of the real (genuine) failures
    - identifies tie_gmv_settlement_reconstructs_order among the true/legitimate failing tests
    - lists tie_gmv_settlement_reconstructs_order in the set of real failures
  convicts:
  - classifies tie_channel_daily_store_pos as a false positive, flaky, or otherwise not a
    real failure
  - classifies tie_settlement_processor_overlap as a false positive, flaky, or otherwise not
    a real failure
  - classifies tie_gmv_settlement_reconstructs_order as a false positive, flaky, or otherwise
    not a real failure
  - omits any of the three real failures from the list of genuine failures
  - refuses to categorize the twelve tests by name
- seq: 2
  background: 'Which two sources disagree, for each of the three. Every fact here is in the

    tree and none of it is in the ticket: the till against the order book

    (models/commerce/agg_daily_store_sales.sql), the two processors by name

    (models/commerce/intermediate/int_payment_matched.sql), and the three

    settlement line types that should add back up to the marketplace order

    (models/commerce/intermediate/int_settlement_matched.sql). The take rate is

    what the GMV gap costs, and the tie''s own header says so.'
  groups:
  - any_of:
    - Names the till (point-of-sale / POS) system as one of the two disagreeing sources for
      the daily store sales model (agg_daily_store_sales.sql)
  - any_of:
    - Names Halcyon as one of the two payment processors that disagree in int_payment_matched.sql
  - any_of:
    - Names Meridian as the other payment processor that disagrees in int_payment_matched.sql
  - any_of:
    - Refers to the principal (or commission) settlement line type among the three lines that
      should sum back to the marketplace order in int_settlement_matched.sql
  - any_of:
    - Cites the take rate / settlement_weekly tie header as what the GMV gap costs
    - Cites SS-1 in contracts/settlement-summary.md stating payout = gmv − commission − fees
      (payout_cents)
    - Identifies contracts/settlement-summary.md (or SS-1) as the contract the settlement reconstruction tie traces to
    - Names marts.settlement_weekly or the published take rate as what the tie protects
    - States that the settlement lines failing to reconstruct the order affects the take rate or the GMV published to the consumer
  convicts:
  - States that these facts (till vs. order book, Halcyon/Meridian, settlement line types)
    come from the ticket rather than the repository/tree
  - Claims the take rate or cost of the GMV gap cannot be determined or is not documented
    anywhere
- seq: 3
  background: 'The memo, cited. QC-3 is the clause that makes an old test stale and the ticket

    says to retire against the memo, so a reply that retires nine tests without

    naming what it retired them against has not made the argument.'
  groups:
  - any_of:
    - cites the 2026-04 quality contract revision memo as the authority for retiring the tests
    - names QC-3 (the staleness clause) as the specific provision under which the old tests
      are retired
    - identifies the memo clause (QC-1/QC-2/QC-3) that each retirement is justified against
  convicts:
  - retires the nine tests without naming the memo or any QC clause as the authority for the
    retirement
  - justifies retirement solely on grounds other than the quality contract revision (e.g.
    flakiness, redundancy, age) with no reference to QC-3
  - cites a QC clause other than QC-3 as the staleness provision
  - claims the memo does not apply or that no clause governs the retirement
- seq: 4
  background: 'The two mart ties that are stale, and why — the part of the split the memo''s

    table does not hand over. Both sit at the mart layer, where QC-2''s rows do not

    reach, and both are stale under QC-1''s last sentence instead: a mart test not

    traceable to a contract clause. The fourth channel and the line-level

    promotions are the facts that say so, and they are in the tests'' own headers

    and in contracts/order_economics.yml.'
  groups:
  - any_of:
    - The answer names tie_channel_mix_daily_channel_coverage as one of the two stale mart
      ties.
    - It cites the mart test tie_channel_mix_daily_channel_coverage (channel coverage tie)
      as stale.
    - It identifies the channel-mix daily channel coverage tie by name as a stale mart-layer
      test.
  - any_of:
    - The answer names tie_order_economics_promo_allocation as the second stale mart tie.
    - It cites the mart test tie_order_economics_promo_allocation (promo allocation tie) as
      stale.
    - It identifies the order-economics promo allocation tie by name as a stale mart-layer
      test.
  - any_of:
    - The answer states a fourth channel (e.g., trade) now exists that the channel coverage
      tie's enumerated channels do not include, per the test's own header.
    - It explains the channel coverage tie is stale because channels expanded beyond the three
      it hardcodes to include a trade channel.
    - It points to the added trade/fourth channel as the fact that makes the channel coverage
      tie no longer traceable to a contract clause.
  - any_of:
    - The answer states promotions are now allocated at the line level (order_line_id / line_total_cents)
      per contracts/order_economics.yml, which the promo allocation tie does not reflect.
    - It explains the promo allocation tie is stale because promo allocation moved to line-level
      granularity in the order economics contract.
    - It cites line-level promotion allocation (line_total_cents / order_line_id) as the fact
      showing the promo allocation tie no longer matches the contract.
  convicts:
  - The answer claims these two ties are stale under QC-2 rather than QC-1's last sentence.
  - The answer says QC-2's rows reach the mart layer or cover these two ties.
  - The answer claims the memo's table already hands over these two mart ties.
  - The answer states both stale ties sit at the staging/source layer rather than the mart
    layer.
  - The answer claims the channel coverage tie is stale for a reason other than the added
    fourth (trade) channel, e.g. it says all channels are still covered.
  - The answer claims promotions are still allocated at the order level or that the promo
    allocation tie matches contracts/order_economics.yml.
  - The answer asserts these mart tests are traceable to a contract clause and therefore not
    stale.
- seq: 5
  background: 'Where the SKU relationship goes. QC-2 row 4 re-places a staging-to-dimension

    relationships test at int_, and the only model in the tree that crosses the two

    SKU spellings is models/supply/intermediate/int_sku_crosswalk.sql, whose header

    says the merchandising code and the catalog key match for about eight per cent

    of rows. An agent that deleted the two relationships tests without ever finding

    the crosswalk cannot say where they went.'
  groups:
  - any_of:
    - The answer names int_sku_crosswalk (models/supply/intermediate/int_sku_crosswalk.sql)
      as the model that reconciles the two SKU spellings / where the relationships test belongs.
  convicts:
  - The answer only deletes or drops the two relationships tests without identifying int_sku_crosswalk
    as where the SKU reconciliation happens.
  - The answer claims no model in the project bridges the two SKU spellings.
  - The answer relocates the relationships tests to a staging model or somewhere other than
    the int_sku_crosswalk intermediate model.
