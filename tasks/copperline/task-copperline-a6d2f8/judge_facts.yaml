# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: '1. The rule, settled from the estate''s own record. The ticket asks for both

    counts because one of them is the whole point: a rule with no exceptions in

    15,577 rows is a rule, and a header comment cut in December is not evidence.'
  groups:
  - any_of:
    - States that ops.load_control contains 15,577 rows (the full row count of the control
      table).
    - Cites 15,577 as the number of rows examined in the control table / the number of rows
      conforming to the 01:00-next-day start pattern.
  - any_of:
    - States that the number of rows violating the rule is zero — i.e. no row departs from
      the pattern, every one of the 15,577 rows conforms, the rule holds without exception
      both before and after the cutover.
    - Says the count of exceptions/counterexamples/breaks in ops.load_control is none / not
      one / 0.
  convicts:
  - Claims the header comment in copperline.jil (or any comment edited in December) is the
    evidence establishing what BUSDATE means, rather than the control-table data.
  - Claims some rows in ops.load_control break the next-day-01:00 pattern, or that the rule
    only holds after (or only before) the cutover.
  - Claims BUSDATE is the same calendar day the run fires rather than the day before it.
- seq: 1
  background: '2. How long it has been going on. 161 is the distinct business dates the

    control table holds from the cutover to its last row, and it is also the

    calendar days from 2026-01-05 to 2026-06-14 — the two routes agree, which is

    why the ticket says where to stop counting.'
  groups:
  - any_of:
    - The issue has persisted for 161 nightly runs
    - 161 distinct business dates are held in the control table from the cutover through its
      last row
    - It spans 161 calendar days from 2026-01-05 to 2026-06-14
    - The duration is 161 days
  convicts:
  - The issue has been going on for a number of days/runs other than 161 (e.g. 160 or 162)
  - Claims the two counting routes (business dates in the control table vs. calendar days
    from 2026-01-05 to 2026-06-14) disagree
  - States the end date for counting is something other than 2026-06-14
  - States the start/cutover date is something other than 2026-01-05
- seq: 2
  background: '3. How many of those nights reached finance. The tie-outs and the packs carry

    `run_calendar: retail_2026`, so they start on 112 of the 161. The bridge''s own

    calendar reader cannot produce this number — it answers no to every date —

    so the figure has to come from the export read properly or from

    `raw.market_calendar`.'
  groups:
  - any_of:
    - 'States that 112 of the 161 nights are trading/calendar nights under run_calendar: retail_2026
      (i.e., 112 nights are in scope for the tie-outs and packs)'
    - Says 112 nights (of the 161) started, ran, or reached the recon/tie-out/pack/distribution
      stage
    - Gives 112 as the count of run_calendar retail_2026 dates/days for the tie-outs and packs
  convicts:
  - Claims the bridge's own calendar reader can produce the 112 figure, or that its is_trading_day/date
    answers are usable
  - States the calendar reader returns yes for some dates rather than answering no to every
    date
  - Uses 161 (or any number other than 112) as the count of nights that reached finance/started
    under retail_2026
- seq: 3
  background: '4. The nights that went missing. Sunday is the bulk of it and the three

    Mondays are the half that needs the calendar rather than a weekday rule: a

    Monday the calendar leaves out used to be carried by the Tuesday after it.'
  groups:
  - any_of:
    - The answer states that 23 nights ended up with no coverage, tying that number to the
      Sundays (or to the Mondays) — e.g. "23 uncovered nights" next to "Sundays", or a line
      reading just "**23**" followed on a later line by the Sunday/Monday itemization.
    - The answer pairs the count 23 (or "twenty-three") with words like missing, never, lost,
      gap, or uncovered within the same line.
    - The answer writes the number 23 and, within roughly 60 characters after it (possibly
      crossing a line break, but with no intervening mention of Friday), names Sunday or Monday
      as the days involved.
  - any_of:
    - The answer names Sunday as one of the uncovered nights.
  - any_of:
    - The answer names Monday as one of the uncovered nights.
  - any_of:
    - The answer explains that the three uncovered Mondays are holidays that the calendar
      omits.
    - The answer cites the specific dates 2026-01-19, 2026-02-16, or 2026-05-25 as the Mondays
      left out.
    - The answer says the calendar leaves those Mondays out / that they are not calendar days
      / are off the calendar (rather than being excluded by a weekday rule).
  convicts:
  - The answer attributes the 23 uncovered nights to Fridays, e.g. "23 Fridays" — Fridays
    belong to a different check and must not be what the 23 is tied to here.
- seq: 4
  background: '5. The nights that appeared. This is the half finance recognised and it is

    the one that overturns the wave 2 note: a Friday tie-out never existed under

    the old profile, and there has been one every week since January. A reply

    that repeats the note — "Fridays are the gap" — fails here.'
  groups:
  - any_of:
    - States that there are 23 Friday nights (or 23 Friday tie-outs/stays) in the data
    - Links the number 23 to Fridays — e.g., 'Friday appears 23 times', 'twenty-three Friday
      nights'
    - Notes that Fridays account for 23 of the nights recognised by finance
  convicts:
  - Merely restates the wave 2 note that 'Fridays are the gap' without quantifying the Friday
    nights
  - Claims Fridays existed under the old profile / that Friday tie-outs are not new
  - Gives a Friday count other than 23 (e.g., 22, 24, 'about 20')
  - Attributes the 23 nights to a day other than Friday
- seq: 5
  background: '6. Why it survived six months. The ticket asks for the step by name: the

    trigger and the control-table read have been out by the same day, so the

    morning log has always agreed with itself.'
  groups:
  - any_of:
    - Names the check_jobs_wrote step (the trigger/control-table read) as the place the bug
      hides
    - Refers to check_jobs_wrote explicitly when explaining why the issue went unnoticed
  - any_of:
    - Says the trigger and the control-table read are off by the same day, so the two sides
      agree
    - Explains that both reads are shifted identically, so the errors cancel out
    - States the morning log looks self-consistent because both values use the same (wrong)
      date/ds
    - Notes the check compares the wrong day against the wrong day, so it always matches
  convicts:
  - Claims the six-month survival was due to the check comparing different days or mismatched
    dates
  - Claims the discrepancy was visible in the morning log but ignored
  - Attributes the long survival solely to missing alerting or nobody reading the logs, with
    no mention of the two reads being shifted alike
