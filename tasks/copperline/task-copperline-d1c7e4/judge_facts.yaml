# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The note the buyers asked for. Four things in five patterns, and each pattern

    pins a named thing rather than a phrasing; matched case-insensitively with

    re.search.'
  groups:
  - any_of:
    - 'The note names the new source column as the feed spells it: order_discount_cents.'
    - It refers to order_discount_cents, the discount column the page never had before.
  - any_of:
    - 'It says where the rule lives: the int_order_lines_discounted model.'
    - It gives the model's name or its path, int_order_lines_discounted.
  - any_of:
    - 'It describes the allocation as pro-rata: each line gets a share of the order''s discount
      in proportion to its own amount.'
    - It says the discount is split proportionally across lines, i.e. each line's share of
      the order total.
  - any_of:
    - It says whole cents are assigned by the largest-remainder method rather than rounding
      each line independently.
    - It explains that leftover cents go to the lines with the biggest fractional remainders.
  - any_of:
    - 'It states the invariant: for every order, the line-level shares sum back exactly to
      that order''s own order_discount_cents.'
    - It says the per-line discounts add up to the order-level discount exactly, to the cent,
      for each order — no cents lost or invented.
  convicts:
  - The note says per-line discounts are rounded independently, so the totals may drift from
    the order-level figure.
  - The note says small rounding differences between the sum of line discounts and the order
    discount are acceptable or expected.
  - The note claims the discount column already existed on the page or in the prior model.
  - The note says the allocation splits the discount evenly across lines regardless of line
    amount.
