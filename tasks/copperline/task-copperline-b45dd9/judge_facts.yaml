# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'THE CADENCE, AND THE ARITHMETIC UNDER IT. 50 days, out of 10,000,000

    references the seven-digit format can hold against the 200,000 order keys the

    OMS issues in a day. The ticket asks for both numbers and not only the

    cadence, because the cadence alone can be copied out of a docstring:

    `int_orders_enriched` and `stg_payments__payment_intents` both say "about

    every fifty days" in their headers. The second pattern is what shows the

    reply worked it out or measured it.


    Wrong answers this convicts:

    24 hours    docs/billing-integration.md §B-6, which says the reference is

    "recycled across retry attempts inside a 24-hour window". That

    recycle is real and it is a different one — it repeats a

    reference inside one payment, not across two orders — and it is

    the reading the whole ticket exists to correct.

    7 digits    the format''s width offered as the cadence, with no volume in it.


    The second pattern takes either side of the division, and takes "10 million"

    and "ten million" as well as the digits: which of the two numbers a reply

    leads with is a matter of taste, and the words are not the decision.'
  groups:
  - any_of:
    - States the reference space cycles/repeats roughly every 50 days
    - Says the seven-digit reference pool wraps about every fifty days
    - Gives the recycling cadence as ~50 days (e.g. 'about every 50 days')
  - any_of:
    - Cites the 10,000,000 (10 million / ten million) distinct references the seven-digit
      format can represent
    - Cites the 200,000 order keys the OMS issues per day
    - Shows the arithmetic 10,000,000 / 200,000 = 50 days, giving either side of the division
  convicts:
  - Claims the recycling window is 24 hours (the docs/billing-integration.md §B-6 retry-attempt
    recycle)
  - Offers '7 digits' (the format width) as the cadence, with no volume figure
  - Describes the reuse as repeating a reference within a single payment's retry attempts
    rather than across two distinct orders
- seq: 1
  background: 'THE COLLISION POPULATION IN THE ORDER BOOK. 3,107,760 of the 3,436,578 orders

    carry a reference at least one other order also carries, spread over 570,523

    distinct references. Both figures are required: the count of orders alone

    does not show the reply counted references at all, and 570,523 alone does not

    say how much of the book is exposed.


    Wrong answers this convicts:

    3,436,578   the whole book offered as the colliding population, which is

    the answer a reply gets by never subtracting the 328,818

    orders that do hold a reference of their own.

    241,705   the references that name more than one order, offered as the

    orders. It is a true number of a different thing and it is off

    by more than a factor of twelve.

    328,818   the complement — the orders that are safe — offered as the ones

    that are not.


    The most orders on one reference is 18 and the ticket asks for it, but a bare

    "18" in a page of prose matches too much to be worth pinning, so it is not

    graded here.'
  groups:
  - any_of:
    - States that 3,107,760 orders carry a reference that at least one other order also carries
    - Gives 3,107,760 as the number of orders in the collision population
    - Reports 3107760 colliding orders
  - any_of:
    - States that these colliding orders are spread over 570,523 distinct references
    - Gives 570,523 as the number of distinct references the order book carries
    - Reports 570523 distinct references
  convicts:
  - Gives 3,436,578 (the whole order book) as the colliding population, without subtracting
    the 328,818 orders holding a unique reference
  - Gives 241,705 (references naming more than one order) as the count of colliding orders
  - Gives 328,818 (the orders that are safe / uniquely referenced) as the colliding or exposed
    orders
- seq: 2
  background: 'WHAT THE JOIN DOES TO THE FEED. 2,058,581 rows in, 29,968,433 out. The ticket

    names the population in as many words — every row, every type, every state —

    so the filters below are not defensible readings, they are the ticket

    ignored.


    Wrong answers this convicts:

    1,018,051 in / 14,823,258 out   `event_type = ''captured''` only. The

    commonest instinct on this feed, and §B-1 does support dropping

    authorizations from a MONEY figure — but this is a count of what

    a join returns, and the ticket says every row.

    2,052,548 in / 29,881,096 out   the soft-deleted rows dropped.

    2,040,968 in / 29,712,502 out   the restatements dropped.

    1,194,355 in / 17,405,341 out   `raw.payment_intents` audited instead of

    the settlement feed. The attempt log is the right table for the

    honest pairing and the wrong one for this question: audit asked

    about the events the recovery list is built from.'
  groups:
  - any_of:
    - States the input row count as 2,058,581 (all rows of the settlement feed, no filters
      applied)
    - Reports 2058581 (or 2,058,581 / 2 058 581) as the number of rows going into the join
  - any_of:
    - States the output row count as 29,968,433 rows returned by the join
    - Reports 29968433 (or 29,968,433 / 29 968 433) as the number of rows the join produces
  convicts:
  - Reports 1,018,051 in / 14,823,258 out, i.e. filtering to event_type = 'captured' only
  - Reports 1,018,051 as the input row count
  - Reports 14,823,258 as the output row count
  - Reports 2,052,548 in / 29,881,096 out, i.e. dropping the soft-deleted rows
  - Reports 2,052,548 as the input row count
  - Reports 29,881,096 as the output row count
  - Reports 2,040,968 in / 29,712,502 out, i.e. dropping the restatements
  - Reports 2,040,968 as the input row count
  - Reports 29,712,502 as the output row count
  - Reports 1,194,355 in / 17,405,341 out, i.e. auditing raw.payment_intents instead of the
    settlement feed
  - Reports 1,194,355 as the input row count
  - Reports 17,405,341 as the output row count
  - Applies any filter (event_type, soft-delete, restatement) to the population instead of
    counting every row, every type, every state
  - Audits raw.payment_intents / the attempt log rather than the settlement feed the recovery
    list is built from
- seq: 3
  background: 'HOW THE FEED SPLITS. 227,041 events reach exactly one order on the reference

    alone and 1,831,540 reach more than one. This is the pair that settles §B-6:

    11.0% of the feed resolves, not 96%, and read the other way round — events

    that match anything at all — it is 100%, because no event reaches none. There

    is no reading of this data that produces 96, and a reply that lands these two

    figures has shown that whether or not it says so in words. The verdict is not

    graded separately for that reason.


    Wrong answers this convicts:

    130,839 / 1,063,516   the same split taken at attempt grain over

    `raw.payment_intents`. Same story, wrong population.

    112,089 / 905,962     captures only.

    about 4% / 96%        §B-6 restated instead of measured.


    A reply that reports the third figure as 0 and stops there has answered a

    question nobody asked; the zero is worth stating and is not the decision.'
  groups:
  - any_of:
    - States that 227,041 events match exactly one order on the reference alone (the ~11.0%
      of the feed that resolves uniquely).
  - any_of:
    - States that 1,831,540 events match more than one order on the reference alone.
  convicts:
  - Reports the split as 130,839 uniquely matched and 1,063,516 multi-matched (attempt grain
    over raw.payment_intents — wrong population).
  - Reports the split as 112,089 uniquely matched and 905,962 multi-matched (captures only
    — wrong population).
  - Restates §B-6's roughly 4% / 96% figures instead of measuring the actual split.
  - Claims about 96% of the feed resolves to a single order.
  - Reports only that zero events match no order and stops there, without giving the one-match
    and multi-match counts.
- seq: 4
  background: 'WHAT IT MISATTRIBUTES, IN ORDERS. A reference-alone join hangs a Meridian

    event on 3,096,290 distinct orders — 90.1% of the whole book — and 918,830

    orders actually took one. The gap, 2,177,460 orders, is the size of the risk

    in the only unit audit will care about. Both sides are required: the damage

    figure means nothing without the honest figure beside it.


    The honest figure is over-determined, which is what makes it fair to grade.

    The reference-and-date pairing gives 918,830 at any window from 2 days to 45,

    and `raw.payment_intents.order_id` — which cannot be joined to anything —

    carries exactly 918,830 distinct values behind the same events. A reply that

    reached it either way lands the same number.


    Wrong answers this convicts:

    920,929     distinct `raw.payment_intents.order_id` over the WHOLE attempt

    log rather than over the attempts the feed names. A near miss

    by 2,099, and the reason the ticket scopes the honest side to

    the feed.

    1,130,242   the reference-and-date pairing at a 49-day window, where the

    recycle reaches the neighbouring order.

    3,096,290   offered on its own, with no honest count to hold it against —

    a number with no risk in it.

    1,000,895 / 1,194,355   attempts counted as orders.'
  groups:
  - any_of:
    - States that a reference-only join attaches a Meridian event to 3,096,290 distinct orders
      (90.1% of the order book) — the over-attribution/damage figure.
    - Reports 3,096,290 as the count of orders touched by the reference-alone join.
  - any_of:
    - States that 918,830 distinct orders actually had a Meridian payment attempt — the honest
      figure, obtained via reference-and-date pairing (stable for windows from 2 to 45 days)
      or via distinct raw.payment_intents.order_id scoped to the feed-named attempts.
    - Reports 918,830 as the true number of orders with a Meridian event.
  convicts:
  - Gives 920,929 as the honest count (distinct raw.payment_intents.order_id over the whole
    attempt log rather than scoped to the feed-named attempts).
  - Gives 1,130,242 as the honest count (reference-and-date pairing at a 49-day window, which
    reaches the neighbouring recycled order).
  - Presents 3,096,290 alone as the answer without any honest counterpart count to compare
    it against.
  - Gives 1,000,895 as the answer (attempts counted as orders).
  - Gives 1,194,355 as the answer (attempts counted as orders).
- seq: 5
  background: 'WHAT IT MISATTRIBUTES, IN MONEY. 1,530,264,361,359 cents on the join against

    the 105,596,982,367 the feed carries — 14.49 times over. The ticket defines

    money for this page in one sentence: `amount_cents` added as it stands, signs

    and all, over the rows under discussion. It says so precisely because the

    honest reading of this feed for a REVENUE figure is a different one, and this

    page is not a revenue figure.


    Wrong answers this convicts:

    787,065,598,192 / 54,326,273,383   captures only, which is the right rule

    for the close and the wrong one for this page.

    1,525,736,540,536 / 105,284,723,767   deleted rows dropped, against §R-6.

    1,516,794,239,483 / 104,665,038,070   restatements dropped.


    A reply that also prices the two sides in dollars, or that quotes the 14.49

    multiple, still matches — the cents are what is pinned.'
  groups:
  - any_of:
    - States the join-side total as 1,530,264,361,359 cents (may also be expressed in dollars,
      e.g. $15,302,643,613.59, alongside the cents figure)
  - any_of:
    - States the feed-side total as 105,596,982,367 cents (may also be expressed in dollars,
      e.g. $1,055,969,823.67, alongside the cents figure)
  convicts:
  - Gives the totals as 787,065,598,192 and 54,326,273,383 cents (captures only — the right
    rule for the close, wrong for this page)
  - Gives the totals as 1,525,736,540,536 and 105,284,723,767 cents (deleted rows dropped,
    contrary to §R-6)
  - Gives the totals as 1,516,794,239,483 and 104,665,038,070 cents (restatements dropped)
  - Sums only captured amounts rather than all amount_cents as they stand, signs included
  - Excludes deleted rows from the sum
  - Excludes restatement rows from the sum
- seq: 6
  background: 'THE PERIOD COLUMN, AND THE DAY UNDER IT. Every unambiguous event in the feed

    falls in three consecutive periods — FY2025 P10 (198,260), P11 (27,554) and

    P12 (1,227) — and every other period holds none at all. The reason is one

    trading day, 2025-11-28: the OMS uses a few thousand of its 200,000 daily

    keys on an ordinary day, so every reference it issues is issued again 50 days

    later, but on that day it placed 146,721 orders and ran past the offsets any

    other day in the book has ever reached. 141,941 of that day''s orders carry a

    reference no other order carries, and the settlements on them are the whole

    of the 227,041.


    The two period figures and the date are graded. P12''s 1,227 is not: it is the

    tail of the same population and pinning it grades persistence rather than a

    decision.


    Wrong answers this convicts:

    2024-11-29   the previous year''s equivalent day. It is the second largest

    in the book (134,646 orders, 129,471 of them unique) and it

    sits before the Meridian feed opens, so it explains none of

    the table. A reply naming both days passes; a reply naming

    only this one has not read the column it was asked about.

    a period the reply picks because it is the largest   FY2025 P10 is also the

    busiest period in the feed, at 345,273 events, so a reply can

    land on it for the wrong reason — which is why the date is

    required beside the two counts.

    "the peak season"   the shape blamed on November trading in general. It is

    one day: the day either side of it resolves nothing.'
  groups:
  - any_of:
    - States that FY2025 P10 accounts for 198,260 of the unambiguously-matched settlement
      events.
  - any_of:
    - States that FY2025 P11 accounts for 27,554 of the unambiguously-matched settlement events.
  - any_of:
    - Identifies 2025-11-28 as the single trading day whose 146,721 orders ran past the usual
      reference-offset range, making 141,941 of its orders' references unique and producing
      essentially all 227,041 unambiguous settlements.
    - Names the date 2025-11-28 as the driver of the concentration in periods P10-P12.
  convicts:
  - Names 2024-11-29 as the day responsible for the concentration without also naming 2025-11-28.
  - Attributes the concentration to FY2025 P10 merely being the largest/busiest period in
    the feed, rather than to a specific trading day.
  - Explains the concentration as a general 'peak season' or November trading effect rather
    than a single day.
- seq: 7
  background: 'THE KEY THE DOCUMENTS SEND US TO. `raw.payment_intents.order_id` runs

    8,840,127 to 181,202,656 and the digits of `raw.orders.order_id` run 1 to

    3,436,578. The ranges do not touch, so nothing pairs up on any cast: the

    prefix strip is zero rows, the pad into `ORD-########` is zero rows, and

    `order_id <= 3436578` is zero rows. §B-6 calls it the durable key and

    `stg_payments__payment_intents` casts it into a column called

    `processor_order_key`, and it is the processor''s own counter.


    This is the find. Both documents send a reader here, and the reader who

    follows them writes a join that returns nothing and has no reason to suspect

    the column rather than their own SQL.


    The third pattern wants the reply to say the pairing is empty rather than

    merely awkward. A reply that says the column "is not reliable" or "should be

    used with care" has not measured it.


    Wrong answers this convicts:

    "use payment_intents.order_id"   the documents believed. It is the

    recommendation §B-6 makes and the one that cannot be carried

    out.

    a non-zero pair count            arrived at by joining `intent_id` (which

    does work) and reporting that as the order key working.'
  groups:
  - any_of:
    - states that raw.payment_intents.order_id values begin at 8,840,127 (the minimum of the
      processor's own counter)
    - cites 8840127 as the low end of the payment_intents.order_id range
  - any_of:
    - states that raw.payment_intents.order_id values run up to 181,202,656 (the maximum of
      the processor's own counter)
    - cites 181202656 as the high end of the payment_intents.order_id range
  - any_of:
    - states that joining payment_intents.order_id to orders.order_id matches zero rows /
      returns no records under any cast (prefix strip, ORD-######## pad, or order_id <= 3436578)
    - states that the two order_id ranges are disjoint and share no values, so the pairing
      is empty
    - quantifies the join result as 0 rows / no matches rather than merely calling the column
      unreliable
  convicts:
  - recommends using payment_intents.order_id as the join key to orders, as §B-6 advises
  - reports a non-zero pair count for the order key, e.g. by joining on intent_id and presenting
    that as the order_id join working
  - characterizes payment_intents.order_id only as 'not reliable' or 'use with care' without
    establishing that the pairing yields zero rows
  - merely echoes the prompt's phrasing that the pairing 'gives one order per event and leaves
    none' without measuring the empty join
