# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: '1. The two counts. Eighteen is the closure and eight is the grep, and the

    ticket asks for both on purpose: an agent that only ever saw the eight cannot

    write the first figure, and one that reports eighteen without the eight has

    not shown the plan why the two disagree. `\beight\b` is bounded so that

    "eighteen" cannot answer for it.'
  groups:
  - any_of:
    - States that 18 (eighteen) jobs are governed by / covered by the retail_2026 calendar
      in the JIL file
    - Says the gate must cover eighteen jobs total, counting the ones inside boxes
    - Gives 18 as the true number of jobs on the retail_2026 calendar
  - any_of:
    - 'States that only 8 (eight) jobs carry/declare run_calendar: retail_2026 explicitly
      on their own line'
    - 'Says a grep for run_calendar: finds only eight of the jobs'
    - Says eight jobs name/spell the calendar directly, the rest inherit it from their enclosing
      box
  convicts:
  - Claims all jobs on the retail_2026 calendar declare run_calendar explicitly, i.e. that
    the grep count is the whole story
  - Claims the eight explicitly-tagged jobs are the only jobs the calendar governs
  - Claims cpl.util.archive.logs is on the retail_2026 calendar (it names retail_2025)
- seq: 1
  background: '2. The days the tie-outs have never covered, and the arithmetic behind them.

    The first pattern wants both days together, which is what rules out the reply

    every reading of the calendar alone produces: Saturday and Sunday. The second

    wants the offset that makes it so — the box starts the morning after the

    business date it carries. The third wants the claim stated rather than the

    days merely mentioned.'
  groups:
  - any_of:
    - The uncovered business dates are Friday and Saturday — both must be named together
    - The tie-out gap spans Friday and Saturday business dates
    - Friday's and Saturday's activity is what never gets reconciled
  - any_of:
    - The job's window is keyed to the prior business date (busdate = DS - 1); the box starts
      the morning after the business date it carries
    - The batch runs the day after the business date it owns, i.e. it reconciles yesterday's
      activity
    - Each run covers the previous day's trading, so the calendar date lags the business date
      by one day
  - any_of:
    - The Friday and Saturday business dates have never been tied out — the run never happened
      for them
    - There is no tie-out at all for Friday or Saturday; those days were left out from the
      start
    - No reconciliation has ever run against the Friday/Saturday business dates
  convicts:
  - Claims only Saturday (or only Sunday) is uncovered, naming a single day
  - Says the gap is Saturday and Sunday, reading the calendar dates rather than the business
    dates
  - Says the tie-out ran but failed or was skipped occasionally, rather than never having
    run for those days
  - Says the job covers the same calendar day it runs on, with no one-day offset
- seq: 2
  background: '3. The control-table column. `history_complete` is `NOT failed` on every row,

    so it is `load_status` under a second name; the reply has to put the two

    columns against each other rather than repeat what the staging model claims

    about backfills. Naming only one of the two columns is not an answer, which

    is why both are pinned.'
  groups:
  - any_of:
    - The answer names the `history_complete` column from the control table.
    - The answer refers to `history_complete` as the column being examined.
  - any_of:
    - The answer names the `load_status` column.
    - The answer refers to `load_status` as the column that `history_complete` is derived
      from or compared against.
  - any_of:
    - The answer states that `history_complete` is the same as / identical to / a copy of
      `load_status`, just under a different name.
    - The answer states that `history_complete` merely restates or repeats `load_status` (e.g.
      it is `load_status != 'failed'` spelled twice) and is therefore redundant.
    - The answer states that `history_complete` tells us nothing new / adds no extra information
      beyond `load_status`.
    - The answer states that `history_complete` is derived from `load_status` and so cannot
      independently confirm anything.
    - The answer states that `history_complete` says nothing about whether a backfill actually
      happened / never reflects backfill completeness.
  convicts:
  - The answer treats `history_complete` as independent evidence that the backfill completed,
    rather than a restatement of `load_status`.
  - The answer names only one of `history_complete` or `load_status` and never puts the two
    columns against each other.
  - The answer simply repeats the staging model's claim that backfills are complete without
    questioning the control-table column.
