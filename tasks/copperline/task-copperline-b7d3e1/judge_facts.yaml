# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The note. Three separate decisions, one check each, so getting one right by

    luck passes one. Patterns are matched case-insensitively with re.search and

    are written loose on purpose: each pins a date or a named thing, never a

    phrasing.

    What is gone. The six days of files with no archive copy, named, and called

    what they are. A note that lists a range without either end is not naming

    them for legal.'
  groups:
  - any_of:
    - The answer names 2026-02-09 (9 February 2026) as one of the days whose Meridian landing
      files are unavailable. A range whose endpoint is this date (e.g. '2026-02-09 through
      2026-02-14') states it.
    - The answer explicitly lists February 9, 2026 among the enumerated missing days (e.g.
      writing out 2026-02-09, 2026-02-10, ... individually).
  - any_of:
    - The answer names 2026-02-14 (14 February 2026) as one of the days whose Meridian landing
      files are unavailable. A range whose endpoint is this date (e.g. '2026-02-09 through
      2026-02-14') states it.
    - The answer explicitly lists February 14, 2026 among the enumerated missing days (e.g.
      writing out ... 2026-02-13, 2026-02-14 individually).
  - any_of:
    - The answer states that those six days of Meridian landing files have no archive copy
      — no second copy was ever written, so they exist nowhere.
    - The answer states that the six days' data is permanently gone / unrecoverable / lost
      for good, and that no restore (ours or Meridian's) can bring it back.
    - The answer states the files were deleted with no archive copy, so nothing can be restored
      for those dates.
  convicts:
  - The answer claims the six missing days can be recovered by restoring from the archive,
    or that an archive restore covers 2026-02-09 to 2026-02-14.
  - The answer claims Meridian can re-send the missing six days of events.
  - The answer proposes backfilling the gap from raw.pay_meridian_settlements, a mart, or
    any other internal derived table as an acceptable fix for the legal record.
  - The answer claims the full 2026-02-01 to 2026-03-31 settlement range can be served completely.
  - The answer claims all settlements with settlement dates 2026-02-09 through 2026-02-14
    are missing, rather than the events Meridian delivered (arrival dates) on those days.
- seq: 1
  background: 'What is merely slow. The rest of the range left the live tree under RET-1 and

    is in the archive, which is a restore job with a price, not a loss. This is

    the check that convicts the over-refusal — the reply that reads the directory

    listing, sees nothing before 17 March and writes February off.'
  groups:
  - any_of:
    - States that the portion of the requested range no longer in the live landing tree has
      been archived rather than lost, and can be brought back by an archive restore.
    - Says the archived copy is the only remaining source for the older dates and must be
      restored/retrieved to serve them.
    - Directs the reader to request/run an archive restore of the older Meridian landing files
      so the missing part of the range can be recovered.
  - any_of:
    - Characterizes the archive as having no query path / no index, so reading it is a restore
      job rather than a query.
    - Gives a time cost for the restore — e.g. hours per month of files, roughly a working
      day, or overnight — describing it as slow rather than impossible.
    - Frames the archived data as merely slow/expensive to obtain (a restore job with a cost),
      not as unavailable.
  - any_of:
    - Explains that the live landing tree only goes back about 90 days (starting mid-March
      2026, e.g. dt=2026-03-17), which is why earlier dates are absent from the directory
      listing.
    - Cites the 90-day retention window (RET-1) as the reason February and early March are
      missing from the live tree.
    - Notes the 90-day limit in the context of Meridian's own retention meaning the six deleted
      days cannot be re-sent.
  convicts:
  - Concludes that February (or the pre-17-March part of the range) cannot be delivered at
    all because the landing directory listing starts at 2026-03-17.
  - Treats the entire pre-17-March portion of the range as permanently lost or deleted, without
    distinguishing the archived data from the six-day archive gap.
  - Refuses the request outright or says no data exists for the requested period.
  - Claims the archive is unreadable, unavailable, or offers no way to recover the older landing
    files.
  - Fills the irrecoverable six-day gap from raw.pay_meridian_settlements or a downstream
    mart and presents it as a valid record.
- seq: 2
  background: 'Why the tree reaches February at all. The finding the whole ticket turns on:

    the files are dated by delivery and the request is in settlement dates, so

    what is in the tree for a date has nothing to do with whether a directory of

    that name exists. A reply that never says this cannot have arrived at the

    right rows on purpose.'
  groups:
  - any_of:
    - The answer refers to the files/directories being dated or named by arrival or delivery
      time (e.g. 'delivery date', 'loaded_at', 'load date', 'when we received/got the data').
    - The answer mentions that the data arrived or was delivered on a date different from
      the settlement date it describes.
  - any_of:
    - The answer notes that some deliveries arrive late — in a tail, days or weeks after the
      settlement date they cover.
    - The answer explains that records for a settlement date can show up in directories after
      that date.
  - any_of:
    - The answer states the tree is dated/partitioned/keyed/indexed/organised by arrival or
      delivery rather than by settlement date.
    - The answer states that the presence of a directory named for a date says nothing about
      whether settlement data for that date exists, because the naming is by arrival not settlement.
    - The answer explains the request is expressed in settlement dates while the tree is laid
      out by delivery dates, so the two do not line up.
  convicts:
  - The answer claims the directory names are settlement dates, so a date's data lives only
    in the directory of the same name.
  - The answer asserts that if no directory exists for a given date, no data for that settlement
    date exists.
  - The answer says the February directories are irrelevant or should be excluded because
    the request only covers earlier settlement dates.
