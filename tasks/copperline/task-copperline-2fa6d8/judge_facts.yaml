# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The four lines for the DQ-77 thread. Patterns are matched case-insensitively

    with re.search and are written loose on purpose: each pins a fact or a name,

    never a phrasing, and a table row satisfies them as readily as a sentence.

    Line one and line two, which are one finding: the tie added the take to the

    order instead of taking it off, so what it has been reporting as a variance is

    Copperline''s own revenue. The first pattern wants the take named as the two

    things it is made of or by its own name; the second wants the direction, which

    is the whole of the answer. A reply that says "the numbers do not add up" and

    stops has not made the argument.'
  groups:
  - any_of:
    - Names the take as commission plus fulfilment (the two components it is made of), e.g.
      'commission and fulfilment fees'
    - 'Refers to it by its own name: ''take rate'', ''the take'', or ''our take'''
  - any_of:
    - States the take was double-counted / counted twice / added twice over in the total
    - Says the reported figure overstates the true amount
    - Says the computed side overshot the seller's order / GMV by the take
    - Says the total came out too high (too much / too big / too large)
    - Says the take was added to the order instead of (rather than) being subtracted from
      it
    - Says the take should have been subtracted / deducted / netted off / withheld from the
      order rather than added
  convicts:
  - Merely says the numbers do not add up or that there is a variance, without identifying
    the direction or the double-counting
  - Says the fees overshoot what the settlement lines carry (reverse direction reading)
  - Claims the take was correctly subtracted / deducted and the reconciliation is right
- seq: 1
  background: 'That it is every settled order and not a tail. The ticket says so, so a reply

    that reaches the cause has this; what it convicts is a reply that reports a

    subset and calls the rest fine.'
  groups:
  - any_of:
    - States that every settled order is affected
    - States that all settled orders are impacted, not just some
    - Says each settled order exhibits the issue
  convicts:
  - Claims only a subset of settled orders are affected
  - Says the issue is limited to a tail or small fraction of orders
  - Asserts the remaining settled orders are fine or unaffected
  - Characterizes the problem as an edge case affecting few orders
- seq: 2
  background: 'Line three: what the principal line is. This is the sentence the whole ticket

    turns on and it is in no document — it is read off the feed. The two patterns

    want the column named and the reading stated: the gross order value, not the

    seller''s net.'
  groups:
  - any_of:
    - names the principal column (the 'principal' field) as the line the ticket turns on
    - identifies 'principal' as the principal line / column read off the feed
    - refers to the principal amount field in the feed
  - any_of:
    - states principal is the gross order value
    - states principal is the full/whole/entire order value
    - states principal equals GMV
    - states principal is measured before the marketplace's take/commission/fees are deducted
    - states principal is not the seller's net proceeds
  convicts:
  - says principal is the seller's net amount (net of commission/fees)
  - says principal is the payout to the seller after the platform's take rate
  - claims the principal definition comes from a document/contract/spec rather than being
    read off the feed
  - says the gross order value is not the principal / that principal excludes marketplace
    fees charged to the buyer's order total
- seq: 3
  background: 'Line four: how far the same reading reaches. `seller_net_cents` is summed into

    `marts.gmv_daily` and into `marts.settlement_weekly.payout_cents`, and neither

    is named in the ticket. An agent that fixed the model without ever asking who

    reads it cannot answer this.'
  groups:
  - any_of:
    - The answer names settlement_weekly (with or without a marts. prefix) as touched/downstream.
    - The answer names gmv_daily (with or without a marts. prefix) as touched/downstream.
  - any_of:
    - The answer names the payout_cents column.
    - The answer names the seller_net_cents column.
  convicts:
  - Claims the change is contained to the model named in the ticket with no downstream impact
  - States that no other models or marts consume seller_net_cents
  - Claims downstream consumers were not investigated or cannot be determined
  - Asserts that only the tables named in the ticket are affected
