- seq: 4
  background: 'THE FILING DATES, AND THAT THERE IS NOTHING TO FILE. Dormancy runs from the

    issue date — the ticket says so, so this is the contract and not a reading.

    The oldest card in either tier was sold on 2024-02-04, which puts the first

    36-month balance at 2027-02-04 and the first 60-month one at 2029-02-04. The

    whole card book is younger than 36 months, so no part of the 106,935,742 is

    reportable as at 2026-06-15. That conclusion is the one treasury acts on and

    a reply that prices the exposure without dating it has not answered.


    Wrong answers this convicts:

    2029-02-04 / 2031-02-04  dormancy counted from the age-out date rather than

    from issue, so each tier lands 24 months late. The

    ticket names the anchor.

    2026-02-04               the age-out date offered as the due date, which is

    REV-12''s revenue date and not a filing date.'
  groups:
  - any_of:
    - The first 36-month dormancy date is 2027-02-04 (oldest card issued 2024-02-04 plus 36
      months).
  - any_of:
    - The first 60-month dormancy date is 2029-02-04 (oldest card issued 2024-02-04 plus 60
      months).
  - any_of:
    - Nothing is reportable/due as at 2026-06-15 — no part of the 106,935,742 must be filed
      or remitted.
    - Zero/none of the balance is reportable or due for filing at the 2026-06-15 assessment
      date.
    - 'There is nothing to file: no amount is due or reportable because the whole card book
      is younger than 36 months.'
  convicts:
  - Says the first dormancy/filing date is 2029-02-04 for the 36-month tier and 2031-02-04
    for the 60-month tier (counting dormancy from the age-out date instead of the issue date).
  - Says 2026-02-04 is the due/filing date (that is REV-12's revenue recognition date, not
    a filing date).
  - Counts dormancy from the age-out date rather than the issue date.
  - States that some portion of the 106,935,742 is reportable or due as at 2026-06-15.
  - Prices the exposure without giving any filing dates.
- seq: 5
  background: 'THE JURISDICTION CARRYING THE MOST. Tennessee, US-17, 6,444,641 cents on 545

    cards. Ranking by cards instead of by money names Pennsylvania, which holds

    565 cards and 5,770,619 cents — ninth of the 20 by money. The ticket asks for

    the one carrying the most "by name and by figure", so the name alone does not

    settle it and neither does an unattached number.'
  groups:
  - any_of:
    - The jurisdiction carrying the most is Tennessee.
    - The jurisdiction carrying the most is identified as US-17 (Tennessee).
  - any_of:
    - Tennessee's total is 6,444,641 cents.
    - The figure carried is 6444641 cents.
    - The answer states the amount as 6 444 641 cents.
  convicts:
  - Names Pennsylvania as the jurisdiction carrying the most.
  - States the top total is 5,770,619 cents.
  - Ranks by card count (565 cards) instead of by money to pick the winner.
  - Gives Tennessee's card count (545) as the answer figure instead of the money amount.
  - Gives a name without the accompanying figure, or a figure without the accompanying name.
- seq: 6
  background: 'THE STATUS COLUMN. `raw.gift_cards.status` calls 11,770 cards `expired` and

    not one card in the book has passed its own `expires_at`: every card expires

    60 months after issue, so the earliest expiry anywhere is 2029-02-04. 1,007

    of those cards escheat and have aged out, carrying 11,637,500 cents — about a

    ninth of the exposure, and what a reply that trusts the OMS word throws away.


    The check wants the count, the amount, and the year that shows the claim is

    false. A reply that says "some cards are marked expired" without pricing it

    has noticed the column and not audited it.


    20,137,500 is the same cards'' share of ALL breakage, escheating or not. The

    ticket asks how much of the exposure sits on them, so the exposure figure is

    the one required; a reply may print both and still passes.'
  groups:
  - any_of:
    - 11,770 gift cards carry status = 'expired' in raw.gift_cards
    - the OMS status column marks 11770 cards as expired
    - 11 770 cards are labelled expired by the source system
  - any_of:
    - those expired-flagged cards that escheat and have aged out carry 11,637,500 cents of
      exposure
    - 11637500 cents of escheatment exposure sits on the 1,007 status-expired cards
    - 11,637,500 cents — about a ninth of the total exposure — rides on cards the OMS calls
      expired
  - any_of:
    - 'no card has passed its expires_at: every card expires 60 months after issue, so the
      earliest expiry anywhere is in 2029 (2029-02-04)'
    - the status is provably false because the earliest expires_at in the book is 2029-02-04
    - not one card expires before 2029, so 'expired' cannot be true today
    - every card's expires_at is still in the future — the cards status calls expired included —
      so the label cannot be describing a card that has actually expired
    - expires_at is issue + 60 months on every row and no card in the book has reached it, so the
      expired status is not derived from the card's own expiry date
  convicts:
  - claims the expired status is accurate and those cards are genuinely past their expiry
    date
  - excludes the status-expired cards from the exposure because the OMS calls them expired
  - merely notes that some cards are marked expired without quantifying the count or the amount
  - reports only 20,137,500 as the exposure figure and omits the 11,637,500 escheatment exposure
- seq: 7
  background: 'THE VERDICT ON THE OPEN ITEM, which is what the ticket says the controller
    is

    buying the quarter with. `escheat_applies` decides whether a balance is

    revenue or a state''s; `dormancy_months` decides only the date it becomes

    reportable, and in this book it cannot even change the amount — no card is

    redeemed after its 24-month age-out, so the balance at 36 and at 60 months is

    the balance the ledger already wrote at 24.


    The pattern pins the two column names with the verdict beside each, which is

    the one sentence the reply exists to produce. A reply that blames

    `dormancy_months` for the money, or that never names either column, fails.

    The first pattern accepts any of the plain ways to say "decides the money";

    the second any of the ways to say "decides only when".'
  groups:
  - any_of:
    - States that escheat_applies is the column that determines the money — whether a card
      balance goes to the state or is recognized as breakage revenue
    - Says escheat_applies decides which side a balance falls on (state vs. revenue), i.e.
      it is the column that moves the dollars/cents
    - Identifies escheat_applies as the field whose value changes the recognized amount /
      the exposure figure, e.g. an error on one jurisdiction row shifts that jurisdiction's
      whole balance between escheat and revenue
  - any_of:
    - States that dormancy_months only affects timing — the date a balance becomes reportable/filable
      — and not the amount
    - Says dormancy_months (36 vs 60 months) changes only the filing calendar and moves no
      money, since the balance at 36 and 60 months equals the balance already written at the
      24-month breakage
    - Explains that because no card is redeemed after its 24-month age-out, the dormancy tier
      cannot change any balance and controls only when reporting is due
  convicts:
  - Claims dormancy_months is the column that determines the amount of money, revenue, or
    exposure
  - Claims a longer or shorter dormancy period would change the escheat balance or the amount
    recognized as revenue
  - Fails to name either escheat_applies or dormancy_months when giving the verdict on the
    open item
  - Claims escheat_applies only affects timing or the filing date rather than the amount
