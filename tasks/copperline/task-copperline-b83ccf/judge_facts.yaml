# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'THE EXPOSURE. 106,935,742 cents: the breakage entries the ledger has already

    written whose card sits in a jurisdiction where `escheat_applies`. The figure

    has to sit against the claim it answers rather than merely appear in the

    file, so a reply that lands elsewhere and mentions it in passing fails.


    Wrong answers this convicts:

    197,720,074  every breakage entry, the escheat column never read. The

    jurisdiction table is decoration to this reply.

    90,784,332  the other side taken for the exposure — what recognizes as

    revenue rather than what goes to a state.

    118,242,500  `raw.gift_cards.initial_cents` for the aged-out cards, so a

    card spent down to a stub is escheated for its face value.

    1,122 of the 9,949 were partly spent and the gap is

    11,306,758 cents of money already redeemed. REV-12 says

    breakage is the value left on the card.

    95,298,242  the cards `raw.gift_cards.status` calls expired dropped as

    dead. See the status check below.

    9,949      the cards counted instead of the money, which is what the

    workbook the ticket is replacing does.


    Not convicted, and honest either way: testing escheat with

    `dormancy_months IS NOT NULL` or with `breakage_allowed = false`. Both agree

    with `escheat_applies` on all 66 rows and give 106,935,742 too. REV-12 says

    the column is the test; the data does not punish a reader who used a

    neighbour.


    The ledger''s signs are the liability''s, so a reply that leaves the figures

    negative writes -106,935,742 and still matches. The ticket asks for positive

    figures; the regex cannot tell, and a minus sign is not the decision this

    check grades.'
  groups:
  - any_of:
    - The answer gives the escheat exposure as 106,935,742 cents — the breakage already written
      to the ledger for cards in jurisdictions where escheat_applies — and states it as the
      answer to the escheat-exposure claim rather than mentioning it incidentally elsewhere.
    - The answer gives the escheat exposure as -106,935,742 cents (the ledger's liability
      sign convention), presented as the answer to the escheat-exposure claim.
  convicts:
  - The answer reports the escheat exposure as 197,720,074 cents (all breakage entries, ignoring
    the escheat_applies jurisdiction column).
  - The answer reports the escheat exposure as 90,784,332 cents (the revenue-recognition side
    rather than the amount owed to a state).
  - The answer reports the escheat exposure as 118,242,500 cents (raw.gift_cards.initial_cents
    face value for aged-out cards rather than remaining value).
  - The answer reports the escheat exposure as 95,298,242 cents (dropping cards whose raw.gift_cards.status
    says expired).
  - The answer reports the escheat exposure as 9,949 (a count of cards instead of the money
    amount).
- seq: 1
