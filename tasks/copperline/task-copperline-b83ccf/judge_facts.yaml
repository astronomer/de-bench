    whole breakage, 197,720,074. The ticket asks for both halves and the whole

    because the exposure alone cannot be checked by anyone: the two figures are

    what show the reply read the jurisdiction column rather than guessed which

    side was which. An agent who never joined the jurisdiction table has one of

    these two and not the other.'
  groups:
  - any_of:
    - The recognizing half (jurisdiction-recognized amount) is 90,784,332
    - 90784332 is the recognizing half figure from the split
  - any_of:
    - The ledger's whole breakage total is 197,720,074
    - 197720074 is the whole breakage figure from the ledger
  convicts:
  - Only the exposure figure is given without both the recognizing half and the whole breakage
    figure
  - The answer provides just one of the two numbers (90,784,332 or 197,720,074) without the
    other
  - The answer guesses which side is which without referencing the jurisdiction table/column
- seq: 2
  background: 'THE TWO DORMANCY TIERS. 71,125,259 over the 13 jurisdictions on 36 months,

    35,810,483 over the 7 on 60. They add to the exposure, which is the

    arithmetic the headline hides, and they are the split the whole open item is

    about — you cannot say what `dormancy_months` is worth without pricing each

    value of it.


    The jurisdiction counts, 13 and 7, are not pinned: a bare "13" in a page of

    prose matches too much to mean anything. The two cent figures are the

    decision.'
  groups:
  - any_of:
    - States the 36-month dormancy tier exposure as $71,125,259
    - Gives 71,125,259 (or 71125259 / $71.125.259 style separators) as the amount attributable
      to the 13 jurisdictions with a 36-month dormancy period
    - Includes 71,125,259 as a line item summing into the total exposure
  - any_of:
    - States the 60-month dormancy tier exposure as $35,810,483
    - Gives 35,810,483 (or 35810483) as the amount attributable to the 7 jurisdictions with
      a 60-month dormancy period
    - Includes 35,810,483 as a line item summing into the total exposure
  convicts:
  - Reports only a single aggregate exposure figure without breaking it into the 36-month
    and 60-month dormancy tiers
  - Claims the dormancy_months open item cannot be quantified or priced from the available
    data
  - States that the 36-month and 60-month amounts are alternatives such that only one applies,
    rather than components that add to the total exposure
  - Gives a tier amount that contradicts 71,125,259 or 35,810,483 (e.g., a different dollar
    figure for the 36-month or 60-month jurisdictions)
- seq: 3
  background: 'WHAT IS STILL COMING. 644,089,266 cents on 88,105 escheating cards that have

    not yet reached 24 months. This is the find in the ticket. The ledger has

    written breakage for four months of issue cohorts and the book is 28 months

    long, so a reply that sums breakage entries and stops has priced a seventh of

    the exposure and called it the answer. The figure is what each card was sold

    for less what the ledger has taken off it.


    Wrong answers this convicts:

    919,035,000  `initial_cents` with no redemptions subtracted.

    751,025,008  the whole escheating book, aged out and not, offered as the

    figure the ticket asked for on its own line. It is a true

    number and the solution prints it too, but it is not this one.

    0  breakage entries counted for cards that have none — which is

    what happens to a reply that only ever looks at the ledger.'
  groups:
  - any_of:
    - States the not-yet-aged-out escheating exposure as 644,089,266 cents
    - Gives 644,089,266 (cents) as the amount still coming on the 88,105 escheating cards
      that have not yet reached 24 months
  convicts:
