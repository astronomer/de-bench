# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: '1. The loud one, and the first thing that happens. The analytics project

    declares the core versions it will run under and 1.10 is outside the range,

    so dbt refuses the project before it compiles a model. It is one line, it is

    the cheapest finding in the tree, and the pre-flight cannot see it because it

    reads dags/ and not dbt/.'
  groups:
  - any_of:
    - The dbt project's require-dbt-version setting is what blocks the run
    - dbt_project.yml declares require-dbt-version, and dbt refuses to start when the installed
      core version falls outside it
    - The require-dbt-version constraint in the dbt project excludes 1.10
  - any_of:
    - The declared upper bound is < 1.7, so dbt 1.10 is outside the allowed range
    - The version range is pinned below 1.7.0 (e.g. >=1.5.0,<1.7.0)
    - require-dbt-version caps dbt core at 1.7, i.e. <1.7
  convicts:
  - Claims dbt 1.10 satisfies the require-dbt-version range
  - Says the failure happens during model compilation or execution rather than before the
    project loads
  - Claims the pre-flight check under dags/ would have caught the require-dbt-version mismatch
  - Identifies the version pin as being in a file other than the dbt project config (e.g.
    requirements.txt or a DAG file) as the blocking cause
- seq: 1
  background: '2. The silent one that reaches furthest. `dbt_utils.surrogate_key` is gone
    at

    1.x; the rename is `generate_surrogate_key` and it hashes NULL differently,

    so a mechanical rename changes every key value in the shared layer. The var

    that holds the old hashing is already set in dbt_project.yml, which is why

    naming it is the difference between a fix and a restatement. The count is

    what separates a reader from a guesser: fifteen call sites, one per file,

    across six of the seven model directories.'
  groups:
  - any_of:
    - Names `generate_surrogate_key` as the 1.x replacement for the removed `dbt_utils.surrogate_key`.
    - Mentions that the rename target is `dbt_utils.generate_surrogate_key`.
  - any_of:
    - Names the var `surrogate_key_treat_nulls_as_empty_strings` (already set in dbt_project.yml)
      as what preserves the old NULL hashing behavior.
    - Identifies `surrogate_key_treat_nulls_as_empty_strings` as the flag that must be set/kept
      true to avoid changing key values.
  - any_of:
    - States there are 15 (fifteen) call sites/models/files affected.
    - Says fifteen models — one call site per file — must be updated.
  convicts:
  - Claims `dbt_utils.surrogate_key` still exists or is merely deprecated in dbt_utils 1.x
    rather than removed.
  - Asserts the rename is purely mechanical and safe with no change to key values, ignoring
    the NULL hashing difference.
  - Gives a call-site count other than 15 (e.g., 12, 14, 16, 'a handful', 'dozens').
  - Says the var must be newly added to dbt_project.yml, contradicting that it is already
    set.
  - Recommends accepting the changed surrogate keys / restating the shared layer instead of
    preserving the old hashing.
- seq: 2
  background: '3. The one the ticket points at and the pre-flight structurally cannot reach:

    at 1.10 `dbt source freshness` runs the project''s on-run-start and on-run-end

    hooks. Those hooks are this project''s run audit, so the hourly freshness job

    starts writing an open and a close row per invocation into

    ops_run.dbt_run_events, and ops_audit_log — an incremental model that must

    not be full-refreshed — inherits 24 rows a day that are not builds. All three

    patterns are needed together: naming the job proves the trace, naming the

    hook or the table proves it went the whole way, and the cadence proves it

    read the schedule rather than assumed one.'
  groups:
  - any_of:
    - The answer names the source freshness job (e.g. plat_dbt_source_freshness) or refers
      to `dbt source freshness` runs as the affected job.
    - The answer identifies the hourly `dbt source freshness` invocation as the trigger for
      the regression.
  - any_of:
    - The answer names the on-run-start and/or on-run-end hooks as the mechanism now firing
      during freshness runs.
    - The answer names the ops_run.dbt_run_events table (or dbt_run_events) receiving the
      spurious open/close rows.
    - The answer names the ops_audit_log incremental model (or copperline_audit) as inheriting
      rows that are not builds.
  - any_of:
    - The answer states the freshness job runs hourly (or every hour).
    - The answer quantifies the impact as 24 extra rows/invocations per day (or 48 rows given
      open plus close).
  convicts:
  - The answer claims dbt source freshness does not run on-run-start/on-run-end hooks in 1.10,
    or that the hooks are unaffected.
  - The answer says ops_audit_log can simply be full-refreshed to clean up the extra rows.
  - The answer states the pre-flight check would have caught this issue.
- seq: 3
  background: '4. The second project. It is 41 models against a different profile and a

    different file, and its packages.yml still asks dbt Hub for

    `fishtown-analytics/dbt_utils` at 0.6.4 — a namespace and a version from

    before the rename. Both facts need the project opened; neither is in

    dbt/README.md, which only says the project exists and that most of it does

    not run.'
  groups:
  - any_of:
    - The answer names the second dbt project, northwave_reporting.
    - It identifies the second project by name (northwave_reporting), the one using a different
      profile and project file.
  - any_of:
    - The answer states the second project contains 41 models.
    - It gives the model count of the second project as 41 (e.g. '41 models').
  - any_of:
    - The answer notes packages.yml still requests the pre-rename dbt Hub package fishtown-analytics/dbt_utils.
    - It cites the outdated dbt_utils pin at version 0.6.4.
    - It mentions the stale fishtown-analytics namespace and/or the 0.6.4 version in the second
      project's packages.yml.
  convicts:
  - The answer claims there is only one dbt project in the repository.
  - The answer states the second project's dbt_utils dependency uses the current dbt-labs
    namespace or an up-to-date version.
  - The answer gives a model count for the second project other than 41.
- seq: 4
  background: '5. The nightly build does not run dbt to work out its graph — cosmos renders

    it from a manifest committed in the repo, and that file is stamped with the

    version that wrote it. Until it is rebuilt under the new core, the DAG that

    builds every mart in the company is rendering from a 1.6 artifact. The

    version has to sit against the manifest on the same line, because the pin

    table in dbt/README.md gives 1.6.14 away for free and the stamp inside the

    file does not.'
  groups:
  - any_of:
    - States that the committed dbt manifest artifact is stamped/written by dbt 1.6.14 (manifest
      schema v10), i.e., ties the version to the manifest on the same line
    - Says the manifest file in the repo carries the v10 / 1.6.14 stamp and is stale until
      regenerated under the new core
  - any_of:
    - Identifies the nightly DAG that renders from the manifest via cosmos (e.g., plat_dbt_analytics_daily)
      as the affected build
    - Mentions cosmos rendering the DAG from the committed manifest rather than invoking dbt
      to parse the project
  convicts:
  - Claims the nightly build invokes dbt at parse/render time to compute its graph instead
    of reading the committed manifest
  - Derives the 1.6.14 version only from the pin table in dbt/README.md without connecting
    it to the manifest artifact
  - Asserts the manifest is regenerated automatically at DAG runtime, so no rebuild under
    the new core is needed
  - States the manifest itself records no version stamp
- seq: 5
  background: '6. The green is worthless and the reply has to say why in terms of scope, not

    tone. The pre-flight reads imports under dags/ and compares them against a

    hardcoded symbol list; every finding above lives in dbt/, in a macro, in a

    package pin or in a default that changed. A stated negation is the only thing

    that separates "I read what it checks" from "I distrust it in general".'
  groups:
  - any_of:
    - The reply names the pre-flight check by name, e.g. 'check_upgrade', 'plat_upgrade_check',
      or refers to it as the 'pre-flight' / 'preflight' check.
  - any_of:
    - The reply refers to 'import' or 'imports' as the thing the pre-flight check scans (whole
      word, not a substring of another word like 'important').
  - any_of:
    - The reply makes an explicit negative statement about the check's scope — e.g. that it
      'does not read', 'doesn't see', 'never checks', 'cannot cover', or 'does not touch'
      the dbt project, config, macros, package pins, or changed behaviour/behavior defaults.
  convicts:
  - The reply dismisses the green pre-flight result on tone, confidence, or general untrustworthiness
    grounds (e.g. 'don't trust automated checks', 'it's just a heuristic') without stating
    the specific scope limitation.
  - The reply treats the green pre-flight result as meaningful evidence that the upgrade is
    safe.
  - The reply claims the pre-flight check does scan dbt/, macros, package pins, or changed
    defaults.
