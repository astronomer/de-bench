# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The working paper''s claims. Patterns are matched case-insensitively with

    re.search and are written loose on purpose: each pins a mechanism, a column

    name or a direction, never a phrasing, and a table row satisfies them as

    readily as a sentence.

    Where the two books meet. The link is the `order_id` on the invoice, and the

    finding is that the tax on the two sides is one charge rather than two. A

    reply that says the mart "looks high" has not said why.'
  groups:
  - any_of:
    - Identifies that the goods invoices carry an order_id linking each invoice to exactly
      one order in raw.orders (e.g. mentions order_id, the invoice naming/resolving to the
      order it bills, or a one-invoice-to-one-order correspondence).
    - States that the invoice book and the order book are joined through the order identifier
      on the invoice, so the two feeds describe the same orders.
    - Notes that every goods invoice names the order it bills, with no orphan invoices or
      orders on either side.
  - any_of:
    - States that the same tax is counted on both sides of the mart's addition, i.e. the order-side
      tax and the invoice-side tax are the same charge counted a second time (duplication
      / double counting / both sides / twice / already included).
    - Explains that summing the invoice book onto the order book adds tax that is already
      present, so the mart overlaps the two books rather than adding new money.
    - Says the invoice line tax equals the trade order tax to the cent, meaning the mart re-adds
      money it has already counted.
  convicts:
  - Claims the mart figure is merely 'high' or 'looks wrong' without identifying the order_id link or the duplicated tax.
  - Attributes the entire overstatement solely to a rounding, currency-conversion or unit error rather than double counting of the same tax.
  - Concludes the mart's tax_daily figure is correct or that no correction is needed.
  - Claims the order side of the mart is the erroneous side, or that the order tax is inflated/fanned out, rather than the invoice side.
  - States that the invoices bill no orders at all, or that the invoice book and order book cover disjoint sets of transactions.
- seq: 1
  background: 'The fan-out, and the column that causes it. The channel is in the order

    rollup''s grouping and not in the join, and that is the whole mechanism. The

    reply this is aimed at is the one that finds the double count, calls the mart

    twice the honest figure and stops; it cannot name the channel or the

    multiplication, because it never looked at the grouping.'
  groups:
  - any_of:
    - The answer names the channel column (channel) as the culprit — the field that appears
      in the rollup's GROUP BY but is absent from the join key.
    - It identifies 'channel' explicitly as the grouping column that is not part of the join
      condition.
    - It points to the channel dimension in the rollup's grouping as the source of the discrepancy.
  - any_of:
    - 'It explains the fan-out: joining on a key that ignores channel matches each order row
      against every channel row, so the join multiplies rows.'
    - It states there is one row per channel in the rollup, so each order is counted once
      for each channel (e.g. four times if there are four channels).
    - It describes the join as effectively many-to-many / a partial cross join that duplicates
      rows, multiplying the totals by the number of channels.
    - It says the figure is inflated by a factor equal to the channel count (4x / four times
      / counted four times), not merely 'doubled'.
  convicts:
  - The answer only observes that the mart figure is roughly twice (or some multiple of) the
    honest number and stops there, never identifying which column causes the duplication.
  - It attributes the inflation to a vague 'double count' or 'duplicate rows' without examining
    the rollup's GROUP BY.
  - It blames an unrelated cause (e.g. duplicate source records, late-arriving data, a bad
    filter, or a date-range mismatch) instead of the channel grouping.
  - It claims the join key is correct and the two numbers should reconcile as-is.
- seq: 2
  background: 'The blank currency, and why it never joins. This is the direction that makes

    the invoice side smaller, and it is the half a paper that only found the

    double count cannot produce. Naming the currency column is not enough: the

    reply has to say that the join does not match a NULL to a NULL.'
  groups:
  - any_of:
    - identifies the currency column as the culprit
    - names the currency field as the join key at fault
    - points to currency (e.g., currency_code / ccy) as the column involved
  - any_of:
    - states that the currency value is NULL
    - says the currency is blank / missing / empty for those rows
    - describes the currency column as containing nulls
  - any_of:
    - explains that NULL = NULL does not evaluate true, so the join fails
    - says two NULLs never match / cannot be equal in a join
    - states that a NULL currency matches no row of the mart / joins no row
    - says the invoice rows with NULL currency are dropped entirely by the join
    - states the join never matches, so those invoice rows go nowhere at all
  convicts:
  - claims the currency column simply needs to be added to the join or SELECT list, without
    noting the NULL-to-NULL mismatch
  - asserts that NULL currency values would match other NULL currency values in the join
  - attributes the discrepancy solely to a double count / fan-out on the invoice side
  - says the join direction makes the invoice side larger rather than smaller
  - blames a different column (e.g., date, entity, account) instead of currency
- seq: 3
  background: 'The plan invoices. They are the only invoice tax that is genuinely additive,

    and the reason is that they bill no order. A reply that adds the invoice book

    to the order book has not made the distinction; a reply that subtracts the

    whole invoice book has thrown these away.'
  groups:
  - any_of:
    - Identifies the plan invoices (invoices whose lines are of the plan kind) as a distinct
      category of invoice
    - Refers to plan-only invoices / plan lines / the line_kind = 'plan' distinction as marking
      the invoice tax that is genuinely additive
    - Identifies the invoices that carry no order at all (order_id IS NULL, "nobody's order",
      billed with no order behind them) as the distinct category whose tax is genuinely additive
      — the same 24,080 invoices the plan wording names
  - any_of:
    - States that these plan invoices carry no order reference (order_id is NULL / they bill
      no order / they do not correspond to any order)
    - Says the additive invoice tax comes from invoices with no matching order in the order
      book
  convicts:
  - Says the correct group total is the order book tax plus the entire invoice book tax (adding
    the whole invoice book to the order book)
  - Says the whole invoice book should be dropped/subtracted, leaving only order tax, with
    no allowance for the plan-invoice tax that has no order behind it
- seq: 4
  background: 'The direction, market by market. Every market is overstated here — unlike

    TAX-241''s flat rate, nothing cancels — and the ticket asks for the table and

    for the worst market by name. A reply that gives one group figure fails here.'
  groups:
  - any_of:
    - States the tax figures are overstated (too high / inflated / over-reported / above what
      was actually charged) in every market, not offsetting
    - Says the reported amounts overcount or overstate the charged tax
    - Notes the numbers come in higher than what we actually charged customers
  - any_of:
    - Identifies the US market by name in the per-market breakdown
    - Refers to the United States row explicitly
  - any_of:
    - Names other affected markets such as GB/Britain, DE/Germany, IE/Ireland, CA/Canada,
      BR/Brazil, ID/Indonesia, PL/Poland, or MX/Mexico
    - Gives a market-by-market table listing the non-US countries
    - Calls out the worst market by its country name (e.g., Brazil, Indonesia, Poland, Mexico)
  convicts:
  - Reports only a single aggregate/group-level figure without breaking it out by market
  - Claims the discrepancies cancel out or net to zero across markets, as in TAX-241's flat
    rate
  - Says the tax amounts are understated or below what was charged
  - Fails to name the worst-affected market
