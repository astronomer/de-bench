# The whole ticket is one column name and one return value, and the work is
# finding out why a step that runs every night has never changed a row.
#
# WHAT THE WORLD SHIPS. `projects/growth/lib/sessions.py`, `stitch_orders`,
# updates `marts.fct_web_sessions.customer_ref` from `raw.orders.customer_ref`.
# `raw.orders.customer_ref` is the TRADE account and is null everywhere else:
# measured on the shipped warehouse, `select channel, count(customer_ref) from
# raw.orders group by 1` gives 187,731 on `trade` and 0 on `web`, `store` and
# `marketplace`. Every order a web session names is a web order, so the UPDATE's
# last predicate — `o.customer_ref IS NOT NULL` — is false on every candidate
# row and the statement has changed nothing since it was written. The module's
# own docstring says the order "carries both"; the id a consumer order carries
# is `loyalty_id`.
#
# WHY NOBODY SAW IT. The step does not return the rows it changed, whatever its
# docstring says. It returns the day's converting sessions that carry ANY
# customer, which is dominated by the sessions that arrived signed in. Measured
# on 2025-12-11: the step reports 44, the sessions it changed are 0, and the
# guest sessions the order book can actually resolve are 52. So the number moves
# with volume, has never been zero, and says nothing about the stitch. The fix
# is two things, and the second is the reason the first went unnoticed.
#
# THE HONEST STITCH. A session keeps the customer its own events carried —
# `max(customer_ref)`, which is what the build publishes. A session that carried
# none and converted takes `loyalty_id` off the order it names. An order that
# carries neither id is a guest checkout and its session stays null. The estate
# already reads consumer identity this way: `projects/commerce/sql/
# enrich_customer.sql` takes `coalesce(m.customer_id, b.loyalty_id)` and
# `int_customer_lifecycle` keys a consumer on `loyalty_id`.
#
# Nothing here holds an authored value. The verifier computes every expected id
# from `raw.web_events` and `raw.orders` in the same session; the figures in
# this comment are derivations, quoted so a reviewer can rerun them, and no
# check compares against any of them.
#
# WHY NOTHING RUNS THE DAG. `gro_sessionize_daily` is asset-scheduled and picks
# its own days out of the feed, so `airflow dags test <dag_id> <ds>` cannot
# point it at a chosen day, which is all the run stage can do. The subject is
# one library call and the verifier makes it directly, which grades the same
# code in about a minute. `marts.fct_web_sessions` is derived and the shipped
# warehouse carries neither it nor the schema that holds it (`AGENTS.md`, "The
# warehouse"), so the verifier makes both once before anything runs; that is
# scenery, and a fix that creates them as well finds them there already. It also
# removes the shortcut — a `customer_ref` typed into the mart by hand is a value
# the next build replaces before anything reads it, and a trial's patch carries
# nothing under `include/data` in the first place.
#
# WHY NO `unchanged` CHECK. There is nothing for one to watch. The only relation
# this step writes is the one the verifier grades directly, and it moves on
# every graded day by design. What must not move is graded inside the day
# instead: the sessions that arrived signed in, the sessions that never
# converted, and the sessions whose order names nobody are all compared row for
# row on all three days.
#
# THE WRONG ANSWERS, and what convicts each. Each was built and run against this
# verifier; the test named is the one that failed.
#
#   nothing delivered, or a note and no code change
#       the three graded days come out with every guest session still null.
#       test_a_guest_session_comes_out_naming_the_customer_its_order_names
#
#   the cast or the format "repaired" — the trade id looked up through
#   `raw.customer_id_map`, `C-######` matched against the session's own ref,
#   `coalesce(o.customer_ref, ...)` left aimed at the same column
#       still zero rows changed. `customer_ref` is null on the row, not
#       misspelled on it. Same test.
#
#   every guest session on the day stitched to whatever the day sold — the
#   `o.order_id = s.order_id` predicate dropped, or the join moved to the order
#   date, to `market_code`, or to the session's `anonymous_id` against an order
#       the day's ~1,800 sessions that never reached a checkout are resolved
#       against orders they did not place, and the guest sessions get somebody
#       else's id. test_a_session_that_did_not_convert_does_not_move and
#       test_a_guest_session_comes_out_naming_the_customer_its_order_names
#
#   the order's id written over every converting session — `s.customer_ref IS
#   NULL` dropped, so a session that arrived signed in is relabelled with the
#   order's loyalty id
#       test_a_session_that_arrived_signed_in_keeps_the_customer_it_arrived_with
#
#   a label invented for the sale that named nobody — `'GUEST-' ||
#   market_code`, the order id, the anonymous id
#       the ticket says the row stays unresolved, and the invitation is real:
#       `int_customer_lifecycle` does exactly this for its own lifecycle
#       buckets. It is the wrong answer here because the next reader counts a
#       `GUEST-` row as a customer.
#       test_a_checkout_that_named_nobody_leaves_the_session_unresolved
#
#   the join fixed and the reported number left as it was
#       test_the_step_reports_the_rows_it_changed, and
#       test_running_the_day_twice_changes_nothing_and_says_so
#
#   the resolve moved into `build_sessions` and the stitch left dead
#       `gro_event_replay_repair`, `gro_funnel_daily` and `gro_attribution_daily`
#       build through the same library and none of them runs the stitch, so this
#       gives three DAGs a different session table. The ticket states the split.
#       test_the_day_is_built_from_the_event_stream_alone
#
#   `raw.orders` rewritten so the shipped join resolves
#       the scored container lays `raw.*` again from the image, so the rewrite
#       is not there. test_the_feed_and_the_order_book_keep_every_row catches a
#       fix that writes to landing source at run time.
#
#   the stitch step deleted from the DAG to stop it reporting a false number
#       dag_structure names the seven steps.
#
#   the module or the DAG broken
#       dag_parses.
#
# WHAT IS NOT CONVICTED, on purpose:
#
#   * Which population the fix reads the order book over. An agent who also
#     drops the test and soft-deleted orders resolves the same sessions on all
#     three graded days, and the verifier's first test proves that rather than
#     asserting it: if a later world change makes the two readings differ on
#     these days, that test fails instead of this one grading a filter the
#     ticket never states.
#   * `coalesce(o.loyalty_id, o.customer_ref)`, or keeping the old predicate
#     beside the new one. `customer_ref` is null on every consumer order, so the
#     extra term adds nothing and takes nothing away.
#   * Where the resolve is written — one UPDATE, two statements, a merge, or a
#     rebuild of the partition — as long as the day comes out with the right ids
#     and the call reports what it changed.
#   * The model side. `int_sessions_funnel` has the same gap and the ticket says
#     it moves through change management, not through this ticket; nothing here
#     grades it either way.
#   * The wording of the docstring the ticket asks for. The finding is worth
#     writing down and a phrase match would grade the phrasing, not the finding.
#
# The graded days are 2025-12-11, 2026-04-17 and 2026-05-13, and the ticket
# names none of them. None is a closure day, a spike, one of the January decay
# or replay days, or one of the March migration days; none falls in a reserved
# window; and none is named by any other copperline ticket.
#
# The library is a plain module the DAGs import, so nothing needs replaying
# first: the verifier calls it against the landed feed the world ships.
replay: []

checks:

# The DAG still imports. A syntax or name error in the library takes this DAG
# down and three more with it.
- kind: dag_parses
  dag_id: gro_sessionize_daily

# Sessionization kept its shape: pick the days, rebuild each one, stitch the
# guest orders, count the repeats, hold the grain, record the volume, publish.
# A step that reports a false number is not fixed by deleting the step.
- kind: dag_structure
  dag_id: gro_sessionize_daily
  task_ids:
  - days_to_rebuild
  - build_day
  - stitch_orders
  - replay_duplicates
  - session_grain
  - record_volume
  - publish_sessions

# The substance. See verifier/test_outputs.py — three days the ticket does not
# name, the four populations inside each of them, the number the step reports,
# a rerun, and the feed left whole.
- kind: pytest_verifier
  file: test_outputs.py
  timeout: 900
