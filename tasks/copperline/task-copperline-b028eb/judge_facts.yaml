# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The churn series the replay published. Both figures are `count(*) filter

    (where is_churned)` over `int.int_customer_lifecycle` built from the shipped

    tree with `--vars ''{ds: <day>}''`, measured on the shipped warehouse:

    1,758 for 2025-10-17 and 4,928 for 2026-01-16. They rise across the window

    because the further back the day, the more of the future the build is holding.

    An agent who fixes the model and never looks at what the replay actually

    published cannot produce either.'
  groups:
  - any_of:
    - 'States the churn count for 2025-10-17 is 1,758 (count(*) filter (where is_churned)
      over int.int_customer_lifecycle built with --vars ''{ds: 2025-10-17}'')'
    - Reports 1758 as the published churn figure for the 2025-10-17 replay day
    - Cites 1,758 churned customers for ds = 2025-10-17
  - any_of:
    - 'States the churn count for 2026-01-16 is 4,928 (count(*) filter (where is_churned)
      over int.int_customer_lifecycle built with --vars ''{ds: 2026-01-16}'')'
    - Reports 4928 as the published churn figure for the 2026-01-16 replay day
    - Cites 4,928 churned customers for ds = 2026-01-16
  convicts:
  - Gives a churn count for 2025-10-17 other than 1,758
  - Gives a churn count for 2026-01-16 other than 4,928
  - Claims the churn counts cannot be determined or that the replay published no churn figures
  - Claims the churn series falls (rather than rises) across the window, or that the two days
    have equal/near-equal churn counts
  - Asserts the numbers can be reproduced by simply fixing the model without consulting what
    the replay actually published
- seq: 1
  background: 'The same two days, off a build that answers as of its own day. 34,906 and

    22,911 by the same measurement with `where order_date <= {{ ds() }}` on the

    `orders` CTE. This is the pair that carries the answer: autumn churn fell by

    a third while the replay''s series trebled. Both figures move if the bound is

    written `<` rather than `<=`, so the pair is a check on the fix as well.'
  groups:
  - any_of:
    - Cites 34,906 as one of the two figures measured with `where order_date <= {{ ds() }}`
      on the `orders` CTE
    - States the value 34906 (e.g., autumn churn / first of the pair) for the same two days
      off the day-aware build
    - Reports 34 906 as the count produced under the inclusive `<=` bound
  - any_of:
    - Cites 22,911 as the second of the two figures measured with `where order_date <= {{
      ds() }}` on the `orders` CTE
    - States the value 22911 (e.g., the replay's series) for the same two days off the day-aware
      build
    - Reports 22 911 as the count produced under the inclusive `<=` bound
  convicts:
  - Gives a different pair of numbers for these two days without mentioning 34,906 and 22,911
  - Claims the figures were computed with a strict `<` bound rather than `<=`
  - Asserts autumn churn rose, or that the replay's series fell, contradicting the stated
    direction (fell by a third / trebled)
  - Says the two figures are unaffected by whether the bound is written `<` or `<=`
- seq: 2
  background: 'Parties the 2025-10-17 build published that had not ordered by 2025-10-17.

    23,688 — the shipped build publishes 295,148 parties on every day of the

    window and a bounded build for that day publishes 271,460. The same rows are

    the ones carrying a negative `tenure_days`, so either route gives the figure.'
  groups:
  - any_of:
    - States the answer as 23,688 parties
    - Reports 23688 (with or without comma/space separator) as the count of parties published
      by the 2025-10-17 build that had not ordered by 2025-10-17
  convicts:
  - States a count other than 23,688 as the final answer (e.g., 295,148 or 271,460 given as
    the answer to the question)
  - Claims the shipped build's 295,148 parties is the count of parties that had not ordered
    by 2025-10-17
  - Claims the bounded build's 271,460 parties is the count of parties that had not ordered
    by 2025-10-17
  - Claims the number cannot be determined from the available data
  - Denies that the excess rows correspond to those carrying a negative tenure_days
- seq: 3
  background: 'Rows on the 2025-10-17 build carrying a negative `days_since_last_order`.

    281,883 of the 295,148 published: every party whose last order falls after the

    day the build was given, which eight months from the end of the feed is most

    of the book.'
  groups:
  - any_of:
    - States that 281,883 rows in the 2025-10-17 build carry a negative days_since_last_order,
      i.e. parties whose most recent order is dated after that build's as-of day (out of 295,148
      published parties).
    - Reports 281,883 as the count of rows with a negative recency value on the 2025-10-17
      replay, explained as last order occurring later than the build date.
    - Gives 281,883 negative days_since_last_order rows on 2025-10-17, noting this is most
      of the 295,148-row output because the build day is months before the end of the order
      feed.
  convicts:
  - Claims 281,883 is the total number of parties published by the 2025-10-17 build (the published
    row count is 295,148).
  - Claims the negative days_since_last_order rows are caused by parties with no orders at
    all, or by null/missing order dates, rather than by orders dated after the build's as-of
    day.
  - Claims the row count published on 2025-10-17 differs from the count published on other
    days in the window.
- seq: 4
  background: 'Orders the 2025-10-17 build counted that had not happened by that day.

    1,087,389 — `sum(orders_lifetime)` is 3,413,378 on the shipped build against

    2,325,989 on a bounded one, and the same figure is the count of spine orders

    dated after 2025-10-17. Two routes, one number.'
  groups:
  - any_of:
    - States that 1,087,389 orders were counted by the 2025-10-17 build that had not yet occurred
      as of that date
    - Gives 1,087,389 as the gap between the unbounded lifetime order total (3,413,378) and
      the total of orders actually placed on or before 2025-10-17 (2,325,989)
    - Identifies 1,087,389 as the number of orders dated after 2025-10-17 that the build nonetheless
      aggregated
  convicts:
  - Claims 1,087,389 is a count of customers, parties, or rows rather than orders
  - Claims 1,087,389 is the number of orders that had already happened by 2025-10-17
  - Claims 1,087,389 is the total number of orders published or the full lifetime order sum
- seq: 5
  background: 'Why the nightly has never shown any of this, and what the fix does to it:

    nothing. `ds` is the current day, no order is dated after it, so the bound

    removes no row and the nightly''s answer is identical either side of the fix —

    which the verifier also asserts against the feed. The pattern is written loose

    and spans lines, because this is a claim rather than a figure and every writer

    spells it differently. Both orders are taken.'
  groups:
  - any_of:
    - States that for a nightly run (a build whose ds is the current day), the added upper
      bound on order_date filters out nothing, because no order in the feed is dated later
      than that day
    - States that the nightly's output is identical before and after the fix — same row count,
      same counts and flags — since the bound removes no rows on the current day
    - Says the fix has no effect on the current-day/nightly build, so the bug is only observable
      when replaying a historical ds
  convicts:
  - Claims the nightly run's output changes as a result of the fix (e.g. row counts, churn
    counts, or flags differ after the fix on the current day)
  - Claims the nightly was also affected by the bug, i.e. that the current-day build counted
    future-dated orders
  - Claims the added upper bound removes rows on a current-day run
