# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The two supply rows. `sc_shrink_weekly` values a counted delta off

    `raw.wms_movements`, `sc_supplier_scorecard_weekly` scores off

    `marts.int_po_receipt_matched`, and neither has ever named the sell-through

    mart. These are the two a grep finds, so this is the check a partial answer

    passes.'
  groups:
  - any_of:
    - '`sc_shrink_weekly` should be removed / dropped from the consumer (reader) list'
    - The answer says `sc_shrink_weekly` is not a reader of the sell-through mart — it does
      not read it, never read it, and the entry is stale/wrong/false/no longer valid
    - '`sc_shrink_weekly` computes its counted delta off `raw.wms_movements`, so listing it
      as a downstream reader is incorrect and should be deleted'
  - any_of:
    - '`sc_supplier_scorecard_weekly` should be removed / dropped from the consumer (reader)
      list'
    - The answer says `sc_supplier_scorecard_weekly` does not read the sell-through mart —
      it is not a reader, never read it, and the entry is stale/wrong/false/no longer valid
    - '`sc_supplier_scorecard_weekly` scores off `marts.int_po_receipt_matched`, so listing
      it as a downstream reader is incorrect and should be deleted'
  convicts:
  - Claims `sc_shrink_weekly` is a genuine downstream reader of the sell-through mart and
    should be kept in the list
  - Claims `sc_supplier_scorecard_weekly` is a genuine downstream reader of the sell-through
    mart and should be kept in the list
  - States that `sc_shrink_weekly` reads the sell-through mart (rather than `raw.wms_movements`)
  - States that `sc_supplier_scorecard_weekly` reads the sell-through mart (rather than `marts.int_po_receipt_matched`)
- seq: 1
  background: '`fin_margin_daily`, and the reason. The DAG builds `marts.category_margin`

    from the two shared `int` models its own docstring names, and the dbt model of

    the same name is the row that is true. An agent that removes it without

    saying what the job actually reads has guessed; naming either source is the

    evidence that it read the file.'
  groups:
  - any_of:
    - Says the `fin_margin_daily` row should be removed (dropped/deleted) from the readers
      list
    - States that `fin_margin_daily` does not read / is not a reader of the shared models,
      or that the entry is stale/wrong/false/no longer accurate
  - any_of:
    - Names `int_net_sales_lines` as what the job actually reads (per the DAG / docstring
      for `marts.category_margin`)
    - Names `int_order_lines_costed` as what the job actually reads (per the DAG / docstring
      for `marts.category_margin`)
  convicts:
  - Claims `fin_margin_daily` is a genuine reader of the shared `int` models and should be
    kept in the list
  - Removes the `fin_margin_daily` row without identifying either upstream model (`int_net_sales_lines`
    or `int_order_lines_costed`) that the job actually reads
  - Asserts the dbt model `marts.category_margin` row is the incorrect/stale entry rather
    than the true one
- seq: 2
  background: 'The churn job. It builds its five inputs into `ops.churn_features` and reads

    them back; the mart it does read is `marts.customer_360`, and it is listed

    there already. Naming the table it really reads is what separates the finding

    from a lucky deletion.'
  groups:
  - any_of:
    - The answer says the `cus_churn_scores_weekly` entry should be removed/dropped/deleted
      from the reader list
    - The answer says `cus_churn_scores_weekly` is not a reader / does not read / never reads
      the table in question
    - The answer flags the `cus_churn_scores_weekly` listing as stale, wrong, false, or no
      longer valid
  - any_of:
    - The answer names `ops.churn_features` (or `churn_features`) as the table the churn job
      actually builds and reads back
    - The answer cites the churn job's own file and line as the evidence for the removal (e.g.
      `projects/customer/lib/churn.py:49`), showing what the job really reads
    - The answer states the job's only mart read is `marts.customer_360`, already listed, so the
      `feature_customer_daily` entry is not supported by the code
  convicts:
  - The answer claims the churn job reads `marts.customer_360` as an undocumented or missing
    reader, when it is already listed there
  - The answer claims the churn job has no upstream inputs or reads no tables at all
- seq: 3
  background: 'The row that survives a grep it cannot pass. `fin_ledger_tie` never spells

    `marts.order_economics` out: `config/recon.yml` carries schema `marts`,

    subject `order` and grain `economics`, and the DAG assembles the three. The

    reply has to keep the row AND name the config file, because keeping it by

    accident is not an audit. This is the check that convicts a blanket purge.'
  groups:
  - any_of:
    - The answer names the row `fin_ledger_tie` explicitly.
  - any_of:
    - The answer cites the config file `config/recon.yml` (or `recon.yml`) as the source of
      the dependency.
    - The answer explains that the reference is assembled from schema `marts`, subject `order`,
      and grain `economics` declared in `config/recon.yml`.
  - any_of:
    - The answer states that `fin_ledger_tie` should be kept / stays / is confirmed correct
      or verified as a true dependency.
    - The answer marks `fin_ledger_tie` as a genuine reference to `marts.order_economics`
      that must not be removed.
  convicts:
  - The answer removes, purges, or deletes `fin_ledger_tie` along with the other rows.
  - The answer claims `fin_ledger_tie` has no reference to `marts.order_economics` or is a
    false positive / dead reference.
  - The answer applies a blanket purge of all rows matching the grep without exempting `fin_ledger_tie`.
  - The answer keeps `fin_ledger_tie` but gives no reason, or attributes it to something other
    than the config-assembled identifier (e.g., calls it unclear, manual review needed, or
    coincidence).
- seq: 4
  background: 'The three readers the list has never had, each named beside the module the

    read lives in. All three are cross-project: two customer jobs profile order

    history and behaviour windows off the mart, and growth''s experiment readout

    takes `net_sales_cents` from it. A sweep of `projects/*/dags/` finds none of

    them, so this is the check that separates a reverse sweep from a forward one.'
  groups:
  - any_of:
    - Names the consumer `cus_customer_360_daily` together with the module it lives in, `profile.py`
      (the order-history profile job).
    - States that `cus_customer_360_daily` reads the mart from `profile.py`.
  - any_of:
    - Names the behaviour-window consumer's module `features.py`.
    - Cites `features.py` as one of the three previously-unrecorded downstream readers.
  - any_of:
    - Names the growth consumer gro_experiment_readout_daily together with its module experiments.py.
      Naming the column it pulls is welcome but not required.
    - Names the growth consumer `gro_experiment_readout_daily` together with its module `experiments.py`,
      which pulls `net_sales_cents` from the mart.
    - States that `gro_experiment_readout_daily` reads `net_sales_cents` from the mart in
      `experiments.py`.
  convicts:
  - Claims the mart has no downstream consumers / that the list of readers is complete or
    already accurate.
  - Claims a search of `projects/*/dags/` surfaced these three consumers (they are not found
    by that forward sweep).
  - Asserts the three consumers live within the same project rather than being cross-project.
- seq: 5
  background: 'The registry half, written down. §REG-2 is a claim about the `Reads` column

    and two consumers break it. The reply names both and says what they gained.'
  groups:
  - any_of:
    - The answer identifies C-8 as one of the consumers that violates §REG-2's Reads column
      claim.
    - The answer names C-8 as a breaking consumer.
  - any_of:
    - The answer identifies C-9 as the other consumer that violates §REG-2's Reads column
      claim.
    - The answer names C-9 as a breaking consumer.
  - any_of:
    - The answer states that C-8 and/or C-9 read marts.order_economics (a table not listed
      in their registry Reads column), explaining what each consumer gained by doing so.
    - The answer ties C-8 or C-9 to order_economics as the undeclared read that constitutes
      the §REG-2 violation.
  convicts:
  - The answer claims §REG-2 is not violated, or that no consumers break the Reads column
    claim.
  - The answer names a consumer other than C-8 or C-9 as the violator (e.g., C-7, C-10) instead
    of the correct pair.
  - The answer identifies only one violating consumer and asserts it is the only one.
