# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'Answer 1, the coverage. 23,147 distinct SKUs in the order book against 1,860

    in the change feed. An agent that counts the catalogue and never counts the

    book has not answered the question, and one that counts the book off

    `marts.dim_product` cannot count it at all.'
  groups:
  - any_of:
    - The order book contains 23,147 distinct SKUs.
    - States 23,147 as the distinct SKU count in the order book (not the catalogue).
  - any_of:
    - The change feed covers 1,860 distinct SKUs.
    - States 1,860 as the number of SKUs present in the change feed.
  convicts:
  - Counts only the catalogue (e.g., marts.dim_product) and never counts the distinct SKUs
    in the order book.
  - Derives the order-book SKU count from marts.dim_product rather than the order book itself.
  - Reports a coverage figure other than 1,860 of 23,147 SKUs (e.g., claims full or near-full
    coverage).
- seq: 1
  background: 'Answer 1''s second half. 1,724 is the overlap, and it is the figure that turns

    two populations into a coverage: it is smaller than the catalogue, so 136 SKUs

    the PIM carries have never sold.'
  groups:
  - any_of:
    - The overlap between the two populations is 1,724 SKUs
    - 1,724 SKUs appear in both the PIM catalogue and the sales data
    - 1,724 is the number of SKUs shared by both sources, giving the coverage figure
    - 1724 (written without the comma) is the overlap count
  convicts:
  - States that the overlap is larger than the PIM catalogue
  - Claims all PIM SKUs have sold, i.e. denies that 136 SKUs have never sold
  - Gives an overlap figure other than 1,724 (e.g. 1,860 or 1,588) as the number of SKUs present
    in both populations
- seq: 2
  background: 'Answer 2, and it is a verdict rather than a figure: `check_grain` would not

    have caught it. The three names pin the mechanism — `enrich_publish` left-joins

    this table onto the base, so the order still lands and the grain check still

    ties — and the fourth pattern pins the verdict, because "yes, it would have

    caught it" is wrong and has to be convicted. Patterns are matched with

    re.search and case-insensitively, so they are written loose on purpose.'
  groups:
  - any_of:
    - The answer names the grain check by referring to check_grain (or equivalently 'the grain
      check' / enrich_grain_check) as the check in question.
  - any_of:
    - The answer names enrich_publish (or publish_enriched) as the step/model where the problematic
      join happens.
  - any_of:
    - The answer states that the table is brought in via a left join (left outer join) onto
      the base table, so the order row still lands.
  - any_of:
    - The answer's verdict is that check_grain would NOT have caught it — e.g. it says the
      grain check wouldn't have caught/flagged/fired/noticed the problem, that it is silent
      or blind to it, or that the counts still tie / still pass despite the bug.
    - The answer states, in close proximity to naming check_grain (the grain check), that
      the check never fires, cannot catch it, or stays green anyway.
  convicts:
  - The answer concludes that check_grain WOULD have caught the issue (e.g. 'yes, the grain
    check would have caught it').
  - The answer says the grain check fails, fires, flags, or breaks because of this bug (e.g.
    the counts do not tie / the row count is not equal).
  - The answer answers a number/figure instead of giving the verdict about whether check_grain
    would have caught it.
  - The answer claims the join is an inner join (or otherwise drops the order row), causing
    the grain check to trip.
- seq: 3
  background: 'Answer 3. The open-row count `snapshot_open_rows.sql` will come back with once

    MER-612''s history is there. 1,718 SKUs carry an open row; the number is the

    feed''s, not their statement''s, so this grades the reading of the retirement

    rule and not their build. The ticket asks for both of that statement''s

    figures and only this one is graded: the other is nought, and a bare `0` in a

    page of prose cannot be matched for what it is.'
  groups:
  - any_of:
    - States that 1,718 SKUs have an open (current/in-force) row, i.e. the open-row count
      returned by snapshot_open_rows.sql is 1,718
    - Gives 1,718 as the second figure returned by the snapshot grain check, identifying it
      as the count of SKUs carrying an open row
    - Derives 1,718 as the feed's SKU count minus the SKUs whose latest change is a delete
      (e.g. 1,860 - 142), and calls that the number of SKUs with an open row
  convicts:
  - Gives a different number than 1,718 as the count of SKUs with an open row (e.g. 1,860,
    1,724, 142, 23,147)
  - Claims every SKU in the feed retains an open row / that no SKUs are retired, so the open-row
    count equals the full feed size
  - Claims the open-row count cannot be determined or that the check returns only one figure
- seq: 4
  background: 'Answer 4, which is what the 1,718 turns on: 142 SKUs whose newest change is
    a

    delete. An agent that reads the feed as "newest row per SKU wins" and never

    looks at `operation` gets 1,860 and cannot produce either figure.'
  groups:
  - any_of:
    - 142 SKUs have a delete as their newest (latest) change, so they are retired/removed
      and excluded from the open count
    - The answer states that 142 SKUs are dropped because their most recent feed row is a
      delete operation
    - 142 records are retired/withdrawn/closed out, leaving no open entry for those SKUs
  convicts:
  - Answers 1,860 (or otherwise reports the naive newest-row-per-SKU count) as the final active
    SKU count
  - Ignores the `operation` column entirely and treats the newest row per SKU as automatically
    active
  - Claims no SKUs are deleted/retired in the feed
