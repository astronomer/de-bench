# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The note commerce asked for. Patterns are matched case-insensitively with

    re.search and are written loose on purpose: each pins a named thing or a

    fact, never a phrasing.

    What the run covered. One day, and the day it was: the Sunday that opens the

    week rather than the week that closed. A reply that says "the window was

    wrong" and stops has not told seller-ops anything.'
  groups:
  - any_of:
    - The answer names the week_bounds window (the run's window) as the thing at issue.
  - any_of:
    - The answer states the run covered only one day (a single day / one-day span).
    - The answer states the window's start and end were the same date, so it spanned one day.
  - any_of:
    - The answer identifies the covered day as the Sunday — the Sunday that opens the week,
      not the prior week's close.
  convicts:
  - The answer only says the window was wrong or misconfigured, without stating that the run
    covered a single day.
  - The answer claims the run covered the full week (seven days) or a multi-day span.
  - The answer says the covered day was the Sunday that closed the preceding week, rather
    than the Sunday that opens the week.
- seq: 1
  background: 'Why one day was fatal rather than merely short: the day it held is the day
    of

    the week with no payout on it. This is the half of the find that needs the

    data and not just the code.'
  groups:
  - any_of:
    - The answer states that marketplace payouts / settlement lines are dated on Mondays (payout_date
      lands on a Monday).
    - The answer states that the day the window held (a Sunday) is a day of the week that
      never carries a payout.
    - The answer connects payout_date to Monday in either direction — payouts fall on Mondays,
      or the held day is payout-free.
  - any_of:
    - The answer says the one-day window returned nothing — empty, no rows, no lines, no settlements,
      no payouts, nought, or zero.
  convicts:
  - The answer claims the one-day window merely under-counted (returned rows with wrong values)
    rather than returning nothing.
  - The answer attributes the failure solely to interval arithmetic and never appeals to where
    payout dates actually fall in the data.
- seq: 2
  background: 'Which days it should have covered, and where that comes from. The answer is
    a

    fiscal week — seven days, Sunday to Saturday — and the calendar authors it.'
  groups:
  - any_of:
    - The reporting window is defined by the fiscal week as authored by the fiscal calendar
      (retail calendar / settlement summary source), not by an arbitrary date range.
    - Mentions the fiscal week / fiscal_calendar / retail-calendar / settlement-summary (SS-1
      or SS-3) as the authority that defines the covered days.
  - any_of:
    - States the window is seven days, running Sunday through Saturday.
    - Says it should have covered the full/whole week — the week that closed — i.e., all 7
      days from Sunday to Saturday.
  convicts:
  - Claims the window is defined by a calendar month, quarter, or rolling N-day period rather
    than a fiscal week.
  - States the week runs Monday to Sunday (or any start/end other than Sunday to Saturday).
  - Gives a window shorter or longer than seven days (e.g., 5 business days, 6 days, 14 days).
  - Says the date range is chosen ad hoc by the query/report author rather than authored by
    the fiscal calendar.
- seq: 3
  background: 'The fee schedule, ruled out with a reason. Three patterns because a verdict

    with no reason behind it is a guess: name the suspect, give the fact that

    clears it, and say it is cleared. The fact is the tie''s own shape — one side

    bounded to a week, the other open from that week onwards — and any way of

    saying it does.'
  groups:
  - any_of:
    - The answer refers to the fee schedule component (e.g. "fee schedule", "apply_fee_schedule",
      "settlement_fees", "stale rates", or "the rates") as the suspect being considered.
    - The answer names the fee-schedule logic or its table/function by name when discussing
      the candidate cause.
  - any_of:
    - The answer states that the join/filter on the fee side has no upper bound — e.g. "no
      end", "unbounded", "open-ended", "nothing above it", "only a lower bound", "open at
      the top", or "never closes".
    - The answer describes the condition as matching every payout from that week onwards (e.g.
      "every payout since/after that week", "all payouts from that date on", "payout_date
      >= ...") while the other side is bounded to a single week.
    - The answer states the fee-side comparison sweeps every payout since/after a date (an
      open-ended window forward in time), e.g. 'every payout since', 'all payouts after',
      'every week from', or a payout_date >= filter.
  - any_of:
    - The answer concludes the fee schedule is not the cause — e.g. "not the cause", "not
      what's happening here", "ruled out", "rules it out", "innocent", "not to blame", "cannot
      be", "nothing to do with it", "unrelated", or "it's not the fee schedule".
    - The answer explicitly clears the fee schedule of responsibility for the bug.
  convicts:
  - The answer blames the fee schedule (or stale rates / apply_fee_schedule / settlement_fees)
    as the cause of the bug.
  - The answer says the fee schedule join is correctly bounded on both sides, or claims it
    is bounded to a single week on both sides.
  - The answer gives a verdict on the fee schedule without stating any reason for clearing
    it.
