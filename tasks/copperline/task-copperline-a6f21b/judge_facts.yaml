# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'THE POPULATION. 4,866 of the 11,528 memos in `raw.credit_memos` carry an

    `applies_to_period` that is not the fiscal period their `issued_on` falls in

    — 42.2%, the large minority the ticket is worth writing for. The two counts

    have to sit together, because "4,866 memos" without the book size is not a

    size and the book size alone is not an answer.'
  groups:
  - any_of:
    - States that 4,866 of the 11,528 memos in raw.credit_memos have an applies_to_period
      different from the fiscal period containing their issued_on date
    - Gives both numbers together — 4,866 mismatched memos out of 11,528 total credit memos
    - Reports 11,528 total memos in raw.credit_memos, of which 4,866 carry a cross-period
      applies_to_period
  convicts:
  - Reports only the count of mismatched memos (4,866) without the total book size of 11,528
  - Reports only the total memo count (11,528) without the mismatched count of 4,866
  - States a mismatched-memo count other than 4,866 (e.g. a different number of cross-period
    memos)
  - States a total memo count in raw.credit_memos other than 11,528
  - Claims the mismatch share is a small or negligible fraction rather than roughly 42%
- seq: 1
  background: 'THE MECHANISM AND THE DIRECTION. The reply has to name the column the page

    files by and the date the policy files by, and say that a memo can only land

    early. A reply that gives six figures and never says what is wrong has not

    written a restatement paper.'
  groups:
  - any_of:
    - names the column the page files by as `applies_to_period`
    - refers to the applies-to-period column (e.g. "applies to period")
    - identifies the model `stg_finance__credit_memos` that supplies that column
  - any_of:
    - names `issued_on` as the date §REV-5 books the policy on
    - says the policy files by the issue date / issue-date
    - says the policy files by the date the memo was issued ("the date it was issued")
  - any_of:
    - 'states the direction of the skew: a memo can never land later than its applies-to period'
    - says the memo can only ever be early / always earlier / not after
    - says the issue date cannot come after the period it applies to, i.e. the shift is one-directional
      toward early
  convicts:
  - only lists figures or counts without explaining what is wrong
  - leaves the direction of the discrepancy unstated or says it could go either way
  - claims memos can be issued later than the period they apply to
  - never names either the applies_to_period column or the issued_on date
- seq: 2
  background: 'PERIODS 1 AND 2, the two that hold no foreign currency. FY2025-P01 runs

    2025-02-02 to 2025-03-01 and moves +6,092,825 cents; FY2025-P02 runs

    2025-03-02 to 2025-04-05 and moves +3,796,446. Both are exact under every

    rounding mode, because every memo issued in them is USD. They grade the

    period arithmetic with the conversion rule taken out of it, so a reply that

    read §REV-5''s first paragraph and skipped its second still passes here — and

    fails the next two checks.'
  groups:
  - any_of:
    - States that FY2025-P01's movement/discrepancy is 6,092,825 cents (in any sign convention,
      e.g. +6,092,825 or -6,092,825), or presents 6,092,825 as the P01 difference between
      the correctly-filed credit total and the total the page files
    - Reports 6,092,825 as the P01 gap between should-carry and as-filed credit amounts, written
      with or without separators (6092825, 6,092,825, 6 092 825)
  - any_of:
    - States that FY2025-P02's movement/discrepancy is 3,796,446 cents (in any sign convention),
      or presents 3,796,446 as the P02 difference between the correctly-filed credit total
      and the total the page files
    - Reports 3,796,446 as the P02 gap between should-carry and as-filed credit amounts, written
      with or without separators (3796446, 3,796,446, 3 796 446)
  convicts:
  - Claims that FY2025-P01 or FY2025-P02 contains any non-USD (foreign currency) credit memo,
    or that the P01/P02 figures depend on which FX conversion rule is applied
  - Claims the fiscal periods follow calendar months rather than a 4-5-4 fiscal calendar,
    e.g. saying P01 covers all of January or February 2025
  - States a P01 start date other than 2025-02-02 or a P01 end date other than 2025-03-01
  - States a P02 start date other than 2025-03-02 or a P02 end date other than 2025-04-05
  - Claims a credit memo should be recognized in the fiscal period of the invoice it credits
    rather than the period of its own issue date
  - Claims that converting a credit memo at its own issue-date rate (rather than the rate
    used for the invoice it credits) is the correct treatment
- seq: 3
  background: 'PERIODS 3 AND 4, the first two that carry euro and sterling memos. P3 moves

    -15,183,487 and P4 -11,094,333: the page files 15,183,487 cents of credit

    into P3 that belongs later, and 11,094,333 into P4. These are the two that

    separate the three conversion readings — see the battery above.'
  groups:
  - any_of:
    - Period 3 is misstated by 15,183,487 cents
    - P3 carries a misfiled credit of 15,183,487
    - The P3 discrepancy amounts to 15,183,487 cents
    - 15,183,487 cents of credit belong to a later period, not P3
    - '15183487'
  - any_of:
    - Period 4 is misstated by 11,094,333 cents
    - P4 carries a misfiled credit of 11,094,333
    - The P4 discrepancy amounts to 11,094,333 cents
    - 11,094,333 cents of credit belong to a later period, not P4
    - '11094333'
  convicts:
  - Periods 3 and 4 are correctly stated / show no misfiled credit
  - The credit filed into P3 and P4 legitimately belongs to those periods
  - The euro and sterling memos first appear in a period other than 3 and 4
  - P3 and P4 are irrelevant to distinguishing the three conversion readings
- seq: 4
  background: 'PERIODS 5 AND 6. P5 moves +17,072,084 and P6 -6,056,731. P5 is the largest

    move of the six and P6 turns back the other way, so the pair is also the

    proof that the answer is not one direction repeated.'
  groups:
  - any_of:
    - States that fiscal period FY2025-P05 has the largest movement, a swing of about +17,072,084
      cents (page carries 219,141,291 versus 236,213,375 that should be carried)
    - Reports the P05 discrepancy as 17,072,08x cents in the period table or narrative
    - Gives P5's difference between correct and as-reported credit totals as roughly 17.07
      million cents in the positive direction
  - any_of:
    - States that fiscal period FY2025-P06 moves in the opposite direction by about -6,056,731
      cents (page carries 185,848,585 versus 179,791,854 that should be carried)
    - Reports the P06 discrepancy as 6,056,73x cents with the opposite sign to P05
    - Gives P6's difference as roughly 6.06 million cents of over-carried credit
  convicts:
  - Claims every period moves in the same direction, i.e. that no period's movement has the
    opposite sign from the largest one
  - Names a period other than FY2025-P05 as having the largest absolute movement
  - States that the misfiling can push credit into a later period than the one the memo belongs
    to (i.e. that the error can run late as well as early)
- seq: 5
  background: 'THE PERIOD THAT MOVES FURTHEST, named against its own figure. FY2025-P05,

    2025-06-01 to 2025-07-05, +17,072,084 cents — the account page carries that

    much too little credit in it. The ticket asks for the period by name, so the

    figure has to sit against the label rather than merely appear in a table: a

    reply that names P3 and mentions 17,072,084 in a row somewhere fails.'
  groups:
  - any_of:
    - The answer identifies FY2025-P05 (the period running 2025-06-01 to 2025-07-05) as the
      period with the largest movement, and attaches the figure 17,072,084 cents directly
      to that period's label — e.g. in a sentence naming FY2025-P05 alongside +17,072,084,
      or in a table row whose period label is FY2025-P05 and whose movement/variance cell
      is 17,072,084 (sign positive or written as an understatement of credit).
    - The answer states that FY2025-P05 is the period that moves furthest, with the account
      page carrying 219,141,291 cents of credit when it should carry 236,213,375 cents, a
      difference of 17,072,084 cents, with the period name and the difference appearing together
      in the same statement or the same table row.
    - The answer names FY2025-P05 as the period that moves furthest and attaches to that label a
      movement of roughly 17.07 million cents in the positive direction (an understatement of
      credit), in the same statement or the same table row.
    - The answer identifies FY2025-P05 as moving furthest and reports its movement as 17,07x,xxx
      or 17,06x,xxx cents against that period's label, with the page's carried and correct credit
      totals both near 219.1-219.2 million and 236.2 million cents respectively.
  convicts:
  - The answer names a period other than FY2025-P05 (for example FY2025-P03/P3, P04, P01,
    P02, or P06) as the period that moves furthest or has the largest variance.
  - The answer gives the largest movement as a value other than 17,072,084 cents (for instance
    15,183,487, 16,990,574, or 16,453,971) without identifying 17,072,084 for FY2025-P05 as
    the answer.
  - The answer mentions the figure 17,072,084 only inside a table or list without ever tying
    it to the FY2025-P05 label, so the period that moves furthest is left unnamed or is named
    as a different period.
