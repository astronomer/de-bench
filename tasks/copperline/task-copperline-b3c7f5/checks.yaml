# Nothing here runs a DAG, so nothing needs replaying first.
replay: []

checks:

# The job still imports and the bag is clean.
- kind: dag_parses
  dag_id: fin_invoice_dispute_daily

# The four steps stay. A check that cannot be reconciled is not a check to
# delete, and a publish that raises is not a publish to drop.
- kind: dag_structure
  dag_id: fin_invoice_dispute_daily
  task_ids:
  - build
  - check
  - open_count
  - publish
  operators:
    build: BashOperator
    check: PythonOperator
    open_count: PythonOperator
    publish: PythonOperator

# The substance. See verifier/test_outputs.py: the mart as commerce's model
