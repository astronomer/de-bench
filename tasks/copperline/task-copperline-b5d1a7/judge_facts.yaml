# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The written half. Patterns are matched case-insensitively with re.search and

    are written loose on purpose: each pins a figure or a name, never a phrasing,

    and a number may carry a comma or a space or neither.

    What the flag is true of, and what it is really selecting. The count is one

    read of the feed; the reading is the finding. A reply that gives the number and

    then repeats the note''s own sentence back has not answered the question the

    ticket asked.'
  groups:
  - any_of:
    - States that the ambiguous flag is true on 206,992 orders (accepts 206992, 206 992, or
      206,992).
    - Gives the count of orders carrying the ambiguity flag as roughly 206,992 out of the
      ~914,694 matched orders.
  - any_of:
    - Explains that the flag actually fires when an order has more than one payment attempt
      in the window (a retry or a repeated attempt), not when two orders share a reference.
    - Says candidate_count counts attempts in the lookback window for the order, so >1 means
      the order attempted more than once / retried.
    - Identifies the flag's real meaning as multiple attempts per order rather than the documented
      shared-reference collision.
  convicts:
  - Claims the flag correctly identifies orders whose payment reference is shared by more
    than one order, i.e. accepts the note's stated meaning as accurate.
  - States that a nonzero number of orders are genuinely ambiguous in the sense of two orders
    sharing a reference inside the matching window.
  - Concludes the ambiguity flag is working as documented and needs no reinterpretation.
- seq: 1
  background: 'How much of the estate is ambiguous the way the note describes. The answer
    is

    nought and it is the half of the ticket that says whether the exception queue

    is worth running. The pattern wants the nothing said against the claim it

    answers, either way round; a reply that never reaches the question, or that

    reports the 206,992 as if they were the note''s population, has not settled it.'
  groups:
  - any_of:
    - The answer states that zero rows are ambiguous in the sense the note describes — i.e.
      no attempt is claimed by two different orders.
    - The answer says there are no ambiguous rows / none of the attempts are shared between
      more than one order.
    - The answer says the count of attempts claimed by a second order as well is 0.
    - The answer says not a single attempt has another order referencing the same payment
      attempt.
    - The answer says never does a second order claim the same reference, i.e. the ambiguous
      count is zero.
    - 'The answer reports ''ambiguous rows: 0'' or an equivalent phrasing pairing the ambiguity
      concept with a zero/none/no negator within the same sentence.'
  convicts:
  - The answer reports 206,992 (or any nonzero figure) as the number of ambiguous rows, i.e.
    treats the note's population as the ambiguous population.
  - The answer claims some attempts are shared by two different orders.
  - The answer never addresses how many rows are ambiguous under the note's definition.
  - The answer says the ambiguity count cannot be determined.
- seq: 2
  background: 'How many orders can come back with a different attempt. This is the headline

    and it is not the 206,992: an order with three attempts a day apart has one

    clear winner and never moves. A reply that reports the flag''s population as the

    unstable one fails here.'
  groups:
  - any_of:
    - 59,947 orders can come back with a different attempt (the genuinely unstable population)
    - The headline count of orders whose selected attempt could change is 59,947
    - 59947 orders are ambiguous / tie-prone under reordering
  convicts:
  - Reports 206,992 as the count of unstable orders (orders that could return a different
    attempt)
  - Claims the flagged population of 206,992 multi-attempt orders is the unstable one
  - States that an order with three attempts a day apart is unstable / could return a different
    attempt
- seq: 3
  background: 'What it costs. Two figures, and they are separate questions: how many of the

    unstable orders would publish different money, and the most that money can

    differ over the book. Reaching either means following the pick into

    `int_payment_matched` and netting Meridian''s live events per attempt. The

    ticket asks for the MOST the column could differ, so the maximum over the two

    candidates is what is pinned — a reply that diffs two builds it happened to run

    and reports about half of it has answered a different question.'
  groups:
  - any_of:
    - States that 58,960 of the tied-rank orders would net different Meridian money, i.e.
      the payment/settlement amount published differs depending on which attempt the tie-break
      picks
    - Gives 58,960 as the count of ambiguous-pick orders whose settled amount changes between
      builds
    - Reports 58,960 orders where the two equally-ranked attempts carry different net amounts,
      so the money column is build-dependent
  - any_of:
    - States that the maximum total by which the settled amount column can differ between
      two builds across the whole book is 807,149,253 cents
    - Gives 807,149,253 (cents) as the largest possible aggregate divergence in settled_net_cents
      over all affected orders
    - Reports the worst-case book-wide swing in the money column as 807,149,253 cents, i.e.
      the maximum over the tie candidates rather than a diff of two arbitrary builds
  convicts:
  - Reports the book-wide money divergence as roughly half of 807,149,253 cents (e.g. a figure
    near 403 million cents) or as the difference observed between two particular builds it
    happened to run, instead of the maximum possible divergence
  - Claims the count of orders whose money changes is the same as the total count of tied-rank
    orders (59,947), i.e. fails to distinguish the two figures
  - States that no orders change their published amount, or that the settled amount is unaffected
    by which attempt is picked
- seq: 4
  background: 'The worst day. A tenth of the whole population is on Black Friday, because
    the

    volume spike put the duplicate attempts through in a block. It is the one

    figure that cannot come out of a single aggregate over the feed.'
  groups:
  - any_of:
    - Identifies 2025-11-28 (Black Friday) as the single date carrying the largest concentration
      of the ambiguous/tied duplicate-attempt orders.
    - States the worst-affected day is 2025-11-28, written in any equivalent date format (28
      Nov, November 28).
  - any_of:
    - Gives 6,236 as the count of affected tied orders falling on that single worst day.
    - States that roughly 6,236 of the ~59,947 nondeterministic orders land on 2025-11-28,
      about a tenth of the population.
  convicts:
  - Claims the concentration on the worst day can be obtained from a single aggregate over
    the feed without joining or comparing the tied attempt rows.
  - Claims no single date has an outsized share of affected orders, i.e. that the affected
    orders are spread evenly across dates.
  - Names a date other than 2025-11-28 as the worst day for affected orders.
  - Gives a count other than ~6,236 for the number of affected orders on the worst day.
- seq: 5
  background: 'Which columns move. Two do and five cannot, and the reason is the tie itself:

    attempts that rank level share the day, the outcome and the attempt number by

    construction, so only the intent id and the timestamp beside it can differ.

    `payment_intent_id` and `payment_outcome` are in the ticket; `payment_attempted_at`

    and `payment_attempt_no` are not, and neither is reachable without reading the

    model''s own select list and working out what a tie holds constant.'
  groups:
  - any_of:
    - identifies payment_attempted_at as one of the columns that can differ (moves) between
      tied attempts
    - states that payment_attempted_at is not mentioned in the ticket but is affected/varies
    - explains payment_attempted_at is the timestamp beside the intent id that can differ
      within a rank tie
  - any_of:
    - states payment_attempt_no is held constant by the tie (cannot differ)
    - explains that tied attempts share the attempt number by construction, so payment_attempt_no
      does not move
    - identifies payment_attempt_no as one of the five columns that cannot change
  - any_of:
    - states payment_outcome (is_paid) is constant across tied attempts and therefore cannot
      differ
    - notes payment_outcome is named in the ticket but is one of the columns fixed by the
      tie
    - explains ties rank level on outcome, so payment_outcome / is_paid is shared
  convicts:
  - claims all seven columns can differ between tied attempts
  - claims payment_attempted_at is constant across tied attempts
  - claims payment_attempt_no can differ between tied attempts
  - claims payment_outcome can differ between tied attempts
  - claims only payment_intent_id can differ, omitting payment_attempted_at
  - states that the ticket's columns (payment_intent_id, payment_outcome) are the only ones
    affected
