# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The note finance asked for. Three decisions, and the headline "trade and

    store" is one of them rather than all of them: the second pattern is the

    population that moved, and the third is the answer to "how far does this

    reach", which is the whole difference between repairing a week and fixing a

    pipeline. Patterns are matched case-insensitively with re.search and are

    written loose on purpose — each pins a figure or a named thing, never a

    phrasing.'
  groups:
  - any_of:
    - The answer names "trade" as one of the two channels involved in the misclassification
      decision.
  - any_of:
    - The answer names "store" as the other channel involved.
  - any_of:
    - The answer identifies the moved population as the acquired estate — naming "Northwave"
      or describing it as the "acquired" sites/stores.
  - any_of:
    - 'The answer states the reach is open-ended: every day published from 2 March onward
      (through today / still ongoing) is wrong, not just the fortnight finance flagged.'
    - The answer says the cause is still live / still in the code, so all partitions or files
      since 2026-03-02 remain affected.
    - The answer says the problem is not just that week/fortnight.
    - The answer states the wrong publications run beyond the pulled fortnight — e.g. every
      day published since a date inside the affected span carries the same shift, up to the
      fix landing.
    - The answer states that tonight's/today's file is the first correct one (which asserts
      everything published since the break was wrong).
    - The answer states, from any date inside the affected span, that every day published
      since then carries the shift (an open-ended claim forward), in any tense — 'carries
      it too', 'has carried it since', 'still carries it'.
  - any_of:
    - The answer states that re-publishing or replaying those days before the fix would produce
      the same split / the same numbers / an identical result.
    - The answer says a re-run would reproduce the error, change nothing, or wouldn't help
      until the code is fixed.
  convicts:
  - The answer treats the affected window as only the week or fortnight finance reported,
    implying the problem is bounded and already over.
  - The answer claims re-publishing the affected days would fix or change the figures without
    changing the code.
