# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The note commerce asked for. Patterns are matched case-insensitively with

    re.search and are written loose on purpose: each pins a named thing or a

    figure, never a phrasing.

    Which statement. Naming the file or the step, and saying what is wrong with

    it — a reply that names the DAG and stops has not told seller-ops anything.'
  groups:
  - any_of:
    - Names the publish SQL file settlement_publish.sql as the source of the duplication
    - Refers to the settlement publish statement or file by name
    - Names the publish_week step/task that writes the settlement week to the mart
  - any_of:
    - Says the statement is a plain INSERT INTO the mart with nothing to remove the existing
      week
    - Says the write appends to / adds to the mart rather than replacing the week
    - Says there is no delete (or no delete-then-insert / no partition replacement) before
      the insert, so a re-run leaves the prior rows in place
    - Says the step never deletes or replaces the week's existing rows, so each run stacks
      another copy under the same week_start
  convicts:
  - Blames the processor/marketplace two-feed overlap (or apply_processor_boundary's DELETE) as the cause of the doubling
  - Claims seven distinct fiscal weeks were published, rather than the same single week repeatedly
  - Attributes the doubling to the upstream line-building or the fiscal calendar lookup rather than to the non-idempotent write
- seq: 1
  background: 'Which week the seven dates land on, and that they are one week. This is the

    calendar half of the find: `week_bounds` reads `raw.fiscal_calendar`, and

    2026-02-01 to 2026-02-07 is one fiscal week. The ticket never gives the date.'
  groups:
  - any_of:
    - The answer identifies the affected window as starting 2026-02-01 (February 1, 2026),
      i.e. the seven dates run 2026-02-01 through 2026-02-07.
    - The answer cites the date 2026-02-01 (or '1 February 2026' / 'February 1st, 2026') as
      the first of the seven affected dates.
  - any_of:
    - The answer states that the seven dates all fall within one fiscal week (a single fiscal
      week / the same fiscal week), as determined by week_bounds reading raw.fiscal_calendar.
    - The answer notes that all seven days belong to the same week, i.e. 2026-02-01 to 2026-02-07
      constitutes exactly one fiscal week.
  convicts:
  - The answer gives a different start date for the seven-day window (e.g. a date other than
    2026-02-01) as the affected period.
  - The answer claims the seven dates span more than one fiscal week or straddle a fiscal
    week boundary.
  - The answer claims the affected dates cannot be determined at all, or that the date information
    is unavailable from raw.fiscal_calendar.
- seq: 2
  background: 'The overlap, ruled out with a reason. Three patterns because a verdict with

    no reason behind it is a guess: name the suspect, give the fact that clears

    it, and say it is cleared. Any one of the facts does — that the boundary

    deletes nothing because every row is stamped `marketplace`, or that the

    overlap ended in September 2025, or that one feed cannot double itself.'
  groups:
  - any_of:
    - 'Names the suspect being ruled out: the settlement boundary / apply_processor_boundary
      / the two-feed overlap logic'
    - Refers to the overlap window or boundary filter as the candidate explanation under consideration
  - any_of:
    - States the boundary deletes nothing because every row is stamped 'marketplace' (there
      are no 'processor' rows to delete)
    - States the two-feed overlap ended in September 2025 (2025-09), so the affected data
      falls outside the overlap window
    - States a single feed cannot double itself — only one feed is present, so no duplication
      from overlap is possible
  - any_of:
    - Explicitly delivers the verdict that the boundary/overlap is not the cause — ruled out,
      cleared, innocent, unrelated to the bug
    - Pairs the named suspect with an explicit exoneration ('the settlement boundary is not
      to blame', 'this rules out apply_processor_boundary')
  convicts:
  - Says only that the boundary does not behave as the docstring claims, without ruling the
    boundary out as the cause
  - Leaves the verdict unanchored — a claim about the docstring or the code's description
    rather than a ruling clearing the suspect
  - Blames the settlement boundary / two-feed overlap for the failure, or leaves it as an
    open possibility
  - Gives a verdict with no supporting fact (no mention of marketplace-only stamping, the
    September 2025 end of overlap, or single-feed reasoning)
- seq: 3
  background: 'How far it reaches. The ticket asks whether anything else in commerce

    publishes the same way, and the answer is that seven other statements do. A

    reply that repairs the settlement summary and says nothing about the shape

    has answered the symptom rather than the question.'
  groups:
  - any_of:
    - The answer names other affected publishers/statements beyond the settlement summary
      (e.g. order_economics/economics_publish, fct_returns/returns_publish, refunds_daily/refunds_publish,
      cart_abandon_daily/cart_abandon_publish, recon_exceptions/recon_publish, fct_payments/payments_restore_day,
      close_publish_economics).
    - The answer states that the same publish shape/pattern/defect recurs across all (or several
      other) publish statements in the commerce mart, not just the settlement summary.
    - The answer reports that seven other statements share the identical publish pattern and
      are affected the same way.
  convicts:
  - The answer asserts that the settlement summary is the only statement affected by the defect.
  - The answer asserts that no other publish statements in the commerce mart share this pattern.
  - The answer fixes only the settlement summary and claims the issue is fully resolved with
    no further occurrences to review.
