# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'THE MONTH. May 2026 is FY2026-P04, which runs 2026-05-03 to 2026-05-30 —

    `raw.fiscal_calendar`, and CAL-1''s 4-5-4 pattern. It closed 2026-06-05, the

    5th business day of June, which is the date REV-8''s worked month states.

    Working calendar May instead moves the largest step by a billion cents:

    step 3 over 2026-05-01..2026-05-31 is 10,005,977,807 rather than

    9,006,594,420.'
  groups:
  - any_of:
    - The month is the fiscal period FY2026-P04 (fiscal May), not the calendar month of May
      2026.
    - Identifies the period as FY2026 P04 per raw.fiscal_calendar and CAL-1's 4-5-4 pattern.
  - any_of:
    - FY2026-P04 begins on 2026-05-03.
    - The fiscal period start date is 2026-05-03.
  - any_of:
    - FY2026-P04 ends on 2026-05-30.
    - The fiscal period end date is 2026-05-30.
  - any_of:
    - The period closed on 2026-06-05 (the 5th business day of June). Any citation form counts
      — REV-8, docs/finance-policy.md's worked month, or the ledger's posted_on evidence —
      and no citation at all is also fine.
  convicts:
  - Uses the calendar month 2026-05-01 through 2026-05-31 as the period.
  - States step 3 is 10,005,977,807 (the calendar-May figure) instead of 9,006,594,420.
  - Claims May 2026 runs 2026-05-01 to 2026-05-31 for this calculation.
- seq: 1
  background: 'THE TOTAL. 8,916,119,657 cents, the eight steps added. It is also the sum of

    the five FY2026-P04 rows of `raw.finance_ledger`, so this check alone does

    not separate a derivation from a copy — the seven step checks below do that.

    It is here because it convicts every reply that never gets to a policy at

    all: the invoice headers for the fiscal month add to 8,810,754,248 net of

    tax and 9,611,320,890 with it, and for calendar May to 9,788,455,852 and

    10,677,860,901. The figure has to sit against the claim it answers, so a

    reply that lands elsewhere and mentions this number in passing fails.'
  groups:
  - any_of:
    - The answer states that recognized revenue for FY2026-P04 is 8,916,119,657 cents, presenting
      that figure as the result of the eight-step policy derivation (equivalently, as the
      sum of the five FY2026-P04 rows of raw.finance_ledger).
    - The answer gives the total recognized revenue as 8,916,119,657 cents and attaches it
      directly to the recognized-revenue claim for the fiscal month, not merely mentioning
      the number in passing.
  convicts:
  - The answer never arrives at a recognized-revenue figure derived from the policy, e.g.
    it reports the fiscal-month invoice-header totals 8,810,754,248 (net of tax) or 9,611,320,890
    (with tax) as the answer.
  - The answer reports calendar-May invoice-header totals 9,788,455,852 or 10,677,860,901
    as the recognized revenue figure.
  - The answer lands on some other total as the recognized revenue for FY2026-P04 and only
    mentions 8,916,119,657 incidentally, or not at all.
- seq: 2
  background: 'STEP 3, goods and freight: 9,006,594,420 cents. 48,406 invoice lines with no

    `service_end`, in full on the invoice date, at `line_total_cents` converted

    once at the invoice-date rate (REV-1, REV-7). It is 101% of the month''s

    figure and every other step is a correction to it, so the three ways of

    getting it wrong are the three most expensive mistakes on the ticket:


    8,162,397,121   `line_total_cents - tax_cents`. REV-1''s last paragraph

    says tax is not inside that column; the plan invoice

    header is net + tax and reads as though it were.

    8,820,828,042   no FX conversion, every amount taken as USD (REV-7).

    10,005,977,807  calendar May instead of the fiscal month.'
  groups:
  - any_of:
    - The goods-and-freight (Step 3) figure is 9,006,594,420 cents
    - States 9006594420 cents for the point-in-time goods/freight revenue recognized in the
      fiscal month
  convicts:
  - Gives the Step 3 goods-and-freight total as 8,162,397,121 cents (incorrectly subtracting
    tax_cents from line_total_cents)
  - Gives the Step 3 goods-and-freight total as 8,820,828,042 cents (no FX conversion, treating
    every amount as USD)
  - Gives the Step 3 goods-and-freight total as 10,005,977,807 cents (using calendar May instead
    of the fiscal month)
  - Claims tax_cents is included within line_total_cents and must be subtracted
  - Skips FX conversion and treats all invoice amounts as already USD
  - Uses the calendar month of May rather than the fiscal month for the invoice-date filter
- seq: 3
  background: 'STEP 4, marketplace: 79,621,294 cents net — 81,070,221 of commission and

    fulfilment fees less 1,448,927 of returns posted in the month (REV-14).

    Either presentation passes; the net alone, or the two halves together.


    80,418,718   cancelled orders left in. They carry a ship-confirmation

    date and a commission and never shipped, so REV-14 books

    nothing for them; leaving them in adds 797,424 cents.

    79,589,117   `ship_confirmed_at` read as a UTC calendar day rather than

    converted to the head-office date first. About one order in

    seven changes month.'
  groups:
  - any_of:
    - Step 4 (marketplace) is 79,621,294 cents net.
    - 'Step 4 states the two halves: 81,070,221 cents of commission and fulfilment fees, less
      1,448,927 cents of returns/refunds posted in the month.'
    - Marketplace revenue is given as 81,070,221 gross less 1,448,927 returns, i.e. 79,621,294
      net.
  convicts:
  - Step 4 marketplace revenue is stated as 80,418,718 cents (cancelled orders wrongly included).
  - Step 4 marketplace revenue is stated as 79,589,117 cents (ship_confirmed_at read as a
    UTC calendar day instead of converted to the head-office business date).
- seq: 4
  background: 'STEP 5, gift cards: 44,755,895 cents — 24,147,257 of redemptions and

    20,608,638 of breakage aging out in the month (REV-12). The ticket asks for

    the breakage on its own, so both figures are required; the net or the

    redemption half satisfies the first pattern.


    67,909,175   the escheat column ignored, so every card with a balance at

    24 months breaks. 20 of the 66 rows of

    `raw.gift_card_jurisdictions` carry `escheat_applies`, and

    dropping the test more than doubles the breakage, to

    43,761,918.'
  groups:
  - any_of:
    - Step 5 (gift cards) totals 44,755,895 cents for the month
    - The gift card step's redemption component is 24,147,257 cents
    - Gift card redemptions plus breakage net to 44,755,895 cents
    - Redemptions recognized in the month are 24,147,257 cents
  - any_of:
    - Gift card breakage recognized in the month is 20,608,638 cents
    - The breakage component of the gift card step is 20,608,638 cents, stated separately
      from redemptions
  convicts:
  - Gift card breakage for the month is 67,909,175 cents
  - Gift card breakage for the month is 43,761,918 cents (i.e. presented as the answer rather
    than as the wrong result of ignoring escheat)
  - Cards whose jurisdiction has escheat_applies true still book breakage at 24 months
  - The escheat_applies column of raw.gift_card_jurisdictions is irrelevant to breakage
- seq: 5
  background: 'STEPS 6 AND 7, the two subtractions. Credit memos issued in the month,

    217,620,158 cents, each converted at its invoice''s rate rather than its own

    issue-date rate (REV-5). Write-offs of disputes that closed in the

    customer''s favour, 5,329,569 cents (REV-10).


    10,559,955   `upheld` read as upheld for the customer and written off at

    `disputed_cents`. REV-10 names four statuses and only

    `settled` books, at `settled_cents`; 15 upheld disputes

    resolved in the month and none of them books.'
  groups:
  - any_of:
    - Step 6 subtracts credit memos issued in the month of 217,620,158 cents, each converted
      at its invoice's rate rather than its own issue-date rate per REV-5
    - The credit memo subtraction is 217,620,158 cents
    - 217620158 cents of credit memos are deducted
  - any_of:
    - Step 7 subtracts write-offs of disputes that closed in the customer's favour of 5,329,569
      cents per REV-10
    - The dispute write-off subtraction is 5,329,569 cents
    - 5329569 cents of dispute write-offs are deducted
  convicts:
  - Uses 10,559,955 cents for the dispute write-offs, treating `upheld` disputes as upheld
    for the customer and writing them off at `disputed_cents`
  - Treats the `upheld` status as booking a write-off, when REV-10 names four statuses and
    only `settled` books, at `settled_cents`
  - Includes the 15 upheld disputes resolved in the month in the write-off total
- seq: 6
  background: 'STEPS 1 AND 2, the trade book. 3,712,115 cents of current-era ratable lines

    allocated daily under REV-1 and REV-2, and 4,503,826 of legacy-era plans at

    the fiscal-month grain REV-11 gives them — 70,325 of annual prepay and

    4,433,501 billed monthly. Either presentation passes.


    3,740,503 also passes, paired with a step 8 of -146,554: the policy fixes

    what steps 1 and 8 NET for a line voided mid-month, not the gross split.

    Booking the voided lines'' May days in step 1 and reversing the whole

    recognized-to-date in step 8 moves the same 28,388 cents through both and

    lands the same month. The first matrix run proved a faithful reading does

    this: an agent tied the ledger to the cent per entity with the gross split

    and failed only these two patterns. Adjudicated after that run; see

    worlds/copperline/PLANTED.md.


    4,550,633   the legacy lines cut to daily grain. That is what

    `int_recognition_schedule.sql` in the shipped dbt project

    does, and the worked month warns about it in as many words:

    "the difference is nearly always step 1 against step 2".'
  groups:
  - any_of:
    - Step 1 (current-era ratable revenue allocated daily under REV-1/REV-2) is 3,712,115
      cents
    - Step 1 is 3,740,503 cents, which is acceptable when paired with a step 8 of -146,554
      cents, because the policy fixes the NET of steps 1 and 8 for a line voided mid-month
      rather than the gross split (the same 28,388 cents flows through both and lands in the
      same month)
  - any_of:
    - Step 2 (legacy-era plans at the fiscal-month grain, REV-11) is 4,503,826 cents
    - Step 2 is 4,433,501 cents billed monthly, presented separately from the 70,325 cents
      of annual prepay (4,503,826 = 70,325 + 4,433,501); either presentation passes
  convicts:
  - 'Step 2 is 4,550,633 cents (legacy lines cut to daily grain, as int_recognition_schedule.sql
    in the shipped dbt project does), which the worked month explicitly warns against: ''the
    difference is nearly always step 1 against step 2'''
  - Step 1 is 3,740,503 cents without the accompanying step 8 of -146,554 cents
- seq: 7
  background: 'STEP 8, the REV-6 reversals: 118,166 cents net — or 146,554 gross, paired

    with the step-1 alternate above. A refund requested on or before day 14

    voids the schedule and the whole recognized-to-date amount reverses on the

    day of the request; a refund on day 15 only stops it going forward.


    0   the void branch never fired, which is what happens to anybody

    who reads `raw.credit_memos` or `raw.returns` as REV-6''s

    population instead of `raw.plan_lines.cancelled_on`. The total

    then comes out at 8,916,237,823.

    63,213   the same lines cut to daily grain, per the step-2 note above.'
  groups:
  - any_of:
    - STEP 8 (REV-6 reversals) is 118,166 cents net, paired with the step-1 net figure of
      3,712,115
    - STEP 8 (REV-6 reversals) is 146,554 cents gross, paired with the step-1 alternate gross
      figure of 3,740,503
    - 'Both consistent pairs are shown: 3,712,115 with 118,166 (net) and 3,740,503 with 146,554
      (gross)'
    - The answer shows one internally consistent pairing of the step-1 and step-8 figures
      — 3,712,115 with 118,166, or 3,740,503 with 146,554 — regardless of how the answer itself
      labels them (net/gross labels are not graded, only the figure pairing).
    - The answer pairs a step-1 and a step-8 figure that net to 3,593,949 cents — the trade-book net
      the policy fixes — including 3,741,897 with 147,948, the gross reading that also stops the
      lines REV-6 cancelled forward (`finance-policy.md` step 8). Any internally consistent pair
      netting to that figure is accepted; the policy fixes the net, not the gross split.
  convicts:
  - Reports 0 for STEP 8, i.e. the void branch never fired (using raw.credit_memos or raw.returns
