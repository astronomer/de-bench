  - Reports 63,213 for STEP 8, i.e. the same lines cut to daily grain
  - Mixes the spellings inconsistently, e.g. 3,740,503 gross in step 1 beside 118,166 net
    in step 8 (or 3,712,115 net beside 146,554 gross)
