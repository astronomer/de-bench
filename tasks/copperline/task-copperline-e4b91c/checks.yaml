# The AR export carries two tax numbers and only one of them is a tax.
#
# THE HEADER. `raw.invoices.tax_cents` is a flat rate of the invoice, rounded.
# On a goods invoice it is `round(total_cents * 0.0833)` and on a plan invoice it
# is `round(net_cents * 0.0833)`; one of the two holds on every row of the table,
# in every market and in every year. The effective rate on the header is 8.33 per
# cent of the invoice in the US, in Great Britain, in Ireland and in Poland
# alike, which is the whole of the evidence that it is not a tax calculation.
#
# THE LINES. `raw.invoice_lines.tax_cents` is the tax the order charged. It sums,
# invoice by invoice, to `raw.orders.tax_cents` on every goods invoice there is,
# and the rates it produces are the market rates — about 5.4 per cent across the
# US book, 15.5 on the British one, 17.8 on the Irish one. That is the
# corroboration the ticket asks for and it comes from a feed the AR export does
# not write.
#
# WHY THE GROUP NUMBER HIDES THE ERROR. One flat rate standing in for nine does
# not fail in one direction. The US book is overstated by more than the whole
# group difference, and Canada, Great Britain, Ireland, Germany, Brazil, Mexico
# and Poland are every one of them understated. A working paper that gives the
# group figure and stops has reported the smaller half of the error, which is
# why the ticket asks for the market table and for the worst market by name.
#
# WHY THE PLAN BOOK TIES. The plan invoice's line carries the same flat rate the
# plan invoice's header carries, so the header-to-line tie on that book is the
# rate agreeing with itself. It is not assurance and the ticket asks the writer
# to say so.
#
# THE RESIDUAL. Put the line tax on the header and the header still does not come
# to its own lines. `raw.invoices.total_cents` is `raw.orders.grand_total_cents`,
# which is net of the order-level discount, and no invoice line carries that
# discount. The gap is `raw.orders.order_discount_cents` to the cent, on the
# invoices that have one.
#
# NOTHING HERE HOLDS AN AUTHORED VALUE. The verifier recomputes both totals, the
# difference, the market split, the residual and the invoices carrying it from
# `raw.invoices`, `raw.invoice_lines` and `raw.orders` in the same session, and
# reads the figures out of `RESPONSE.md` whatever way round and whatever units
# the writer chose. Its first test asserts the five facts above against the world
# before it grades a word of the reply.
#
# COST. No DAG runs, no replays, no dbt. The verifier reads three landed tables
# and one file.
#
# THE WRONG ANSWERS, and what convicts each:
#
#   quote the header tax and file it        the line-tax, difference, market and
#                                           residual tests
#   quote the line tax and stop             the header-tax and difference tests
#   repeat what the invoice fact table      every verifier figure is absent
#     says — that the ERP splits the
#     header at a different point — with
#     no measurement behind it
#   read the tables unqualified through     the frozen `nwv` copy sits first on
#     the house library                     the search path and carries
#                                           `raw.invoices` under the same name:
#                                           114,031 rows and 16,030,641,860 cents
#                                           of header tax. Every figure comes out
#                                           a fifth low or worse
#   measure one fiscal month or one year    out by an order of magnitude
#     and scale it up
#   give the group difference and stop      the worst-market test, and both
#                                           direction patterns on the prose
#   take what is left over as the header    that gap is the residual plus the tax
#     net against the line net              difference and answers a question the
#                                           ticket did not ask; it is 42% above
#                                           the figure the residual test wants
#   count every invoice, or the whole       the count test wants the invoices
#     goods book, as carrying a residual    that carry one
#   quote effective rates instead of        the ticket asks for integer cents;
#     totals                                every verifier figure is absent
#   close the disagreement by editing a     do_not_modify: dbt/** and projects/**
#     model or a job                        are critical gates and the ticket
#                                           says so in words
#   call the plan book's tie assurance      the plan prose check
#
# DEFENSIBLE ALTERNATIVES THAT PASS, and are not convicted:
#
#   the goods book alone rather than the whole export. The plan invoices are
#   0.12 per cent of the header total and 0.14 per cent of the line total, both
#   inside the tolerance, and the difference, the residual and the count are the
#   same figure either way because the plan book carries the flat rate on both
#   sides and cancels.
#
#   a market table with two columns rather than three. The worst-market test
#   takes the two sides of the subtraction in place of the subtraction.
#
#   working in dollars rather than cents. Every money figure is read both ways.
#
#   splitting the plan invoices out of the market table. They are all filed under
#   US and they cancel, so the US row's difference does not move.
replay: []

checks:

# The six figures, against the world's own arithmetic. See
# verifier/test_outputs.py: the two totals, the difference, the market the flat
# rate overstates most, the residual and the invoices carrying it, every one of
# them recomputed from raw.
- kind: pytest_verifier
  file: test_outputs.py
  timeout: 600

# The working paper's claims. Patterns are matched case-insensitively with
# re.search and are written loose on purpose: each pins a rate, a column name, a
# fact or a direction, never a phrasing, and a table row satisfies them as
# readily as a sentence.

# What the header number is. The rate has to be on the page, and it has to be
# stated as the rule for the book rather than as an observation about one
# invoice. A reply that says "the header tax looks wrong" has not said what it
# is.
- kind: file_contains
  path: RESPONSE.md
  matches:
  # "833 bps" is the world's own unit for the same rate; a reply in basis
  # points has read the figure, not dodged it.
  # The rate is bound to the header it describes: unanchored, "a flat 833 bps
  # applied to every line — the headers carry the real VAT" passed, and that
  # is the polarity flip the wrong-answer battery names.
  - '((header|invoices?\.tax_cents)[^\n]{0,40}(is|are|carries|holds|=)?[^\n]{0,25}(a )?(flat |constant |fixed |single |one )*(8\.33|0\.0833|1/12|one[- ]twelfth|\b833\b\s*(bps|basis)))'
  - '((8\.33|0\.0833|1/12|one[- ]twelfth|\b833\b\s*(bps|basis))[^\n]{0,80}(flat|constant|fixed|uniform|plug|hard-?coded|does ?n.?t vary|does not vary|never varies|same (rate|everywhere|in every)|regardless|irrespective|single rate|one rate|not a (real )?(tax )?(rate|calculation)|every (invoice|row|market|entity)|all [0-9][0-9,]{4,})|(flat|constant|fixed|uniform|plug|hard-?coded|does ?n.?t vary|does not vary|never varies|same (rate|everywhere|in every)|single rate|one rate)[^\n]{0,80}(8\.33|0\.0833|1/12|one[- ]twelfth|\b833\b\s*(bps|basis)))'

# Which number is the tax we charged, and the evidence from outside the AR
# export. The ticket asks for corroboration in as many words, and the order feed
# is where it is: the line tax sums to `raw.orders.tax_cents` on every goods
# invoice. A reply that prefers the lines because they look more detailed has
# asserted rather than shown.
- kind: file_contains
  path: RESPONSE.md
  matches:
  - '(raw\.orders|order feed|order spine|orders\.tax_cents|order header|the orders table)'
  - '((tax_cents|line tax|invoice lines?|lines)[^\n]{0,90}(ties?|tie to|match|matches|agree|agrees|equal|identical|reconcile|to the cent|the same)|(ties?|match|matches|agree|agrees|equal|identical|reconcile|to the cent)[^\n]{0,90}(raw\.orders|order))'

# The direction, market by market. One flat rate standing in for nine overstates
# the US book and understates every market that charges VAT, and the group figure
# is what is left after they cancel. A reply that reports the group difference as
# the size of the error fails here.
- kind: file_contains
  path: RESPONSE.md
  matches:
  - '(over-?stat|over-?charg|over-?declar|too high|inflat|over-?report)'
  - '(under-?stat|under-?charg|under-?declar|too low|the other way|opposite|reverse|short by|under-?report)'
  - '(\bGB\b|United Kingdom|Britain|British|\bIE\b|Ireland|Irish|\bDE\b|Germany|German|\bCA\b|Canada|Canadian)'

# The plan invoices, and what their tie is worth. It is the flat rate on the
# header agreeing with the flat rate on the line, so it is no assurance at all.
# The reply this is aimed at is the one that offers the plan book as proof the
# header is sound; the second pattern is what convicts it.
- kind: file_contains
  path: RESPONSE.md
  matches:
  - '(plan invoice|plan book|plan line|plan-?only|\bplan\b)'
  - '(both sides|same (flat )?(rate|plug|figure|number|calculation|formula)|agrees? with itself|proves? nothing|worth nothing|no assurance|not assurance|no comfort|circular|tells (us )?nothing|says nothing|no evidence|not evidence|meaningless|vacuous)'

# What is left over. The order-level discount sits on the invoice header,
# because the header total is the order's grand total, and it reaches no invoice
# line. Naming the column is the last step of the reconciliation and the ticket
# asks for it.
- kind: file_contains
  path: RESPONSE.md
  matches:
  - '(order_discount_cents|order-?level discount|header discount|order discount)'
  # "never pushed down to the invoice lines" is the same fact as "reaches no
  # line"; the verb family joined after a trace audit found it convicted.
  - '(no (invoice )?line|not on any line|reaches no line|never reaches|never (pushed|passed|carried|allocated|spread)[^\n]{0,60}lines?|no line (carries|holds)|missing from the lines|absent from the lines|off the lines|not carried|is not on the lines|only on the header|header only)'
