# The judge's answer key for this task's RESPONSE.md prose checks — what each
# check requires, as plain facts. Generated from the regex patterns and rubric
# comments in checks.yaml, calibrated against the solution, and reviewed; the
# patterns in checks.yaml remain as provenance. Grading semantics: a check
# passes only if the answer states at least one fact from EVERY group; stating
# anything in `convicts` fails the check outright. `seq` is the check's
# ordinal among this task's file_contains checks on RESPONSE.md, in file
# order — the same order score.json labels them.
checks:
- seq: 0
  background: 'The write-up''s claims. Patterns are matched case-insensitively with re.search

    and are written loose on purpose: each pins a column name, a fact or a

    direction, never a phrasing, and a table row satisfies them as readily as a

    sentence.

    The finding the header never names. The three patterns want the two sides of

    the subtraction named and the asymmetry stated: one side carries tax and the

    other does not. A reply that says "there is a tax difference" without naming

    either column has not shown where it looked.'
  groups:
  - any_of:
    - Names the till-side column of the tie, e.g. till_net_cents (or the underlying raw net_cents),
      as one side of the subtraction.
    - Refers to net_cents / till_net_cents as the POS side of the comparison, including inside
      a formula or table row.
  - any_of:
    - 'Names the order-side quantity of the tie: booked_cents (or order_discount_cents, or
      the subtotal_cents it is built from).'
    - States that the order side is booked_cents minus order_discount_cents, or that booked_cents
      comes from subtotal_cents.
  - any_of:
    - Mentions tax explicitly, e.g. tax_cents or the word tax, as a component of the discrepancy.
    - Quantifies a tax term contributing to the variance.
  - any_of:
    - 'States the asymmetry: the till/net_cents side includes tax while the order/booked side
      excludes it (any phrasing that puts tax on one side and not the other).'
    - Says tax is added into or carried by net_cents, or that subtotal_cents / booked_cents
      is before or without tax.
    - Says the tie does not use tax_cents / tax sits on only one side of the comparison.
  convicts:
  - Claims there is a tax difference without naming either the till-side column (net_cents/till_net_cents)
    or the order-side column (booked_cents/subtotal_cents).
  - Claims the 23:05 store-local trading day boundary contributes cents to the gap.
  - Claims the pre-cutover NULL event_time_utc contributes cents to the gap.
  - Claims voided transactions are the largest or sole cause of the variance.
  - Claims the tie failures are confined to a small tail of store-days rather than essentially
    all of them.
- seq: 1
  background: 'The trading-day reason, called what it is. The 23:05 close batch is real and

    the header''s mistake is to put it on this tie, so the reply has to name both

    dates and say the reason moves nothing. The second pattern takes the claim in

    either order, and takes any of the words a writer reaches for to say nothing.'
  groups:
  - any_of:
    - The reply names the business_date column.
  - any_of:
    - The reply names the local_order_date column (or order_date).
  - any_of:
    - The reply states that the business_date / order_date pair contributes nothing to the
      discrepancy — e.g. the two date columns are identical, agree, are the same date, never
      differ, or account for zero cents.
    - The reply states that the trading-day / 23:05 close-batch reason moves nothing here
      — e.g. the close batch contributes nothing, explains nothing, or accounts for zero cents
      on this tie.
  convicts:
  - The reply blames the 23:05 close batch (or the trading-day boundary) as a cause of the
    discrepancy, e.g. saying the close batch is the main cause even while noting the dates
    fall on the same day.
  - The reply pairs the batch or trading-day tokens only with equality words (identical, the
    same, same day, agree) rather than a says-nothing word, leaving the batch credited as
    an explanation.
  - The reply omits the business_date column name.
  - The reply omits the local_order_date (or order_date) column name.
- seq: 2
  background: 'The pre-cutover reason, called what it is. `event_time_utc` is NULL for every

    store transaction before 2025-11-03 and that is a real seam in this world —

    STO-419 is built on it — but neither side of this comparison reads the column,

    so it puts nothing in. The reply has to say so.'
  groups:
  - any_of:
    - The reply names the `event_time_utc` column explicitly.
    - The reply refers to the UTC stamp / UTC column / UTC timestamp on store transactions.
  - any_of:
    - The reply states that `event_time_utc` (or the UTC stamp/column/timestamp) contributes
      zero / nothing / no cents to the discrepancy.
    - The reply states that neither side of the comparison reads, uses, or references `event_time_utc`
      (or the UTC column/stamp).
    - The reply states that the pre-cutover NULL UTC stamps / the cutover / the standardisation
      play no part in, do not enter, and do not explain the gap.
    - The reply states that zero / nil / nothing of the difference comes from `event_time_utc`,
      the UTC column/stamp, or the cutover.
  convicts:
  - The reply attributes some or all of the discrepancy to the NULL `event_time_utc` values
    or to the pre-cutover seam.
  - The reply claims that either side of the comparison reads or depends on `event_time_utc`.
  - The reply denies that `event_time_utc` is NULL for store transactions before 2025-11-03,
    or claims the pre-cutover seam is not real.
- seq: 3
  background: 'The third part of the gap, which is in no header and in no runbook: the order

    spine drops the test orders and the soft-deleted ones, and the registers sent

    both. `stg_sales__orders` says it does this in its own docstring, and finding

    that docstring is the last step of the measurement.'
  groups:
  - any_of:
    - The answer notes that the order spine excludes test orders (is_test rows).
    - The answer mentions the is_test flag as one of the filters applied.
    - The answer says test orders are dropped from the spine but were included in the register
      totals.
  - any_of:
    - The answer notes that the order spine excludes soft-deleted orders (deleted_at is not
      null).
    - The answer mentions the deleted_at column / soft-delete filter as the second exclusion.
    - The answer says soft-deleted orders are dropped from the spine but were counted by the
      registers.
  - any_of:
    - The answer attributes these exclusions to stg_sales__orders, citing its docstring/model
      comment as the source.
    - The answer identifies the staging model as the place where the filtering happens.
    - The answer states the order spine filters/drops/removes these rows while the registers
      send both, explaining the third part of the gap.
  convicts:
  - The answer claims the order spine includes test orders and soft-deleted orders (i.e.,
    no such filtering exists).
  - The answer states this third gap component is documented in a header comment or runbook.
  - The answer attributes the test/soft-delete filtering to a model other than stg_sales__orders
    (e.g., claims it happens in the registers or downstream marts).
  - The answer claims the registers also exclude test and soft-deleted orders, so no discrepancy
    arises from them.
- seq: 4
  background: 'What an honest tie would compare. Two things: the two sides made the same

    quantity, and the tie still able to go red for something. The ticket asks for

    both in as many words, and a reply that answers "compare like with like" and

    stops has not said what the test would still catch.'
  groups:
  - any_of:
    - Says the comparison must put both sides on the same basis with respect to tax — e.g.
      add tax_cents to (or exclude it from) both sides, include tax on both sides, compare
      gross-of-tax to gross-of-tax or pre-tax to pre-tax
    - Says the two totals must be compared like for like / like with like / on the same footing
      or same quantity, rather than one side including tax and the other not
  - any_of:
    - Says the corrected tie must still be able to fail — it would still go red / still catch
      a genuine break for things like a missing or late batch, a partial file, a store that
      sent nothing, or a shortfall
    - Names a real discrepancy the check would still surface (missing_batches, late_batches,
      a batch that never arrived, a genuine gap or real difference), i.e. the fix does not
      make the check vacuously pass
  convicts:
  - Only says to 'compare like with like' or 'put both sides on the same basis' without stating
    that the tie must still be able to fail on a genuine break
  - Claims the reconciliation should be made to always pass, or that the tolerance should
    be widened / the check disabled so it never goes red
  - Says tax should simply be dropped or ignored on one side only, leaving the two sides on
    different bases
  - Asserts the existing check is already correct and no change to the comparison basis is
    needed
