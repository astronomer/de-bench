# Enforced by plat_contracts_enforce. Prose contract: contracts/merch-dashboards.md
model: marts.order_economics
consumer: C-4
owner: commerce
grain: [order_id]
columns:
  - {name: order_id, type: string, required: true}
  - {name: order_date, type: date, required: true}
  - {name: channel, type: string, required: true, accepted_values: [store, web, marketplace]}
  - {name: booked_cents, type: bigint, required: true}
  - {name: net_sales_cents, type: bigint, required: true}
  - {name: merch_margin_cents, type: bigint, required: false}
tests:
  - unique: [order_id]
  - not_null: [order_id, order_date, channel, booked_cents, net_sales_cents]
  - no_floats_in: [booked_cents, net_sales_cents, merch_margin_cents]
