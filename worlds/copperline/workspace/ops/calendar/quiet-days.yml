# Days Copperline expects to be quiet, agreed in advance.
#
# A window here is a day where low or absent volume is the expected outcome.
# Anything watching volume or freshness reads this file so that a known quiet
# day does not page. Owned by growth; add a window before the day, not after.
#
# This is not the trading calendar. `raw.market_calendar` holds which markets
# trade on which dates. This file holds the exceptions somebody agreed.

