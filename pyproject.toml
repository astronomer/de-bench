[project]
name = "de-bench"
version = "0.1.0"
description = "Data-engineering agent benchmark: runs coding agents on Airflow/dbt tasks in Modal and compares price-performance"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "agent-trajectory>=0.2.5",
    "matplotlib>=3.11.1",
    "modal>=1.5",
    "pyyaml>=6.0",
]

[project.scripts]
de-bench = "de_bench.cli:main"

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/de_bench"]
